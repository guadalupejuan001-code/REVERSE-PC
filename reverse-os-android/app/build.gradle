plugins { id 'com.android.application' }
android {
 namespace 'com.reversepc.os'
 compileSdk 35
 defaultConfig {
  applicationId 'com.reversepc.os'
  minSdk 29
  targetSdk 35
  testInstrumentationRunner 'com.reversepc.os.WorkbenchTestRunner'
  versionCode 120
  versionName '1.2.0'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }

 }
 flavorDimensions 'edition'
 signingConfigs {
  debug {
   storeFile file(System.getenv('REVERSE_SIGNING_KEYSTORE') ?: System.getProperty('user.home')+'/.android/reverse-desktop.jks')
   storePassword 'android'
   keyAlias 'reverse-desktop'
   keyPassword 'android'
  }
 }
 productFlavors {
  classic { dimension 'edition'; applicationId 'com.reversepc.os'; manifestPlaceholders = [appLabel:'REVERSE OS'] }
  desktop { dimension 'edition'; applicationId 'com.reversepc.desktop'; manifestPlaceholders = [appLabel:'REVERSE Desktop'] }
  workbench { dimension 'edition'; versionCode 310; versionName '3.1.0-completo'; applicationId 'com.reversepc.workbench'; manifestPlaceholders = [appLabel:'REVERSE Workbench'] }
  control { dimension 'edition'; versionCode 310; versionName '3.1.0-completo'; applicationId 'com.reversepc.control.workbench'; manifestPlaceholders = [appLabel:'REVERSE'] }
  complete { dimension 'edition'; versionCode 310; versionName '3.1.0-completo'; applicationId 'com.reversepc.complete.workbench'; manifestPlaceholders = [appLabel:'REVERSE'] }
  rxe { dimension 'edition'; applicationId 'com.reversepc.desktop.rxe'; manifestPlaceholders = [appLabel:'REVERSE Desktop RXE'] }
 }
 sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}

// The unified release requires the pinned complete assets and both JNI bindings.
tasks.register('verifyUnifiedRelease') { doLast {
 def assets = file('src/main/assets')
 ['bbyq-x09/x09.properties','bbyq-x09/model.rvp.gz','bbyq-x09/dictionary/pages.data','bbyq-x09/campaign/campaign-role.rxe','laplace/x002-resumen.json','laplace/mundo-archivado.json','velocity/render.xi'].each { name -> if (!new File(assets,name).isFile()) throw new GradleException('Missing unified release asset: '+name) }
 ['arm64-v8a','x86_64'].each { abi -> ['libreverse_os.so','libregraphics.so'].each { lib -> if (!file('src/main/jniLibs/'+abi+'/'+lib).isFile()) throw new GradleException('Run integration/unified/prepare-native.mjs first') } }
} }
tasks.configureEach { task -> if (task.name ==~ /merge(Complete|Control|Workbench).*Assets/) task.dependsOn('verifyUnifiedRelease') }
