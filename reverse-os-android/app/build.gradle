plugins { id 'com.android.application' }
android {
 namespace 'com.reversepc.os'
 compileSdk 35
 defaultConfig {
  applicationId 'com.reversepc.os'
  minSdk 29
  targetSdk 35
  versionCode 100
  versionName '1.0.0'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17' } }
 }
 flavorDimensions 'edition'
 productFlavors {
  classic { dimension 'edition'; applicationId 'com.reversepc.os'; manifestPlaceholders = [appLabel:'REVERSE OS'] }
  desktop { dimension 'edition'; applicationId 'com.reversepc.desktop'; manifestPlaceholders = [appLabel:'REVERSE Desktop'] }
 }
 externalNativeBuild {
  cmake {
    path 'src/main/cpp/CMakeLists.txt'
    version '3.22.1'
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}
