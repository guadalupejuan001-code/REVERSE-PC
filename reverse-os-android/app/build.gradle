plugins { id 'com.android.application' }
// The primary APK must carry the personal curriculum. A later packaging step
// cannot silently substitute the older BBY Q executable.
tasks.register('verifyBbyqPersonalX01') {
 doLast {
  def assetsDir = file('src/main/assets')
  def manifestFile = new File(assetsDir, 'bbyq-interface/manifest.json')
  if (!manifestFile.isFile()) throw new GradleException('Prepare BBY Q X01 assets before building the APK')
  def personal = new groovy.json.JsonSlurper().parse(manifestFile).personalization
  if (personal?.version != 'X01' || personal.schema != 1 || personal.lessons != 59 || personal.upgrade_file != 'upgrade-x01.rxe') throw new GradleException('X01 personal curriculum is required')
  ['native-apps/BBY-Q.rxe': personal.executable_sha256, 'bbyq-interface/upgrade-x01.rxe': personal.upgrade_sha256].each { name, expected ->
   def asset = new File(assetsDir, name)
   if (!asset.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString() != expected) throw new GradleException('BBY Q X01 asset missing or replaced: '+name)
  }
 }
}
tasks.configureEach { task ->
 if (task.name ==~ /merge(Control|Workbench).*Assets/) task.dependsOn('verifyBbyqPersonalX01')
}
android {
 namespace 'com.reversepc.os'
 compileSdk 35
 defaultConfig {
  applicationId 'com.reversepc.os'
  minSdk 29
  targetSdk 35
  testInstrumentationRunner 'com.reversepc.os.WorkbenchTestRunner'
  versionCode 120
  versionName '1.2.0'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17' } }
 }
 flavorDimensions 'edition'
 signingConfigs {
  debug {
   storeFile file(System.getenv('REVERSE_SIGNING_KEYSTORE') ?: System.getProperty('user.home')+'/.android/reverse-desktop.jks')
   storePassword 'android'
   keyAlias 'reverse-desktop'
   keyPassword 'android'
  }
 }
 productFlavors {
  classic { dimension 'edition'; applicationId 'com.reversepc.os'; manifestPlaceholders = [appLabel:'REVERSE OS'] }
  desktop { dimension 'edition'; applicationId 'com.reversepc.desktop'; manifestPlaceholders = [appLabel:'REVERSE Desktop'] }
  workbench { dimension 'edition'; versionCode 251; versionName '2.5.1'; applicationId 'com.reversepc.workbench'; manifestPlaceholders = [appLabel:'REVERSE Workbench'] }
  control { dimension 'edition'; versionCode 251; versionName '2.5.1-control'; applicationId 'com.reversepc.control.workbench'; manifestPlaceholders = [appLabel:'REVERSE'] }
  rxe { dimension 'edition'; applicationId 'com.reversepc.desktop.rxe'; manifestPlaceholders = [appLabel:'REVERSE Desktop RXE'] }
 }
 externalNativeBuild {
  cmake {
    path 'src/main/cpp/CMakeLists.txt'
    version '3.22.1'
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}

// Required by the owner for future primary APKs. Assets are committed and
// reproducible; there is no implicit localhost server or build-time download.
tasks.register('verifyLaplaceIntegration') {
 doLast {
  def repo = rootProject.projectDir.parentFile
  def lockFile = new File(repo,'laplace-android/integration-lock.json')
  if (!lockFile.isFile()) throw new GradleException('Falta la integración LAPLACE de esta conversación')
  def lock = new groovy.json.JsonSlurper().parse(lockFile)
  if (lock.schema != 3 || lock.upstream != '06ebce4bddf25d615cefd85ed24081f37504a492' ||
      lock.stock_model != 'XN01-native-XI' || lock.native_XI_used_for_stock_prediction != true ||
      lock.native_XI_used_for_all_markets != true || lock.files.size() < 12 ||
      !(lock.market_assets instanceof List) || !['BTC-USD','SPY','AAPL','NVDA'].every { lock.market_assets.contains(it) })
    throw new GradleException('Contrato LAPLACE M001+XN01 incompatible')
  lock.files.each { name, expected ->
   def asset = new File(repo,name)
   if (!asset.canonicalPath.startsWith(repo.canonicalPath+File.separator) || !asset.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString() != expected) throw new GradleException('LAPLACE ausente o sustituido: '+name)
  }
  if (!file('src/main/AndroidManifest.xml').text.contains('android:name=".LaplaceActivity"') || !file('src/main/java/com/reversepc/os/WorkbenchActivity.java').text.contains('void openLaplace()') || !file('src/main/assets/workbench/desktop.js').text.contains("if(app==='laplace')")) throw new GradleException('LAPLACE no está enlazado al escritorio')
 }
}
tasks.configureEach { task ->
 if (task.name ==~ /merge(Control|Workbench).*Assets/ || task.name ==~ /compile(Control|Workbench).*JavaWithJavac/) task.dependsOn('verifyLaplaceIntegration')
}
