plugins { id 'com.android.application' }

android {
    namespace 'com.reversepc.spaceglitch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.reversepc.spaceglitch'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
