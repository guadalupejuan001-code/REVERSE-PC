plugins { id 'com.android.application' }

android {
    namespace 'com.reversepc.boardwalk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.reversepc.boardwalk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
