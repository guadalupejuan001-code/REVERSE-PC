name: XGamingLab C05 333 Architecture

on:
  push:
    branches:
      - feature/xgaminglab-c05-333-20261111
    paths:
      - '.xgaminglab-c05/**'
      - '.github/workflows/xgaminglab-c05.yml'
  pull_request:
    paths:
      - '.xgaminglab-c05/**'
      - '.github/workflows/xgaminglab-c05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"

      - name: Reconstruct exact XGamingLab 3.1
        shell: bash
        run: |
          set -euo pipefail
          cat .xgaminglab-source/part* > "$RUNNER_TEMP/xgaminglab-3.0.0.tar.gz"
          mkdir -p "$RUNNER_TEMP/xgaminglab"
          tar -xzf "$RUNNER_TEMP/xgaminglab-3.0.0.tar.gz" -C "$RUNNER_TEMP/xgaminglab"
          cat .xgaminglab-overlay/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/gpu-virtual-resolved-3.1.patch"
          cd "$RUNNER_TEMP/xgaminglab"
          patch -p1 --forward --batch < "$RUNNER_TEMP/gpu-virtual-resolved-3.1.patch"
          grep -q 'gpu_virtual_resolved_stream' native/scene_renderer.cpp

      - name: Apply REgraphics C04
        shell: bash
        run: |
          set -euo pipefail
          cat .xgaminglab-c04/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/regraphics-c04.patch"
          cd "$RUNNER_TEMP/xgaminglab"
          patch -p1 --forward --batch < "$RUNNER_TEMP/regraphics-c04.patch"
          grep -q 'regraphics_c04_effect_layer' native/scene_renderer.cpp

      - name: Apply C04 finalization
        shell: bash
        run: |
          set -euo pipefail
          cat .xgaminglab-c04-final/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/regraphics-c04-final.patch"
          cd "$RUNNER_TEMP/xgaminglab"
          patch -p1 --forward --batch < "$RUNNER_TEMP/regraphics-c04-final.patch"
          grep -q 'timer_ring_slots=64' native/scene_renderer.cpp
          grep -q 'Automática · REgraphics cuando conviene' src/x/lab/gaming/RunConfig.java

      - name: Apply C05 333 architecture
        shell: bash
        run: |
          set -euo pipefail
          cat .xgaminglab-c05/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/regraphics-c05-333.patch"
          cd "$RUNNER_TEMP/xgaminglab"
          patch -p1 --forward --batch < "$RUNNER_TEMP/regraphics-c05-333.patch"
          grep -q 'regraphics_c05_effect_points' native/scene_renderer.cpp
          grep -q 'fused_scene_effect_composite' native/scene_renderer.cpp
          grep -q 'effect_virtual_cluster_threshold' native/scene_renderer.cpp
          grep -q 'virtual_target_hz' native/scene_renderer.cpp
          grep -q '333 FPS · interno' src/x/lab/gaming/MainActivity.java
          grep -q 'versionName="3.3.0-c05-333"' AndroidManifest.xml
          grep -q 'X-Gaming-Lab-C05-333.apk' scripts/build_apk.py

      - name: Host regression and C05 structural tests
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        run: |
          set -euo pipefail
          bash tests/run-frame-stats.sh
          bash tests/run-vsync-gate.sh
          bash tests/run-campaign-analysis.sh
          bash tests/run-gpu-virtual-graphics.sh
          bash tests/run-regraphics-c05.sh | tee evidence/regraphics-c05-host.txt
          grep -q '"source":24000' evidence/regraphics-c05-host.txt
          grep -q '"physical":903' evidence/regraphics-c05-host.txt

      - name: Build signed Android APK
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/35.0.0
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-35/android.jar
        run: |
          set -euo pipefail
          python3 scripts/build_apk.py
          test -f dist/X-Gaming-Lab-C05-333.apk
          sha256sum dist/X-Gaming-Lab-C05-333.apk | tee evidence/X-Gaming-Lab-C05-333.sha256
          grep -q '"signatureVerified": true' evidence/apk-validation.json
          grep -q '"nativeLoadAlignment16KiB": true' evidence/apk-validation.json

      - name: Verify compiled C05 identity in both ABIs
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            unzip -p dist/X-Gaming-Lab-C05-333.apk "lib/$abi/libxgaminglab.so" > "$RUNNER_TEMP/$abi-libxgaminglab.so"
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'regraphics_c05_effect_points'
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'effect_virtual_cluster_threshold'
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'fused_scene_effect_composite'
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'virtual_target_hz'
          done

      - name: Archive exact C05 source
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/xgaminglab-c05-333-source.tar.gz" -C "$RUNNER_TEMP/xgaminglab" --exclude='./build' --exclude='./dist' .

      - name: Upload XGamingLab C05 333
        uses: actions/upload-artifact@v4
        with:
          name: XGamingLab-C05-333
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/xgaminglab/dist/X-Gaming-Lab-C05-333.apk
            ${{ runner.temp }}/xgaminglab/evidence/X-Gaming-Lab-C05-333.sha256
            ${{ runner.temp }}/xgaminglab/evidence/apk-validation.json
            ${{ runner.temp }}/xgaminglab/evidence/apk-package.txt
            ${{ runner.temp }}/xgaminglab/evidence/apk-signature.txt
            ${{ runner.temp }}/xgaminglab/evidence/regraphics-c05-host.txt
            ${{ runner.temp }}/xgaminglab-c05-333-source.tar.gz
