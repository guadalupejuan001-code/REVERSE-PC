name: XI ARM64 Linux userspace continuation
on:
  pull_request:
    paths:
      - '.github/workflows/linux-userland-continuation.yml'
      - 'tools/guest_linux_probe.cpp'
      - 'src/minimal_guest*'
      - 'src/minimal_guest_system.inc'
      - 'examples/guest-linux-init.S'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resume-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - name: Retrieve verified Linux 6M checkpoint
        uses: actions/download-artifact@v4
        with:
          name: own-arm64-linux-development-probe
          run-id: 40767291737
          github-token: ${{ github.token }}
          path: guest-linux-evidence
      - name: Verify checkpoint provenance and compile original XI/Ether interpreter
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'c9c41853c782353aba24fa726ff203ee1ab270b5228d7a37090d36f6799f5ea0' 'guest-linux-evidence/own-linux-6m.rvg' | sha256sum -c -
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 scripts/build-softfloat.py
          mkdir -p build linux-continuation
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tools/guest_linux_probe.cpp build/softfloat/libreverse_softfloat.a -o build/guest-linux-probe
          cp guest-linux-evidence/own-linux-6m.rvg linux-continuation/current.rvg
          sha256sum linux-continuation/current.rvg > linux-continuation/initial.sha256
      - name: Continue actual Linux execution, detect first user program or architectural limit
        shell: bash
        run: |
          set -euo pipefail
          printf '## Linux 6M checkpoint continuation\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Step | Total transitions | Overrides | Exceptions | Reason | Userspace witness |\n|---|---:|---:|---:|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          reached=no
          for i in $(seq 1 8); do
            timeout 240 build/guest-linux-probe linux-continuation/current.rvg 2000000 linux-continuation/next.rvg > "linux-continuation/step-${i}.json"
            jq -e --arg num "$i" '.initial_instructions >= 6000000 and .guest.instructions >= .initial_instructions and (.stop_reason | type == "string")' "linux-continuation/step-${i}.json" >/dev/null
            total=$(jq -r '.guest.instructions' "linux-continuation/step-${i}.json")
            over=$(jq -r '.guest.delta_overrides' "linux-continuation/step-${i}.json")
            exc=$(jq -r '.guest.exceptions' "linux-continuation/step-${i}.json")
            reason=$(jq -r '.stop_reason' "linux-continuation/step-${i}.json")
            witness=$(jq -r '.console | contains("REVERSE_LINUX_INIT_OK")' "linux-continuation/step-${i}.json")
            printf '| %s | %s | %s | %s | %s | %s |\n' "$i" "$total" "$over" "$exc" "$reason" "$witness" >> "$GITHUB_STEP_SUMMARY"
            printf '%s %s %s %s %s\n' "$i" "$total" "$over" "$reason" "$witness"
            mv linux-continuation/next.rvg linux-continuation/current.rvg
            if [[ "$witness" == true ]]; then reached=yes; break; fi
            if [[ "$reason" != instruction_budget ]]; then
              printf 'HALT: %s after %s transitions\n' "$reason" "$total"
              break
            fi
          done
          printf '%s\n' "$reached" > linux-continuation/userspace-witness.txt
          sha256sum linux-continuation/current.rvg > linux-continuation/final.sha256
          echo "Actual /init marker observed: $reached" >> "$GITHUB_STEP_SUMMARY"
          echo "No Linux userspace milestone is claimed without the marker." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-linux-boot-continuation
          path: linux-continuation/
          retention-days: 14
