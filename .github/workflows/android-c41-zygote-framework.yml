name: Android C41 genuine Zygote to system_server continuation
'on':
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/android-c41-zygote-framework.yml
      - docs/ANDROID_C41_ZYGOTE_FRAMEWORK.md
permissions:
  contents: read
  actions: read
jobs:
  verify-and-continue:
    if: github.event.pull_request.head.ref == 'experiment/android-c41-zygote-framework-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify runtime untouched and check C40 Zygote classifier regression
        run: |
          set -euo pipefail
          mkdir -p evidence/c41-diagnostics build
          changes=$(git diff --name-only b626902e5ec2624b89c58fea30b8a0ab36983225 HEAD -- src third_party patches scripts tools)
          test -z "$changes" || { echo "C41 changed guest CPU or Android image unexpectedly: $changes"; exit 1; }
          node --test tests/android_c40_zygote_stage.test.mjs tests/android_odsign_property_probe.test.mjs tests/android_framework_evidence.test.mjs > evidence/c41-diagnostics/tests.tap
      - name: Require completed successful C40 producer, never consume partial snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 72); do
            payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41363261111")
            status=$(printf '%s' "$payload" | jq -r '.status')
            conclusion=$(printf '%s' "$payload" | jq -r '.conclusion')
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                echo "Refusing failed or cancelled C40 source: $conclusion"
                exit 1
              fi
              ready=1
              break
            fi
            sleep 30
          done
          test "$ready" -eq 1 || { echo "C40 not finished in this bounded check"; exit 1; }
          echo "Verified successful C40 action; independently authenticate its archived checkpoint next."
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c40-authenticated-android-checkpoint
          run-id: 41363261111
          github-token: ${{ github.token }}
          path: source-c40
      - name: Verify exact producer, C39 lineage, clean C40 CPU and immutable checkpoint
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs preflight source-c40/output-contract.json source-c40 > evidence/c41-diagnostics/source-preflight.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const c=read('source-c40/output-contract.json'),r=read('source-c40/current.json');
          const b=read('source-c40/boundary-summary.json'),result=read('source-c40/result.json'),host=read('source-c40/process-outcome.json');
          assert.equal(c.schema,'reverse-c27-profile-resume-contract-v1');
          assert.equal(c.source_commit,'b626902e5ec2624b89c58fea30b8a0ab36983225');
          assert.equal(r.provenance.input_checkpoint_sha256,'094d5c9b9532fbb21ea029031b952f46c4df0e589c2f0d75a4dd64677bc49438');
          assert.equal(r.initial_instructions,18393448839);
          assert.ok(r.guest.instructions>r.initial_instructions);
          assert.equal(r.error,'');
          assert.ok(['instruction_budget','host_wall_budget'].includes(r.stop_reason));
          assert.equal(b.clean_completed,true);assert.equal(b.checkpoint_sha256,c.checkpoint_sha256);
          assert.equal(result.execution_progress_accepted,true);
          assert.equal(host.status,'process_completed');assert.equal(host.exit_code,0);
          for(const k of ['guest_kernel_panic','guest_boot_failure','guest_reboot_requested','guest_terminal_failure'])assert.equal(result[k],false);
          NODE
      - name: Read actual C40 Zygote state before making another CPU transition
        run: |
          set -euo pipefail
          SHA=$(node -p "require('./source-c40/output-contract.json').checkpoint_sha256")
          node --max-old-space-size=5000 tools/android_kernel_observer.mjs source-c40/current.rvg "$SHA" 1073741824 --live-properties --zygote-probe --scheduler-probe > evidence/c41-diagnostics/source-kernel.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {classifyZygoteStage} from './tools/android_c40_zygote_stage.mjs';
          const k=JSON.parse(readFileSync('evidence/c41-diagnostics/source-kernel.json','utf8'));
          assert.equal(k.input_unchanged,true);
          const p=classifyZygoteStage(k);
          assert.equal(p.checkpoint_sha256,k.checkpoint_sha256);
          assert.equal(p.android_boot_completed_verified,false);
          const packet={...p,source_current_task:k.current_task_details,source_scheduler:k.scheduler_probe,
            source_security:k.live_kernel_security,read_only:true};
          writeFileSync('evidence/c41-diagnostics/source-stage.json',JSON.stringify(packet,null,2)+'\n');
          console.log(JSON.stringify(packet,null,2));
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c29-tested-build
          run-id: 41151900393
          github-token: ${{ github.token }}
          path: pinned-build
      - name: Compile exact C39 XI Ether original ARM64 interpreter and display verifier
        run: |
          set -euo pipefail
          tar -xzf pinned-build/tested-source.tar.gz build/ether-compat build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
          FLAGS="-std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools"
          g++ $FLAGS tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -o build/c41-native
          g++ $FLAGS tools/guest_checkpoint_frame.cpp build/softfloat/libreverse_softfloat.a -o build/c41-frame
          build/c41-native --pins > evidence/c41-diagnostics/native-pins.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {verifyNativePins} from './tools/android_c27_profile_resume.mjs';
          verifyNativePins(JSON.parse(readFileSync('evidence/c41-diagnostics/native-pins.json','utf8')));
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Restore original verified Android partition disk without altering guest
        run: |
          set -euo pipefail
          ORIGINAL=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$ORIGINAL"
          node tools/android_c27_media.mjs "$ORIGINAL" new-media > evidence/c41-diagnostics/media.json
          rm -rf disk-input
      - name: Continue actual C40 Zygote guest for three bounded C41 cycles
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          node tools/android_c27_sequence.mjs source-c40/output-contract.json source-c40 build/c41-native new-media/android-c27.raw build/c41-frame evidence/c41 "$SOURCE_COMMIT" 540000 500000000 3 > evidence/c41-diagnostics/native-sequence.json
      - name: Authenticate C41 checkpoint and compare real Zygote system_server and SurfaceFlinger
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {preflight} from './tools/android_c27_profile_resume.mjs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const a=read('source-c40/output-contract.json'),b=read('evidence/c41/output-contract.json');
          preflight(a,'source-c40');preflight(b,'evidence/c41');
          const src=read('source-c40/current.json'),dst=read('evidence/c41/current.json');
          const result=read('evidence/c41/result.json'),host=read('evidence/c41/process-outcome.json'),boundary=read('evidence/c41/boundary-summary.json');
          assert.equal(dst.initial_instructions,src.guest.instructions);
          assert.ok(dst.guest.instructions>src.guest.instructions);
          assert.equal(dst.provenance.input_checkpoint_sha256,a.checkpoint_sha256);
          assert.equal(dst.error,'');
          assert.ok(['instruction_budget','host_wall_budget'].includes(dst.stop_reason));
          assert.equal(result.execution_progress_accepted,true);
          assert.equal(host.status,'process_completed');assert.equal(host.exit_code,0);
          assert.equal(boundary.clean_completed,true);assert.equal(boundary.checkpoint_sha256,b.checkpoint_sha256);
          for(const k of ['guest_kernel_panic','guest_boot_failure','guest_reboot_requested','guest_terminal_failure'])assert.equal(result[k],false);
          NODE
          SHA=$(node -p "require('./evidence/c41/output-contract.json').checkpoint_sha256")
          node --max-old-space-size=5000 tools/android_kernel_observer.mjs evidence/c41/current.rvg "$SHA" 1073741824 --live-properties --zygote-probe --scheduler-probe > evidence/c41-diagnostics/result-kernel.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {classifyZygoteStage} from './tools/android_c40_zygote_stage.mjs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const kernel=read('evidence/c41-diagnostics/result-kernel.json');
          const from=read('evidence/c41-diagnostics/source-stage.json');
          const current=read('evidence/c41/current.json');
          const framework=read('evidence/c41/runtime-evidence.json');
          const to=classifyZygoteStage(kernel);
          assert.equal(kernel.checkpoint_sha256,current.checkpoint_sha256);
          assert.equal(kernel.instructions,current.guest.instructions);
          assert.equal(kernel.input_unchanged,true);
          assert.equal(framework.checkpoint_sha256,kernel.checkpoint_sha256);
          const props=kernel.live_boot_property?.boot_chain_property_observations??[];
          for(const name of ['odsign.key.done','odsign.verification.done']){
            assert.ok(props.some(x=>x.name===name&&x.status==='property_observed'&&x.value==='1'),'Authentic security property regressed: '+name);
          }
          const result={schema:'reverse-c41-real-zygote-milestone-v1',
            source_checkpoint_sha256:from.checkpoint_sha256,checkpoint_sha256:to.checkpoint_sha256,
            source_instructions:from.instructions,instructions:to.instructions,
            added_instructions:current.advanced_instructions,
            source_stage:from.stage,result_stage:to.stage,
            source_launcher_pid:from.launcher_pid,result_launcher_pid:to.launcher_pid,
            result_zygote_named_pid:to.named_zygote_pid,
            system_server_pid:to.system_server_pid,surfaceflinger_pid:to.surfaceflinger_pid,
            init_svc_zygote:to.init_svc_zygote,
            zygote_socket_responsive_verified:false,
            framework_runtime_verified:framework.framework_runtime_verified===true,
            android_boot_completed_verified:framework.sys_boot_completed_live===true,
            scanout_exported:framework.scanout_exported===true,
            source_scheduler:from.source_scheduler,result_scheduler:kernel.scheduler_probe,
            observer_read_only:true,android_boot_claimed:false};
          writeFileSync('evidence/c41-diagnostics/actual-milestones.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c41-zygote-milestone-diagnostics
          path: |-
            evidence/c41-diagnostics/
            evidence/c41/boundary-summary.json
            evidence/c41/continuation-error.txt
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reverse-c41-authenticated-android-checkpoint
          path: |-
            evidence/c41/
            !evidence/c41/native/journal/**
            !evidence/c41/native/current.rvg
            !evidence/c41/native/frame.ppm
            !evidence/c41/native/frame.pending.ppm
          if-no-files-found: error
          retention-days: 90
