name: Android C66 rounded right shifts and original compact Android continuation
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c66-rounded-right-shift-compact-continue.yml
    - CMakeLists.txt
    - src/minimal_guest_simd.inc
    - tests/minimal_guest_rounding_shift_test.cpp
    - docs/ANDROID_C66_ROUNDED_RIGHT_SHIFT_COMPACT.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c66-rounded-right-shift-compact' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c66-native build
        git diff --exit-code 0268e4f4a0ee593a435ae3071e20c3500dd70cfd HEAD -- src scripts patches third_party tools ':(exclude)src/minimal_guest_simd.inc'
        python3 - <<'PYCODE'
        import pathlib,subprocess
        p='src/minimal_guest_simd.inc';old=subprocess.check_output(['git','show','0268e4f4a0ee593a435ae3071e20c3500dd70cfd:'+p]).decode();new=pathlib.Path(p).read_text();a=new.index('  const bool rounding_vector=');b=new.index('  ArmFloat fp(floating_);',a);assert new[:a]+new[b:]==old
        PYCODE
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify 32 rounding forms, original SIMD and indexed neighbors, UBSan and unchanged compact decoder
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -DREVERSE_PC_COMPACT_INDEX_LOOKASIDE=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        for item in rounding_shift indexed_integer fp; do
          g++ $FLAGS -O2 tests/minimal_guest_${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c66-$item
          build/c66-$item > evidence/c66-native/$item.json
        done
        g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/minimal_guest_rounding_shift_test.cpp build/softfloat/libreverse_softfloat.a -o build/c66-rounded-ubsan
        build/c66-rounded-ubsan > evidence/c66-native/ubsan.json
        g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c66-view
        build/c66-view build/c66-view-data > evidence/c66-native/original-decoder.json
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c66-native/native
        evidence/c66-native/native --pins > evidence/c66-native/native-pins.json
        sha256sum evidence/c66-native/native > evidence/c66-native/binary-sha256.txt
        g++ --version > evidence/c66-native/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c66-tested-native
        path: evidence/c66-native
        retention-days: 90
        compression-level: 1
  arm-hardware:
    if: github.event.pull_request.head.ref == 'fix/android-c66-rounded-right-shift-compact' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Execute every legal SRSHR URSHR SRSRA URSRA register and immediate encoding on physical ARM
      run: |
        set -euo pipefail
        mkdir -p evidence/c66-arm build
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -DREVERSE_PC_COMPACT_INDEX_LOOKASIDE=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        g++ $FLAGS -O2 tests/minimal_guest_rounding_shift_test.cpp build/softfloat/libreverse_softfloat.a -o build/c66-arm
        build/c66-arm > evidence/c66-arm/hardware.json
        python3 - <<'PYCODE'
        import json
        v=json.load(open('evidence/c66-arm/hardware.json'));assert v['native_hardware_cases']>=1027329 and v['rounding_shift_forms']==32 and v['exact_android_opcode']=='0x6f182485'
        PYCODE
        uname -a > evidence/c66-arm/machine.txt
        g++ --version > evidence/c66-arm/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c66-arm-hardware
        path: evidence/c66-arm
        retention-days: 90
        compression-level: 1
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c66-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c65-tested-native
        run-id: 41993666038
        github-token: ${{ github.token }}
        path: reference-build
    - name: Wait for independently produced clean C65 stage 5
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p evidence/c66-source
        for c65_artifact_attempt in $(seq 1 240); do
          gh api repos/guadalupejuan001-code/REVERSE-PC/actions/runs/41993666038/artifacts > evidence/c66-source/c64-artifacts.json
          if node --input-type=module <<'NODE'
        import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c66-source/c64-artifacts.json'));process.exit(r.artifacts.some(a=>a.name==='reverse-c65-stage-5-verified-checkpoint'&&!a.expired)?0:1);
        NODE
          then exit 0; fi
          sleep 30
        done
        echo 'Original clean C65 stage 5 was not published within the bounded wait' >&2
        exit 1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c65-stage-5-verified-checkpoint
        run-id: 41993666038
        github-token: ${{ github.token }}
        path: source-c65-stage5
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: original-decoder
    - name: Authenticate independently pinned clean C65 stage 5, tested C65 reference CPU and original decoder
      run: |
        set -euo pipefail
        mkdir -p evidence/c66-source
        cp original-decoder/frame native-build/frame
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum native-build/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = '79590850915dfcec686bbcf8fad8d9e2a4c29bd11cc6ac900d92a886cff7bda5'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c65-stage5/output-contract.json')),p=preflight(c,'source-c65-stage5',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'0268e4f4a0ee593a435ae3071e20c3500dd70cfd');assert.equal(c.checkpoint_sha256,'7ecf0706237f127e6c78cbbdee4e5c640941ecfd6ba2b7ec8c3e282d6a13e5d0');assert.equal(p.report.guest.instructions,51183780033);writeFileSync('evidence/c66-source/preflight.json',JSON.stringify(c,null,2)+String.fromCharCode(10));
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c66-source/media.json
        cp media-input/manifest.json evidence/c66-source/media-transport.json
        rm -rf media-input
        fallocate --dig-holes new-media/android-c27.raw
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
    - name: Independently replay the original C65 CPU to the clean pre-URSHR boundary
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        const r=await run(JSON.parse(readFileSync('source-c65-stage5/output-contract.json')),'source-c65-stage5','reference-build/native','new-media/android-c27.raw','evidence/c66-reference',{wallMs:900000,instructions:591279703,cycles:1,maxTransportBytes:2147483648});writeFileSync('evidence/c66-source/reference.json',JSON.stringify(r,null,2)+String.fromCharCode(10));assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(JSON.parse(readFileSync('evidence/c66-reference/current.json')).guest.instructions,51775059736);assert.equal(r.result.checkpoint_sha256,'98fd04b31c361a3f0d7d1eaa4f85512f9751585cb85047fe3661d0d9a76a0ca8');
        NODE
    - name: C66 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c65-stage5 evidence/c66-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c65-stage5/c42-progress.json 591279703 2147483648 > evidence/c66-source/stage-1.json
        cmp evidence/c66-reference/current.rvg evidence/c66-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c66-1/current.json'));assert.equal(r.guest.instructions,51775059736);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'98fd04b31c361a3f0d7d1eaa4f85512f9751585cb85047fe3661d0d9a76a0ca8');
        NODE
        rm -rf evidence/c66-reference reference-build
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const p=JSON.parse(readFileSync('evidence/c66-1/c42-progress.json'));assert.equal(p.zygote_pid,567);assert.equal(p.zygote_comm,'main');assert.equal(p.android_boot_completed_verified,false);
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c66-stage-1-verified-checkpoint
        path: |-
          evidence/c66-1/
          !evidence/c66-1/native/journal/**
          !evidence/c66-1/native/current.rvg
          !evidence/c66-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c66-stage-1-diagnostics
        path: |-
          evidence/c66-1/*.json
          evidence/c66-1/*.txt
          evidence/c66-1/*.log
          evidence/c66-1/native/*.json
          evidence/c66-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C66 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c66-1 evidence/c66-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c66-1/c42-progress.json 1 2147483648 > evidence/c66-source/stage-2.json
        python3 - <<'PYCODE'
        import hashlib,json,mmap,pathlib,struct
        root=pathlib.Path('evidence')
        before=root/'c66-1/current.rvg'
        after=root/'c66-2/current.rvg'
        r=json.loads((root/'c66-2/current.json').read_text())
        assert r['guest']['instructions']==51775059737 and r['guest']['pc']=='0x7b9af6a89c' and not r['error']
        with before.open('rb') as fa,after.open('rb') as fb:
         with mmap.mmap(fa.fileno(),0,access=mmap.ACCESS_READ) as aa,mmap.mmap(fb.fileno(),0,access=mmap.ACCESS_READ) as bb:
          u=lambda data,at:struct.unpack_from('<Q',data,at)[0]
          assert hashlib.sha256(aa).hexdigest()=='98fd04b31c361a3f0d7d1eaa4f85512f9751585cb85047fe3661d0d9a76a0ca8'
          assert hashlib.sha256(bb).hexdigest()==r['checkpoint_sha256']
          assert aa[:8]==bb[:8]==b'RVG3\r\n\x1a\n'
          assert u(aa,24)==0x7b9af6a898 and u(bb,24)==0x7b9af6a89c
          assert u(aa,40)==51775059736 and u(bb,40)==51775059737
          sa=[u(aa,o) for o in (320,328,336,344,352)];sb=[u(bb,o) for o in (320,328,336,344,352)]
          assert sa[:4]==sb[:4] and sa[4]==sb[4]+16 and len(aa)==len(bb)+16
          fp=len(aa)-8-sa[4];assert fp==len(bb)-8-sb[4]==360+sum(sa[:4])
          assert aa[fp:fp+8]==bb[fp:fp+8]==b'RFP1\r\n\x1a\n'
          assert struct.unpack_from('<II',aa,fp+8)==struct.unpack_from('<II',bb,fp+8)==(0,16)
          ma=struct.unpack_from('<I',aa,fp+16)[0];mb=struct.unpack_from('<I',bb,fp+16)[0]
          assert ma==2013200616 and ma&(1<<5) and mb==ma&~(1<<5)
          def vectors(data,mask,size):
           assert size==20+16*mask.bit_count();values=[];at=fp+20
           for reg in range(32):
            values.append(bytes(data[at:at+16]) if mask&(1<<reg) else bytes(16))
            if mask&(1<<reg):at+=16
           assert at==len(data)-8;return values
          va,vb=vectors(aa,ma,sa[4]),vectors(bb,mb,sb[4])
          assert va[4]==vb[4]==bytes(16)
          assert va[5]==bytes.fromhex('000000ff000000ff000000ff000000ff') and vb[5]==bytes(16)
          for reg in range(32):
           if reg!=5:assert va[reg]==vb[reg]
          phase=fp-8;assert u(aa,phase)==27 and u(bb,phase)==28
          at=0
          for start,end in [(24,32),(40,48),(352,360),(phase,phase+8)]:
           for pos in range(at,start,1048576):assert aa[pos:min(pos+1048576,start)]==bb[pos:min(pos+1048576,start)],str(pos)
           at=end
          assert at==fp
        proof={'opcode':'0x6f182485','instruction':'URSHR V5.8H,V4.8H,#8','source_v4':bytes(16).hex(),'destination_v5':bytes(16).hex(),'instructions':51775059737,'pc':'0x7b9af6a89c','counter_subtick_before':27,'counter_subtick_after':28,'original_sparse_fpu_encoding_removed_zero_destination':True,'fpu_bytes_retired':16,'all_original_non_fpu_bytes_unchanged_except_exact_pc_count_phase_and_fpu_length':True,'other_31_vectors_and_fpcr_fpsr_unchanged':True,'all_original_state_bytes_verified_with_exact_sparse_zero_elision':True,'checkpoint_sha256':r['checkpoint_sha256']}
        (root/'c66-source/rounded-shift-crossing.json').write_text(json.dumps(proof,indent=2)+chr(10))
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c66-stage-2-verified-checkpoint
        path: |-
          evidence/c66-2/
          !evidence/c66-2/native/journal/**
          !evidence/c66-2/native/current.rvg
          !evidence/c66-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: |
        rm -rf evidence/c66-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c66-stage-2-diagnostics
        path: |-
          evidence/c66-2/*.json
          evidence/c66-2/*.txt
          evidence/c66-2/*.log
          evidence/c66-2/native/*.json
          evidence/c66-2/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C66 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c66-2 evidence/c66-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c66-2/c42-progress.json 1000000 2147483648 > evidence/c66-source/stage-3.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c66-stage-3-verified-checkpoint
        path: |-
          evidence/c66-3/
          !evidence/c66-3/native/journal/**
          !evidence/c66-3/native/current.rvg
          !evidence/c66-3/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: |
        rm -rf evidence/c66-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c66-stage-3-diagnostics
        path: |-
          evidence/c66-3/*.json
          evidence/c66-3/*.txt
          evidence/c66-3/*.log
          evidence/c66-3/native/*.json
          evidence/c66-3/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C66 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.visual != 'true'
      run: |
