name: Android C11 structures from verified C10
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/android-c11-structures.yml'
      - 'experiments/android-c11-*'
      - 'tests/minimal_guest_structures_test.cpp'
      - 'tests/structures_encoding_test.mjs'
permissions:
  contents: write
  actions: read
concurrency:
  group: android-c11-structures
  cancel-in-progress: false
jobs:
  resume-c10:
    if: github.event.pull_request.head.ref == 'fix/android-c11-structures-20261030' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify and apply the reviewed C11 changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=0c562f605350392bfbe6290a9d6d7bbe5cc345fa
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- src tools tests/android_c11_audit.test.mjs
          mkdir -p evidence/c11 build/c11-before
          echo 'e5bdba6951b50b0bf1885cbad657a967800aee1cab925dcd05f0d79e0d9025ae  experiments/android-c11-structures.patch' | sha256sum --check
          echo '7f5af7b84e441ff7ad85a1ba5a7c984c54dda828ec5ee72b153c26f298c23550  experiments/android-c11-prepare.mjs' | sha256sum --check
          echo '4876d390c8b927d855e60620f4c60b9e256735d25a2702a031824a25d9b83854  tests/minimal_guest_structures_test.cpp' | sha256sum --check
          echo 'a78e83e6a315f52d10d98eb4f9fcf4ea6f5ae3a705b1a67b5bbdafb7885bc969  tests/structures_encoding_test.mjs' | sha256sum --check
          git archive "$BASE" src third_party | tar -x -C build/c11-before
          git apply --check experiments/android-c11-structures.patch
          git apply --index experiments/android-c11-structures.patch
          node experiments/android-c11-prepare.mjs > evidence/c11/generated-source-sha256.txt
          echo 'c3666c55af9ded8960107f09dc233eeb8c201c3b37f3a59f64ac37724f61a59b  src/minimal_guest_simd.inc' | sha256sum --check
          git add tools/guest_c10_resume.cpp tools/android_c11_audit.mjs tools/android_c11_supervised.mjs tests/android_c11_audit.test.mjs
          git diff --cached > evidence/c11/executed-source.patch
          git diff --cached --name-only -z | xargs -0 sha256sum > evidence/c11/source-sha256.txt
          git rev-parse HEAD > evidence/c11/runner-commit.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c10-xtn-continuation
          run-id: 41001470424
          github-token: ${{ github.token }}
          path: input-c10
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c07-proven-post-init
          run-id: 40975381521
          github-token: ${{ github.token }}
          path: input-c07
      - name: Verify C10, regression gates and the actual interpreter
        env:
          C10_INPUT: input-c10
          C07_STATE: input-c07/current.rvg
          C07_REPORT: input-c07/current.json
        shell: bash
        run: |
          set -euo pipefail
          node tools/android_c11_audit.mjs input-c10 > evidence/c11/source-audit.json
          node --test --test-concurrency=1 tests/android_verified_c07_source.test.mjs tests/android_c08_result.test.mjs tests/android_c08_integrity.test.mjs tests/rvg_checksum.test.mjs tests/android_supervised_cycle.test.mjs tests/android_c11_audit.test.mjs > evidence/c11/host-tests.tap
          node tests/structures_encoding_test.mjs > evidence/c11/llvm-structures.json
          node tests/xtn_encoding_test.mjs > evidence/c11/llvm-xtn.json
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 scripts/build-softfloat.py
          FLAGS='-std=c++17 -O1 -pthread -fsanitize=undefined -fno-sanitize-recover=all -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include'
          g++ $FLAGS -Ibuild/c11-before/src tests/minimal_guest_structures_test.cpp build/softfloat/libreverse_softfloat.a -o build/c11-before-test
          if build/c11-before-test > evidence/c11/negative.stdout 2> evidence/c11/negative.stderr; then echo 'Old interpreter unexpectedly accepted ST4'; exit 1; fi
          grep -F 'Unsupported AArch64 instruction' evidence/c11/negative.stderr
          for suite in minimal_guest_structures minimal_guest_xtn minimal_guest_widen_shift minimal_guest_fp minimal_guest_el0_cache minimal_guest_crc guest_boot_cycle guest_boot_resume_proof; do
            g++ $FLAGS -Isrc "tests/${suite}_test.cpp" build/softfloat/libreverse_softfloat.a -o "build/c11-$suite"
            "build/c11-$suite" | tee "evidence/c11/$suite.json"
          done
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tools/guest_c10_resume.cpp build/softfloat/libreverse_softfloat.a -o build/c11-native
          cp input-c10/current.json build/changed-report.json
          printf '\n' >> build/changed-report.json
          if build/c11-native input-c10/current.rvg build/changed-report.json input-c10/entry-proof.json /nonexistent-disk build/negative 1000 1000 > evidence/c11/native-negative.stdout 2> evidence/c11/native-negative.stderr; then exit 1; fi
          grep -F 'C10 report hash mismatch' evidence/c11/native-negative.stderr
          sha256sum build/c11-native > evidence/c11/native-sha256.txt
      - name: Publish only the tested experimental source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=fix/android-c11-structures-20261030
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          sha256sum --check evidence/c11/source-sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement verified interleaved structures and exact C10 continuation'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > evidence/c11/published-source-commit.txt
          cp build/c11-native evidence/c11/native-continuation
          tar -czf evidence/c11/reproducer-source.tar.gz src tools tests scripts experiments third_party CMakeLists.txt build/ether-compat build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-c11-tested-source-and-runner
          path: evidence/c11/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Resume exact C10 with the original Android disk
        shell: bash
        run: |
          set -euo pipefail
          DISK=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$DISK"
          test "$(stat -c '%s' "$DISK")" = 8738832384
          node tools/android_c11_supervised.mjs evidence/c11 -- build/c11-native input-c10/current.rvg input-c10/current.json input-c10/entry-proof.json "$DISK" evidence/c11/journal 300000 300000000 > evidence/c11/supervision-result.json
      - name: Audit and preserve the outcome even when another opcode is missing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/c11
          if test -f evidence/c11/journal/latest.json; then
            node tools/android_c11_audit.mjs input-c10 evidence/c11 300000000 | tee evidence/c11/audit-result.json
          else
            printf '%s\n' '{"status":"no_native_checkpoint_committed","android_display_verified":false,"native_android_games_verified":false}' > evidence/c11/milestone.json
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c11-structures-continuation
          path: evidence/c11/
          if-no-files-found: error
          retention-days: 14
