name: Import reviewed source history
on:
  push:
    branches: ['transport/import-20261028-reverse']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and transfer reviewed Git objects
        shell: bash
        run: |
          set -euo pipefail
          echo '499427ceb127615f77e9647e38baec546a557246b3fab6b4b945052b76e62f8d  bootstrap/source.bundle' | sha256sum -c
          git bundle verify bootstrap/source.bundle
          git fetch bootstrap/source.bundle refs/heads/integrate/latest-2026-10-28
          test "$(git rev-parse FETCH_HEAD)" = b6fe327fc6f4d6a294390431a674733386821e35
          git push origin b6fe327fc6f4d6a294390431a674733386821e35:refs/heads/integrate/latest-2026-10-28
