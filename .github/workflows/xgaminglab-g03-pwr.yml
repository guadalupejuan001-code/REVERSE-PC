name: XGamingLab 3 Physical Work Reduction
on:
  push:
    branches: [feature/xgaminglab-3-physical-work-reduction-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct reviewed G02 source and apply 3.0 integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xlab3
          cat xgaminglab-g02/source.chunk.* | base64 -d > /tmp/xlab-g02.tar.gz
          echo '7a86e217e30abfa06c80a18621cd028ced82a879d1687f70618813c4355a48e3  /tmp/xlab-g02.tar.gz' | sha256sum -c -
          tar -xzf /tmp/xlab-g02.tar.gz -C /tmp/xlab3
          cat xgaminglab-g03/integration.patch.part.* | base64 -d > /tmp/xlab3-integration.patch
          echo 'c1606e0f56ee537f90d124755243243a28cbfe60517eb672fd8e5aaeb80c52d6  /tmp/xlab3-integration.patch' | sha256sum -c -
          cd /tmp/xlab3
          git apply --check /tmp/xlab3-integration.patch
          git apply /tmp/xlab3-integration.patch
          grep -q 'versionName="3.0.0"' AndroidManifest.xml
          ! grep -RIn 'Laboratorio 2.0' src native
      - name: Host metric, campaign, timing and compact representation tests
        shell: bash
        working-directory: /tmp/xlab3
        run: |
          set -euo pipefail
          bash tests/run-frame-stats.sh
          bash tests/run-campaign-analysis.sh
          bash tests/run-vsync-gate.sh
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ivendor/gpu/include tests/physical_projection_probe.cpp -o /tmp/physical_projection_probe
          /tmp/physical_projection_probe | tee evidence/physical-projection.txt
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Inative tests/shadow_delta_probe.cpp -o /tmp/shadow_delta_probe
          /tmp/shadow_delta_probe | tee evidence/shadow-delta.txt
      - name: Full backend regression and compact-vs-dense equivalence
        shell: bash
        working-directory: /tmp/xlab3
        run: |
          set -euo pipefail
          bash tests/run_backend_tests.sh | tee evidence/backend-regression.txt
          python3 scripts/prepare_vendor.py
          g++ -std=c++20 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1             -Ibuild/qssd-compat -Ibuild/ether-compat -Ivendor/mundo/native/include             -Ivendor/reverse/src -Ivendor/qssd/include -Ivendor/gpu/include -Inative             native/x_backend.cpp native/component_lab.cpp tests/compact_relation_equivalence.cpp             -o build/compact_relation_equivalence
          ./build/compact_relation_equivalence | tee evidence/compact-equivalence.txt
      - name: Install official Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build, sign and verify XGamingLab 3.0.0
        shell: bash
        working-directory: /tmp/xlab3
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          python3 scripts/build_apk.py | tee evidence/android-build.txt
          python3 scripts/package_source.py
          test -s dist/X-Gaming-Lab-3.0.0.apk
          test -s dist/X-Gaming-Lab-3.0.0-source.zip
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/X-Gaming-Lab-3.0.0.apk > evidence/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/X-Gaming-Lab-3.0.0.apk > evidence/package.txt
          sha256sum dist/X-Gaming-Lab-3.0.0.apk | tee evidence/apk-sha256.txt
          sha256sum dist/X-Gaming-Lab-3.0.0-source.zip | tee evidence/source-sha256.txt
          python3 - <<'PY'
          import zipfile
          p='dist/X-Gaming-Lab-3.0.0.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert any(n.startswith('lib/arm64-v8a/') for n in names)
              assert any(n.startswith('lib/x86_64/') for n in names)
          print('APK ZIP and both native ABIs verified')
          PY
      - name: Publish exact APK, source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XGamingLab-3.0.0-PWR
          path: |
            /tmp/xlab3/dist/X-Gaming-Lab-3.0.0.apk
            /tmp/xlab3/dist/X-Gaming-Lab-3.0.0-source.zip
            /tmp/xlab3/evidence/**
          retention-days: 30
          if-no-files-found: warn
