name: Laplace - materializar integración verificada
on:
  push:
    branches: [integrate/laplace-m001-next-apk-20261030]
    paths: [.github/workflows/laplace-import-once.yml]
permissions:
  contents: write
jobs:
  materializar:
    if: github.repository == 'guadalupejuan001-code/REVERSE-PC'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar y aplicar el paquete exacto, sin alterar main
        run: |
          set -euo pipefail
          cat .github/laplace-transfer/part-1.b64 .github/laplace-transfer/part-2.b64 .github/laplace-transfer/part-3.b64 | base64 --decode > "$RUNNER_TEMP/integration.patch.xz"
          echo 'ca7e4737886714e6f5574f558eae8c30f32df4d8ed22ef817a9d45f58dc015fa  '"$RUNNER_TEMP/integration.patch.xz" | sha256sum -c -
          xz --decompress --stdout "$RUNNER_TEMP/integration.patch.xz" > "$RUNNER_TEMP/integration.patch"
          echo '8277620511781818173ab376a579873ee6326f378f5a1e321c88823ab5d7c48c  '"$RUNNER_TEMP/integration.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/integration.patch"
          git apply --index "$RUNNER_TEMP/integration.patch"
          node laplace-android/prepare.mjs --check
          node laplace-android/verify.mjs
          node --test laplace-android/tests/modelo.test.mjs
          git rm -r .github/laplace-transfer .github/workflows/laplace-import-once.yml
      - name: Preparar blobs verificados, sin modificar árboles ni ramas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY,parent=process.env.GITHUB_SHA;
          if(repo!=='guadalupejuan001-code/REVERSE-PC'||process.env.GITHUB_REF!=='refs/heads/integrate/laplace-m001-next-apk-20261030')throw Error('Rama incorrecta');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',stdio:['pipe','pipe','pipe']});
          const names=git('diff','--cached','--name-only','-z').split('\0').filter(Boolean);
          if(names.length!==29)throw Error('Número inesperado de archivos: '+names.length);
          const tree=[];
          for(const path of names){
            if(!/^(laplace-android\/|reverse-os-android\/|NEXT_APK_LAPLACE\.json$|\.github\/workflows\/(laplace-integration|workbench-android|laplace-import-once)\.yml$|\.github\/laplace-transfer\/part-[123]\.b64$)/.test(path))throw Error('Ruta no autorizada '+path);
            let content;try{content=git('show',':'+path)}catch{tree.push({path,mode:'100644',type:'blob',sha:null});continue}
            const r=await fetch('https://api.github.com/repos/'+repo+'/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content,encoding:'utf-8'})});
            const blob=await r.json();if(!r.ok)throw Error(r.status+' '+JSON.stringify(blob));
            const expected=git('rev-parse',':'+path).trim();if(blob.sha!==expected)throw Error('Blob distinto del probado: '+path);
            tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
          }
          const report={parent,base_tree:git('rev-parse','HEAD^{tree}').trim(),tree,branch_moved:false,patch_sha256:'8277620511781818173ab376a579873ee6326f378f5a1e321c88823ab5d7c48c'};
          writeFileSync('integration-materialized.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laplace-materialized-ref
          path: integration-materialized.json
          retention-days: 7
          if-no-files-found: warn
