name: REVERSE same-build Android vendor+generic XI Ether continuation (bounded)
on:
  pull_request:
    paths:
      - '.github/workflows/aosp-cuttlefish-vendor-continue.yml'
      - 'docs/AOSP_VENDOR_INITRD_GATE.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vendor-boot-continued:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reverse-verified-aosp-platform-initrd-gate
          run-id: 40801279513
          github-token: ${{ github.token }}
          path: prior
      - name: Verify exact authentic kernel/vendor+generic initrd checkpoint
        run: |
          set -euo pipefail
          mkdir -p build evidence
          echo 'd93b07e7c816f060dd813fd098b02e93b74d76c21f07379d46d105db09822324  prior/current.rvg' | sha256sum -c -
          jq -e '.guest.instructions==230000 and
            .guest.immutable_image_bytes==63841800 and
            .stop_reason=="instruction_budget" and
            .guest.exception_level==1 and
            .guest.exceptions==0 and
            .next_instruction.opcode=="0x710001bf" and
            .android_boot==false and .linux_userspace_init_observed==false' prior/actual-stop.json >/dev/null
          node tools/audit_gki_rvg.mjs prior/current.rvg \
            f722bdd809bfd3485917a564b053b8a6d4938408734091f420c3297a8e3b20c8 \
            d93b07e7c816f060dd813fd098b02e93b74d76c21f07379d46d105db09822324 \
            > evidence/rvgevidence.json
          jq -e '.status=="read_only_provenance_verified" and
            .instructions==230000 and .kernel_bytes==42031616 and
            .initrd_bytes==21808620 and .classical_override_limit=="0"' evidence/rvgevidence.json >/dev/null
          jq -e '.combined_initrd.sha256=="21f6a9e2498f6ea30c4a4edffcd3efbaea3feec79524004492041650a1d4fb64" and
            .bootconfig.raw_bytes==117 and
            .vendor_ramdisk.fragments[0].type==1 and
            .reverse_bootconfig_option_present==false' prior/staged-manifest.json >/dev/null
      - name: Compile unchanged original XI Ether CPU with exact pinned Mundo-X
        run: |
          set -euo pipefail
          test "$(git -C deps/mundo-x rev-parse HEAD)" = e2778d962af22f6f1a0794058dd4685fc2573966
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 scripts/build-softfloat.py
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 \
            -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc \
            tools/guest_linux_probe.cpp build/softfloat/libreverse_softfloat.a \
            -o build/linux-probe
      - name: Confirm exact 5000-step direct versus 1+4999 resumed RVG
        run: |
          set -euo pipefail
          timeout 120 build/linux-probe prior/current.rvg 5000 build/direct.rvg > evidence/direct.json
          timeout 120 build/linux-probe prior/current.rvg 1 build/first.rvg > evidence/first.json
          timeout 120 build/linux-probe build/first.rvg 4999 build/sliced.rvg > evidence/sliced.json
          cmp build/direct.rvg build/sliced.rvg
          jq -e '.initial_instructions==230000 and .guest.instructions>=230001 and
            .android_boot==false and .guest.immutable_image_bytes==63841800' evidence/direct.json >/dev/null
          cp build/direct.rvg build/current.rvg
          sha256sum build/direct.rvg > evidence/replay.sha256
      - name: Continue guest to next real unsupported instruction, device, or bounded budget
        run: |
          set -euo pipefail
          printf '| Batch | Total instructions | EL | Exceptions | Stop | Console bytes |\n|---|---:|---:|---:|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 10); do
            timeout 180 build/linux-probe build/current.rvg 1000000 build/next.rvg > "evidence/step-$i.json"
            jq -e '.guest.instructions>=.initial_instructions and
              .guest.immutable_image_bytes==63841800 and
              .guest.max_delta_overrides==0 and .adaptive_classical_storage and
              .android_boot==false and .linux_boot_complete==false' "evidence/step-$i.json" >/dev/null
            stop=$(jq -r '.stop_reason' "evidence/step-$i.json")
            total=$(jq -r '.guest.instructions' "evidence/step-$i.json")
            exceptions=$(jq -r '.guest.exceptions' "evidence/step-$i.json")
            el=$(jq -r '.guest.exception_level' "evidence/step-$i.json")
            output=$(jq -r '.console|length' "evidence/step-$i.json")
            printf '| %s | %s | %s | %s | %s | %s |\n' "$i" "$total" "$el" "$exceptions" "$stop" "$output" >> "$GITHUB_STEP_SUMMARY"
            mv build/next.rvg build/current.rvg
            if [[ "$stop" != instruction_budget ]]; then break; fi
          done
          last=$(ls evidence/step-*.json | sort -V | tail -1)
          jq '{initial_instructions,guest:{pc:.guest.pc,instructions:.guest.instructions,
            exception_level:.guest.exception_level,exceptions:.guest.exceptions,
            mmu_enabled:.guest.mmu_enabled,
            immutable_image_bytes:.guest.immutable_image_bytes,
            delta_overrides:.guest.delta_overrides},
            stop_reason,next_instruction,console,android_boot,
            linux_userspace_init_observed}' "$last" > evidence/actual-stop.json
          cp build/current.rvg evidence/current.rvg
          sha256sum evidence/current.rvg > evidence/current.sha256
          cat evidence/actual-stop.json
          cat evidence/current.sha256
          {
            echo ''
            echo 'Source: official single-build 16644040 compressed PLATFORM+generic LZ4 with bootconfig.'
            echo 'The historical 8.89M generic-only RVG is unchanged.'
            echo 'Guest FDT does not yet pass bootconfig or Cuttlefish vendor bootargs.'
            echo 'No /init, Android services, Binder, ADB or Wild Rift execution is asserted.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-aosp-vendor-real-next-checkpoint
          path: evidence/
          retention-days: 7
