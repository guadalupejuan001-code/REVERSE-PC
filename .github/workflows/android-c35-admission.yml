name: Android C35 trusted C34 checkpoint admission
'on':
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/android-c35-admission.yml
      - tools/android_c35_source_gate.mjs
      - tools/android_c35_stage.mjs
      - tests/android_c35_source_gate.test.mjs
      - tests/android_c35_stage.test.mjs
      - docs/ANDROID_C35_SOURCE_GATE.md
permissions:
  contents: read
jobs:
  verify-admission:
    if: github.event.pull_request.head.ref == 'experiment/android-c35-source-gate-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Reject wrong C34 provenance and unsupported Android completion claims
        run: |
          set -euo pipefail
          node --test tests/android_c35_source_gate.test.mjs tests/android_c35_stage.test.mjs tests/android_c34_stage.test.mjs tests/android_c33_stage.test.mjs tests/android_framework_evidence.test.mjs
