name: Android C40R authenticated C39 recovery and Zygote diagnosis
'on':
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/android-c40r-recovery.yml
      - tools/android_c40_recovery_evidence.mjs
      - tools/android_c27_sequence.mjs
      - tests/android_c40_recovery_evidence.test.mjs
      - docs/ANDROID_C40R_RECOVERY.md
permissions:
  contents: read
  actions: read
jobs:
  c40r-recover-and-resume:
    if: github.event.pull_request.head.ref == 'fix/android-c40-recovery-c39-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prove no changes to guest CPU clock memory disk security or XI Ether
        run: |
          set -euo pipefail
          mkdir -p evidence/c40-recovery build
          changes=$(git diff --name-only b626902e5ec2624b89c58fea30b8a0ab36983225 HEAD -- src third_party patches scripts tools)
          for file in $changes; do
            case "$file" in
              tools/android_c27_sequence.mjs|tools/android_c40_recovery_evidence.mjs) ;;
              *) echo "Unexpected runtime change: $file"; exit 1 ;;
            esac
          done
          node --check tools/android_c27_sequence.mjs
          node --check tools/android_c40_recovery_evidence.mjs
          node --test tests/android_c40_recovery_evidence.test.mjs tests/android_c40_zygote_stage.test.mjs tests/android_framework_evidence.test.mjs tests/android_odsign_property_probe.test.mjs > evidence/c40-recovery/host-tests.tap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c39-verified-android-checkpoint
          run-id: 41360328706
          github-token: ${{ github.token }}
          path: source-c39
      - name: Authenticate last trustworthy C39 checkpoint and provenance
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs preflight source-c39/output-contract.json source-c39 > evidence/c40-recovery/verified-source.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const c=read('source-c39/output-contract.json'),r=read('source-c39/current.json');
          assert.equal(c.source_commit,'e1fa10cf0594d7d17f4f28521603a83f73a28f4e');
          assert.equal(c.checkpoint_sha256,'094d5c9b9532fbb21ea029031b952f46c4df0e589c2f0d75a4dd64677bc49438');
          assert.equal(r.guest.instructions,18393448839);
          assert.equal(r.error,'');
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c29-tested-build
          run-id: 41151900393
          github-token: ${{ github.token }}
          path: pinned-build
      - name: Compile unchanged XI Ether ARM64 emulator and real framebuffer verifier
        run: |
          set -euo pipefail
          tar -xzf pinned-build/tested-source.tar.gz build/ether-compat build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
          FLAGS="-std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools"
          g++ $FLAGS tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -o build/c40r-native
          g++ $FLAGS tools/guest_checkpoint_frame.cpp build/softfloat/libreverse_softfloat.a -o build/c40r-frame
          build/c40r-native --pins > evidence/c40-recovery/native-pins.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {verifyNativePins} from './tools/android_c27_profile_resume.mjs';
          verifyNativePins(JSON.parse(readFileSync('evidence/c40-recovery/native-pins.json','utf8')));
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Restore exact original 10.9 GB Android disk without writes to image
        run: |
          set -euo pipefail
          ORIGINAL=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$ORIGINAL"
          node tools/android_c27_media.mjs "$ORIGINAL" new-media > evidence/c40-recovery/media.json
          rm -rf disk-input

      - name: C40R1 run real Android 250 million instructions from previously verified checkpoint
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          node tools/android_c27_sequence.mjs source-c39/output-contract.json source-c39 build/c40r-native new-media/android-c27.raw build/c40r-frame evidence/c40r1 "$SHA" 540000 250000000 1 > evidence/c40-recovery/stage-1-sequence.json
      - name: C40R1 independently authenticate all output and classify Zygote status
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs preflight evidence/c40r1/output-contract.json evidence/c40r1 > evidence/c40-recovery/stage-1-preflight.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const src=read('source-c39/current.json'),c=read('source-c39/output-contract.json');
          const dst=read('evidence/c40r1/current.json'),d=read('evidence/c40r1/output-contract.json');
          const b=read('evidence/c40r1/boundary-summary.json'),result=read('evidence/c40r1/result.json');
          const host=read('evidence/c40r1/process-outcome.json'),recovery=read('evidence/c40r1/recovery-evidence.json');
          assert.equal(dst.initial_instructions,src.guest.instructions);
          assert.ok(dst.guest.instructions>src.guest.instructions);
          assert.ok(dst.advanced_instructions<=250000000);
          assert.equal(dst.provenance.input_checkpoint_sha256,c.checkpoint_sha256);
          assert.equal(dst.error,'');assert.ok(['instruction_budget','host_wall_budget'].includes(dst.stop_reason));
          assert.equal(b.clean_completed,true);assert.equal(b.checkpoint_sha256,d.checkpoint_sha256);
          assert.equal(result.execution_progress_accepted,true);
          assert.equal(host.status,'process_completed');assert.equal(host.exit_code,0);
          assert.equal(recovery.original_source_sha256,c.checkpoint_sha256);
          assert.equal(recovery.journal_sha_verified,true);
          assert.equal(recovery.clean_native_budget,true);
          assert.equal(recovery.recovery_candidate_is_promotion_authority,false);
          for(const k of ['guest_kernel_panic','guest_boot_failure','guest_reboot_requested','guest_terminal_failure'])assert.equal(result[k],false);
          writeFileSync('evidence/c40-recovery/stage-1-success.json',JSON.stringify({step:1,source_sha256:c.checkpoint_sha256,checkpoint_sha256:d.checkpoint_sha256,source_instructions:src.guest.instructions,instructions:dst.guest.instructions},null,2)+'\n');
          NODE
          SHA=$(node -p "require('./evidence/c40r1/output-contract.json').checkpoint_sha256")
          node --max-old-space-size=5000 tools/android_kernel_observer.mjs evidence/c40r1/current.rvg "$SHA" 1073741824 --live-properties --zygote-probe > evidence/c40-recovery/stage-1-kernel.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';
          import {classifyZygoteStage} from './tools/android_c40_zygote_stage.mjs';
          const kernel=JSON.parse(readFileSync('evidence/c40-recovery/stage-1-kernel.json','utf8'));
          const p=classifyZygoteStage(kernel);
          const props=kernel.live_boot_property?.boot_chain_property_observations??[];
          for(const name of ['odsign.key.done','odsign.verification.done'])
            assert.ok(props.some(x=>x.name===name&&x.status==='property_observed'&&x.value==='1'),'Security property regressed: '+name);
          assert.equal(kernel.input_unchanged,true);
          writeFileSync('evidence/c40-recovery/stage-1-zygote.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify({step:1,checkpoint_sha256:p.checkpoint_sha256,stage:p.stage,zygote_launcher_pid:p.launcher_pid,zygote_named_pid:p.named_zygote_pid,system_server_pid:p.system_server_pid},null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reverse-c40r1-verified-android-checkpoint
          path: |-
            evidence/c40r1/
            !evidence/c40r1/native/journal/**
            !evidence/c40r1/native/current.rvg
            !evidence/c40r1/native/frame.ppm
            !evidence/c40r1/native/frame.pending.ppm
          if-no-files-found: error
          retention-days: 90

      - name: C40R2 run real Android 250 million instructions from previously verified checkpoint
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          node tools/android_c27_sequence.mjs evidence/c40r1/output-contract.json evidence/c40r1 build/c40r-native new-media/android-c27.raw build/c40r-frame evidence/c40r2 "$SHA" 540000 250000000 1 > evidence/c40-recovery/stage-2-sequence.json
      - name: C40R2 independently authenticate all output and classify Zygote status
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs preflight evidence/c40r2/output-contract.json evidence/c40r2 > evidence/c40-recovery/stage-2-preflight.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const src=read('evidence/c40r1/current.json'),c=read('evidence/c40r1/output-contract.json');
          const dst=read('evidence/c40r2/current.json'),d=read('evidence/c40r2/output-contract.json');
          const b=read('evidence/c40r2/boundary-summary.json'),result=read('evidence/c40r2/result.json');
          const host=read('evidence/c40r2/process-outcome.json'),recovery=read('evidence/c40r2/recovery-evidence.json');
          assert.equal(dst.initial_instructions,src.guest.instructions);
          assert.ok(dst.guest.instructions>src.guest.instructions);
          assert.ok(dst.advanced_instructions<=250000000);
          assert.equal(dst.provenance.input_checkpoint_sha256,c.checkpoint_sha256);
          assert.equal(dst.error,'');assert.ok(['instruction_budget','host_wall_budget'].includes(dst.stop_reason));
          assert.equal(b.clean_completed,true);assert.equal(b.checkpoint_sha256,d.checkpoint_sha256);
          assert.equal(result.execution_progress_accepted,true);
          assert.equal(host.status,'process_completed');assert.equal(host.exit_code,0);
          assert.equal(recovery.original_source_sha256,c.checkpoint_sha256);
          assert.equal(recovery.journal_sha_verified,true);
          assert.equal(recovery.clean_native_budget,true);
          assert.equal(recovery.recovery_candidate_is_promotion_authority,false);
          for(const k of ['guest_kernel_panic','guest_boot_failure','guest_reboot_requested','guest_terminal_failure'])assert.equal(result[k],false);
          writeFileSync('evidence/c40-recovery/stage-2-success.json',JSON.stringify({step:2,source_sha256:c.checkpoint_sha256,checkpoint_sha256:d.checkpoint_sha256,source_instructions:src.guest.instructions,instructions:dst.guest.instructions},null,2)+'\n');
          NODE
          SHA=$(node -p "require('./evidence/c40r2/output-contract.json').checkpoint_sha256")
          node --max-old-space-size=5000 tools/android_kernel_observer.mjs evidence/c40r2/current.rvg "$SHA" 1073741824 --live-properties --zygote-probe > evidence/c40-recovery/stage-2-kernel.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';
          import {classifyZygoteStage} from './tools/android_c40_zygote_stage.mjs';
          const kernel=JSON.parse(readFileSync('evidence/c40-recovery/stage-2-kernel.json','utf8'));
          const p=classifyZygoteStage(kernel);
          const props=kernel.live_boot_property?.boot_chain_property_observations??[];
          for(const name of ['odsign.key.done','odsign.verification.done'])
            assert.ok(props.some(x=>x.name===name&&x.status==='property_observed'&&x.value==='1'),'Security property regressed: '+name);
          assert.equal(kernel.input_unchanged,true);
          writeFileSync('evidence/c40-recovery/stage-2-zygote.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify({step:2,checkpoint_sha256:p.checkpoint_sha256,stage:p.stage,zygote_launcher_pid:p.launcher_pid,zygote_named_pid:p.named_zygote_pid,system_server_pid:p.system_server_pid},null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reverse-c40r2-verified-android-checkpoint
          path: |-
            evidence/c40r2/
            !evidence/c40r2/native/journal/**
            !evidence/c40r2/native/current.rvg
            !evidence/c40r2/native/frame.ppm
            !evidence/c40r2/native/frame.pending.ppm
          if-no-files-found: error
          retention-days: 90

      - name: C40R3 run real Android 250 million instructions from previously verified checkpoint
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          node tools/android_c27_sequence.mjs evidence/c40r2/output-contract.json evidence/c40r2 build/c40r-native new-media/android-c27.raw build/c40r-frame evidence/c40r3 "$SHA" 540000 250000000 1 > evidence/c40-recovery/stage-3-sequence.json
      - name: C40R3 independently authenticate all output and classify Zygote status
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs preflight evidence/c40r3/output-contract.json evidence/c40r3 > evidence/c40-recovery/stage-3-preflight.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const src=read('evidence/c40r2/current.json'),c=read('evidence/c40r2/output-contract.json');
          const dst=read('evidence/c40r3/current.json'),d=read('evidence/c40r3/output-contract.json');
          const b=read('evidence/c40r3/boundary-summary.json'),result=read('evidence/c40r3/result.json');
          const host=read('evidence/c40r3/process-outcome.json'),recovery=read('evidence/c40r3/recovery-evidence.json');
          assert.equal(dst.initial_instructions,src.guest.instructions);
          assert.ok(dst.guest.instructions>src.guest.instructions);
          assert.ok(dst.advanced_instructions<=250000000);
          assert.equal(dst.provenance.input_checkpoint_sha256,c.checkpoint_sha256);
          assert.equal(dst.error,'');assert.ok(['instruction_budget','host_wall_budget'].includes(dst.stop_reason));
          assert.equal(b.clean_completed,true);assert.equal(b.checkpoint_sha256,d.checkpoint_sha256);
          assert.equal(result.execution_progress_accepted,true);
          assert.equal(host.status,'process_completed');assert.equal(host.exit_code,0);
          assert.equal(recovery.original_source_sha256,c.checkpoint_sha256);
          assert.equal(recovery.journal_sha_verified,true);
          assert.equal(recovery.clean_native_budget,true);
          assert.equal(recovery.recovery_candidate_is_promotion_authority,false);
          for(const k of ['guest_kernel_panic','guest_boot_failure','guest_reboot_requested','guest_terminal_failure'])assert.equal(result[k],false);
          writeFileSync('evidence/c40-recovery/stage-3-success.json',JSON.stringify({step:3,source_sha256:c.checkpoint_sha256,checkpoint_sha256:d.checkpoint_sha256,source_instructions:src.guest.instructions,instructions:dst.guest.instructions},null,2)+'\n');
          NODE
          SHA=$(node -p "require('./evidence/c40r3/output-contract.json').checkpoint_sha256")
          node --max-old-space-size=5000 tools/android_kernel_observer.mjs evidence/c40r3/current.rvg "$SHA" 1073741824 --live-properties --zygote-probe > evidence/c40-recovery/stage-3-kernel.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';
          import {classifyZygoteStage} from './tools/android_c40_zygote_stage.mjs';
          const kernel=JSON.parse(readFileSync('evidence/c40-recovery/stage-3-kernel.json','utf8'));
          const p=classifyZygoteStage(kernel);
          const props=kernel.live_boot_property?.boot_chain_property_observations??[];
          for(const name of ['odsign.key.done','odsign.verification.done'])
            assert.ok(props.some(x=>x.name===name&&x.status==='property_observed'&&x.value==='1'),'Security property regressed: '+name);
          assert.equal(kernel.input_unchanged,true);
          writeFileSync('evidence/c40-recovery/stage-3-zygote.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify({step:3,checkpoint_sha256:p.checkpoint_sha256,stage:p.stage,zygote_launcher_pid:p.launcher_pid,zygote_named_pid:p.named_zygote_pid,system_server_pid:p.system_server_pid},null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reverse-c40r3-verified-android-checkpoint
          path: |-
            evidence/c40r3/
            !evidence/c40r3/native/journal/**
            !evidence/c40r3/native/current.rvg
            !evidence/c40r3/native/frame.ppm
            !evidence/c40r3/native/frame.pending.ppm
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c40r-recovery-diagnostics
          path: |-
            evidence/c40-recovery/
            evidence/c40r1/boundary-summary.json
            evidence/c40r1/recovery-evidence.json
            evidence/c40r1/recovery-evidence-error.txt
            evidence/c40r1/continuation-error.txt
            evidence/c40r1/native/process-outcome.json
            evidence/c40r1/native/current.json
            evidence/c40r1/native/result.json
            evidence/c40r1/native/progress.log
            evidence/c40r1/native/native-stdout.log
            evidence/c40r1/native/journal/latest.json
            evidence/c40r2/boundary-summary.json
            evidence/c40r2/recovery-evidence.json
            evidence/c40r2/recovery-evidence-error.txt
            evidence/c40r2/continuation-error.txt
            evidence/c40r2/native/process-outcome.json
            evidence/c40r2/native/current.json
            evidence/c40r2/native/result.json
            evidence/c40r2/native/progress.log
            evidence/c40r2/native/native-stdout.log
            evidence/c40r2/native/journal/latest.json
            evidence/c40r3/boundary-summary.json
            evidence/c40r3/recovery-evidence.json
            evidence/c40r3/recovery-evidence-error.txt
            evidence/c40r3/continuation-error.txt
            evidence/c40r3/native/process-outcome.json
            evidence/c40r3/native/current.json
            evidence/c40r3/native/result.json
