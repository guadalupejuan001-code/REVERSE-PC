        node tools/android_c46_continue.mjs evidence/c53-5 evidence/c53-6 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c53-5/c42-progress.json 1000000000 2147483648 > evidence/c53-source/stage-6.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s6.outcome == 'success'
