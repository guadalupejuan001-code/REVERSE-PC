          evidence/c53-6/*.txt
          evidence/c53-6/*.log
          evidence/c53-6/native/*.json
          evidence/c53-6/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C53 stage 7 execute and verify the authentic Android machine
      id: s7
      if: success() && steps.s6.outcome == 'success' && steps.s6.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c53-6 evidence/c53-7 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c53-6/c42-progress.json 1000000000 2147483648 > evidence/c53-source/stage-7.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s7.outcome == 'success'
      with:
        name: reverse-c53-stage-7-verified-checkpoint
        path: |-
          evidence/c53-7/
          !evidence/c53-7/native/journal/**
          !evidence/c53-7/native/current.rvg
