        if-no-files-found: warn
        retention-days: 90
    - name: C53 stage 6 execute and verify the authentic Android machine
      id: s6
      if: success() && steps.s5.outcome == 'success' && steps.s5.outputs.boot != 'true'
      run: |
        set -euo pipefail
