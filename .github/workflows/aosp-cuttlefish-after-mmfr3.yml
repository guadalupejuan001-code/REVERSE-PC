name: REVERSE genuine Android guest after MMFR3 from pinned XI Ether RVG
on:
  pull_request:
    paths:
      - '.github/workflows/aosp-cuttlefish-after-mmfr3.yml'
      - 'src/minimal_guest_system.inc'
      - 'tools/guest_linux_probe.cpp'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  next-actual-android-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reverse-aosp-mmfr3-next-checkpoint
          run-id: 40799212140
          github-token: ${{ github.token }}
          path: prior
      - name: Verify real Cuttlefish kernel+initramfs backed 880950-step RVG
        run: |
          set -euo pipefail
          mkdir -p build evidence
          echo 'dfc478363ffa0fa808b08f093eedea33466c650cc90eca34fc525fe9636a2ca0  prior/current.rvg' | sha256sum -c -
          jq -e '.guest.instructions==880950 and
            .guest.immutable_image_bytes==47713308 and
            .guest.exception_level==1 and .guest.exceptions==0 and
            .stop_reason=="instruction_budget" and
            .next_instruction.opcode=="0x6b0a01ff" and
            .next_instruction.virtual_pc=="0x404075e8" and
            .android_boot==false and .linux_userspace_init_observed==false' prior/actual-stop.json >/dev/null
          node tools/audit_gki_rvg.mjs prior/current.rvg \
            f722bdd809bfd3485917a564b053b8a6d4938408734091f420c3297a8e3b20c8 \
            dfc478363ffa0fa808b08f093eedea33466c650cc90eca34fc525fe9636a2ca0 \
            > evidence/verified-input.json
          jq -e '.status=="read_only_provenance_verified" and
            .instructions==880950 and .kernel_bytes==42031616 and
            .initrd_bytes==5680128 and .classical_override_limit=="0"' evidence/verified-input.json >/dev/null
      - name: Compile pinned original XI Ether interpreter without changes to memory authority
        run: |
          set -euo pipefail
          test "$(git -C deps/mundo-x rev-parse HEAD)" = e2778d962af22f6f1a0794058dd4685fc2573966
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 scripts/build-softfloat.py
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 \
            -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc \
            tools/guest_linux_probe.cpp build/softfloat/libreverse_softfloat.a -o build/linux-probe
      - name: Confirm continuous 10000 transitions equal 1+9999 checkpoint replay
        run: |
          set -euo pipefail
          timeout 90 build/linux-probe prior/current.rvg 10000 evidence/direct.rvg > evidence/direct.json
          timeout 90 build/linux-probe prior/current.rvg 1 evidence/first.rvg > evidence/first.json
          timeout 90 build/linux-probe evidence/first.rvg 9999 evidence/resumed.rvg > evidence/resumed.json
          cmp evidence/direct.rvg evidence/resumed.rvg
          jq -e '.initial_instructions==880950 and .guest.instructions>=880951 and
            .android_boot==false and .guest.immutable_image_bytes==47713308' evidence/direct.json >/dev/null
          cp evidence/direct.rvg evidence/current.rvg
          sha256sum evidence/direct.rvg > evidence/replay.sha256
      - name: Extend genuine AOSP guest up to eight million instructions or exact architecture failure
        run: |
          set -euo pipefail
          printf '| Batch | Total ARM64 instructions | EL | Exceptions | Stop | UART characters |\n|---|---:|---:|---:|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 8); do
            timeout 180 build/linux-probe evidence/current.rvg 1000000 evidence/next.rvg > "evidence/step-$i.json"
            jq -e '.initial_instructions>=880950 and
              .guest.instructions>=.initial_instructions and
              .guest.immutable_image_bytes==47713308 and
              .guest.max_delta_overrides==0 and .adaptive_classical_storage and
              .android_boot==false and .linux_boot_complete==false' "evidence/step-$i.json" >/dev/null
            stop=$(jq -r '.stop_reason' "evidence/step-$i.json")
            total=$(jq -r '.guest.instructions' "evidence/step-$i.json")
            level=$(jq -r '.guest.exception_level' "evidence/step-$i.json")
            exceptions=$(jq -r '.guest.exceptions' "evidence/step-$i.json")
            output=$(jq -r '.console|length' "evidence/step-$i.json")
            printf '| %s | %s | %s | %s | %s | %s |\n' "$i" "$total" "$level" "$exceptions" "$stop" "$output" >> "$GITHUB_STEP_SUMMARY"
            mv evidence/next.rvg evidence/current.rvg
            if [[ "$stop" != instruction_budget ]]; then
              break
            fi
          done
          last=$(ls evidence/step-*.json | sort -V | tail -1)
          jq '{initial_instructions,guest:{pc:.guest.pc,instructions:.guest.instructions,
            exception_level:.guest.exception_level,exceptions:.guest.exceptions,
            mmu_enabled:.guest.mmu_enabled,immutable_image_bytes:.guest.immutable_image_bytes,
            delta_overrides:.guest.delta_overrides},
            stop_reason,next_instruction,console,android_boot,
            linux_userspace_init_observed}' "$last" > evidence/actual-stop.json
          sha256sum evidence/current.rvg > evidence/checkpoint.sha256
          cat evidence/actual-stop.json
          cat evidence/checkpoint.sha256
          {
            echo '## Authentic original Cuttlefish GKI + real first-stage Android initramfs'
            echo 'Android /init is present in initrd but has not been independently shown running.'
            echo 'Do not infer services/ADB from EL1 kernel transitions.'
            echo 'No matching vendor partition drivers or super.img mounted.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-aosp-after-mmfr3-extended
          path: evidence/
          retention-days: 7
