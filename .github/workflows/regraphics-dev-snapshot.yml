name: REgraphics development source snapshot
on:
  push:
    branches: [feature/regraphics-frame-cache-20261101]
    paths: ['.github/workflows/regraphics-dev-snapshot.yml']
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: 1f925786522aba91f72707ad1638a8edcdd31a8f
          path: deps/mundo-x
          persist-credentials: false
      - name: Bundle exact XI/REgraphics runtime and test sources
        run: |
          tar czf /tmp/regraphics-dev-current.tgz \
            --exclude=.git --exclude=build --exclude=results --exclude=docs/evidence \
            src scripts tests examples CMakeLists.txt reverse-os-android \
            deps/mundo-x/native/include deps/mundo-x/native/src deps/mundo-x/README.md \
            .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: regraphics-dev-current
          path: /tmp/regraphics-dev-current.tgz
          retention-days: 1
