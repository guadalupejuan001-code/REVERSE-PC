name: Android C54 GPU backing normalization and authentic boot continuation
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c54-gpu-backing-split-continue.yml
    - src/minimal_guest_pci.inc
    - tests/minimal_guest_pci_test.cpp
    - tests/fixtures/android_c54_gpu_backing.json
    - tools/android_gpu_backing_evidence.mjs
    - docs/ANDROID_C54_GPU_BACKING_NORMALIZATION.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c54-gpu-backing-split' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c54-native build
        git diff --exit-code 4e9b8be2cd7941bc7e25a4a49fd1365fbef8c180 HEAD -- src scripts patches third_party tools ':(exclude)src/minimal_guest_pci.inc' ':(exclude)tools/android_gpu_backing_evidence.mjs'
        python3 - <<'PYCODE'
        import pathlib,subprocess
        p='src/minimal_guest_pci.inc';old=subprocess.check_output(['git','show','4e9b8be2cd7941bc7e25a4a49fd1365fbef8c180:'+p]).decode();new=pathlib.Path(p).read_text();a=old.index('      else if(type==0x106)');b=old.index('      else if(type==0x107)',a);c=new.index('      else if(type==0x106)');d=new.index('      else if(type==0x107)',c);assert old[:a]==new[:c] and old[b:]==new[d:]
        PYCODE
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify real DMA normalization, unchanged decoding, pixel boundaries and rollback
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        g++ $FLAGS -O2 tests/minimal_guest_pci_test.cpp build/softfloat/libreverse_softfloat.a -o build/c54-pci
        build/c54-pci > evidence/c54-native/pci-release.json
        g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/minimal_guest_pci_test.cpp build/softfloat/libreverse_softfloat.a -o build/c54-pci-ubsan
        build/c54-pci-ubsan > evidence/c54-native/pci-ubsan.json
        python3 - <<'PYCODE'
        import pathlib,hashlib
        known={'pci-gpu-witness.rvg':'1d51696c883213bc1def34fdf54e4f31af133d3b698ea8b9b2ad392f45bea0f1','pci-graphics-demo.rvg':'2a602a872872d28f9aa1d5c356e6ec7ab90f90be597d3fd0d257f29eeab825ef','pci-graphics-finished.rvg':'bad77953b78cee2e28c2fb2fcf570b3e28d9000f327c450881cac5f44f9b9706'}
        for name,expected in known.items():assert hashlib.sha256(pathlib.Path('evidence/c03',name).read_bytes()).hexdigest()==expected
        PYCODE
        for item in guest_checkpoint_view guest_journal_retention; do
         g++ $FLAGS -O2 tests/${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c54-$item
         build/c54-$item build/c54-view-data > evidence/c54-native/$item.json
        done
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c54-native/native
        evidence/c54-native/native --pins > evidence/c54-native/native-pins.json
        sha256sum evidence/c54-native/native > evidence/c54-native/binary-sha256.txt
        g++ --version > evidence/c54-native/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c54-tested-native
        path: evidence/c54-native
        retention-days: 90
  android-continuation:
    needs:
    - native
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c54-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: reference-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-stage-3-verified-checkpoint
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: source-c53
    - name: Authenticate the clean post-CMHI million-instruction source and independently pinned original CPU
      run: |
        set -euo pipefail
        mkdir -p evidence/c54-source
        cp reference-build/frame native-build/frame
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum native-build/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = '7031b75f8df2021d24d561ff4899505e3ad35fbdd2bcc9a1b4b0e622dc02478e'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c53/output-contract.json')),p=preflight(c,'source-c53',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'4e9b8be2cd7941bc7e25a4a49fd1365fbef8c180');assert.equal(c.checkpoint_sha256,'b86300a19f08c0e55952aa2414b1760d7e4e00818d3342f639e4945ed3d05b27');assert.equal(p.report.guest.instructions,28135883418);writeFileSync('evidence/c54-source/preflight.json',JSON.stringify(c,null,2)+'\n');
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        fallocate --dig-holes new-media/android-c27.raw
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c54-source/media.json
        cp media-input/manifest.json evidence/c54-source/media-transport.json
        rm -rf media-input
    - name: Execute the original C53 device to the clean boundary before the real GPU notification
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        const r=await run(JSON.parse(readFileSync('source-c53/output-contract.json')),'source-c53','reference-build/native','new-media/android-c27.raw','evidence/c54-reference',{wallMs:900000,instructions:359283003,cycles:1,maxTransportBytes:2147483648});assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(r.result.checkpoint_sha256,'088cc00e3972e811459c4380013e79a35567bd8addfcf9e558d92108f0fd2716');writeFileSync('evidence/c54-source/reference.json',JSON.stringify(r,null,2)+'\n');
        NODE
    - name: C54 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c53 evidence/c54-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c53/c42-progress.json 359283003 2147483648 > evidence/c54-source/stage-1.json
        cmp evidence/c54-reference/current.rvg evidence/c54-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c54-1/current.json'));assert.equal(r.guest.instructions,28495166421);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'088cc00e3972e811459c4380013e79a35567bd8addfcf9e558d92108f0fd2716');
        NODE
        rm -rf evidence/c54-reference reference-build
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c54-stage-1-verified-checkpoint
        path: |-
          evidence/c54-1/
          !evidence/c54-1/native/journal/**
          !evidence/c54-1/native/current.rvg
          !evidence/c54-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c54-stage-1-diagnostics
        path: |-
          evidence/c54-1/*.json
          evidence/c54-1/*.txt
          evidence/c54-1/*.log
          evidence/c54-1/native/*.json
          evidence/c54-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C54 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c54-1 evidence/c54-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c54-1/c42-progress.json 1 2147483648 > evidence/c54-source/stage-2.json
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import{inspectGpuBacking}from'./tools/android_gpu_backing_evidence.mjs';
        const before=await inspectGpuBacking('evidence/c54-1'),after=await inspectGpuBacking('evidence/c54-2'),fixture=JSON.parse(readFileSync('tests/fixtures/android_c54_gpu_backing.json'));assert.equal(after.instructions,28495166422);assert.equal(after.pc,'0xffffffc07afc18b4');assert.equal(before.gpu.queues[0].last,1);assert.equal(before.gpu.queues[0].used_index,1);assert.equal(after.gpu.queues[0].last,3);assert.equal(after.gpu.queues[0].used_index,3);const r=after.resources.find(x=>x.id===2);assert.ok(r);for(const k of ['format','width','height'])assert.equal(r[k],fixture[k]);assert.equal(r.backing.length,66);assert.equal(r.total_backing_bytes,1921024);assert.ok(r.backing.every(e=>e.length>0&&e.length<=1048576));for(let i=0;i<63;++i)assert.deepEqual(r.backing[i],{address:fixture.original_entries[i].address,length:fixture.original_entries[i].length});assert.deepEqual(r.backing.slice(63),[{address:fixture.original_entries[63].address,length:1048576},{address:fixture.original_entries[63].address+1048576,length:131072},{address:fixture.original_entries[64].address,length:479232}]);writeFileSync('evidence/c54-source/gpu-crossing.json',JSON.stringify({before_checkpoint_sha256:before.checkpoint_sha256,old_decoder_binary_sha256:'4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19',...after},null,2)+'\n');
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c54-stage-2-verified-checkpoint
        path: |-
          evidence/c54-2/
          !evidence/c54-2/native/journal/**
          !evidence/c54-2/native/current.rvg
          !evidence/c54-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: rm -rf evidence/c54-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
