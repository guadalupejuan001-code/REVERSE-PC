name: Android C52 exact faster host evidence
'on':
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/android-c52-host-evidence.yml
      - tools/rvg_checksum.mjs
      - tools/rvg_checksum_wasm.mjs
      - tools/android_kernel_observer.mjs
      - tests/rvg_checksum_wasm.test.mjs
      - docs/ANDROID_C52_HOST_EVIDENCE.md
permissions:
  contents: read
  actions: read
jobs:
  host-evidence:
    if: github.event.pull_request.head.ref == 'perf/android-c52-host-evidence' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 701739f0357e9cea18cf456e1c14eb3f4c01b5c1
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify original runtime and reference checksum/observer implementations
        run: |
          set -euo pipefail
          mkdir -p evidence/c52
          git diff --exit-code 701739f0357e9cea18cf456e1c14eb3f4c01b5c1 HEAD -- src scripts patches third_party CMakeLists.txt
          python3 - <<'PY'
          import pathlib,subprocess
          changed=subprocess.check_output(['git','diff','--name-only','701739f0357e9cea18cf456e1c14eb3f4c01b5c1','HEAD']).decode().splitlines()
          assert set(p for p in changed if p.startswith('tools/'))=={'tools/rvg_checksum.mjs','tools/rvg_checksum_wasm.mjs','tools/android_kernel_observer.mjs'}
          p='tools/rvg_checksum.mjs';old=pathlib.Path('reference',p).read_text();new=pathlib.Path(p).read_text();assert new.replace("import {fnv1a64Wasm} from './rvg_checksum_wasm.mjs';\n",'').replace("  if(process.env.REVERSE_PC_FAST_FNV==='1')return fnv1a64Wasm(bytes,length);\n",'')==old
          p='tools/android_kernel_observer.mjs';old=pathlib.Path('reference',p).read_text();new=pathlib.Path(p).read_text();a=new.index(' // Cache only validated immutable BTF metadata');b=new.index(' const resolveType=t=>',a);assert (new[:a]+new[b:]).replace(' const typeReference=name=>{',' const type=name=>{',1)==old
          PY
      - name: Check exact hash vectors, scratch boundaries and evidence regressions in both modes
        run: |
          set -euo pipefail
          TESTS='tests/rvg_checksum.test.mjs tests/rvg_checksum_wasm.test.mjs tests/audit_gki_rvg.test.mjs tests/rvg_memory_lines.test.mjs tests/android_framework_evidence.test.mjs tests/android_live_property.test.mjs tests/android_c27_profile_resume.test.mjs tests/android_c42_zygote_progress.test.mjs tests/android_c46_continue.test.mjs'
          REVERSE_PC_FAST_FNV=0 REVERSE_PC_FAST_OBSERVER=0 node --test $TESTS > evidence/c52/reference-tests.tap
          REVERSE_PC_FAST_FNV=1 REVERSE_PC_FAST_OBSERVER=1 node --test $TESTS > evidence/c52/fast-tests.tap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c50-stage-2-verified-checkpoint
          run-id: 41932700773
          github-token: ${{ github.token }}
          path: source
      - name: Compare complete original and fast observations on the genuine compact checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,os,time,json,hashlib
          source=pathlib.Path('source/current.rvg');expected='ec801f66fefbe9db6a6524018bf803260ba68ddd8c0013631957c4db6110203d'
          def digest():
           h=hashlib.sha256()
           with source.open('rb') as f:
            for b in iter(lambda:f.read(1048576),b''):h.update(b)
           return h.hexdigest()
          assert digest()==expected
          contract=json.loads(pathlib.Path('source/output-contract.json').read_text());assert contract['checkpoint_sha256']==expected and contract['source_commit']=='0cece952f8363d00bf7e9adcdcdc902886f47bc2'
          timings={}
          for label,script,fast in [('reference','reference/tools/android_kernel_observer.mjs','0'),('fast','tools/android_kernel_observer.mjs','1')]:
           env=os.environ.copy();env['REVERSE_PC_FAST_FNV']=fast;env['REVERSE_PC_FAST_OBSERVER']=fast
           with pathlib.Path('evidence/c52',label+'-kernel.json').open('wb') as out,pathlib.Path('evidence/c52',label+'-kernel.log').open('wb') as err:
            start=time.perf_counter();subprocess.run(['node','--max-old-space-size=5000',script,str(source),expected,'2147483648','--live-properties','--zygote-probe','--scheduler-probe'],env=env,stdout=out,stderr=err,timeout=300,check=True);timings[label]=time.perf_counter()-start
          a=pathlib.Path('evidence/c52/reference-kernel.json').read_bytes();b=pathlib.Path('evidence/c52/fast-kernel.json').read_bytes();assert a==b;assert digest()==expected
          j=json.loads(a);assert j['input_unchanged'] and j['instructions']==28109220619
          pathlib.Path('evidence/c52/differential.json').write_text(json.dumps({'checkpoint_sha256':expected,'instructions':j['instructions'],'all_original_observation_bytes_identical':True,'input_bytes_unchanged':True,'seconds':timings,'speedup':timings['reference']/timings['fast']},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c52-host-evidence
          path: evidence/c52/
          if-no-files-found: error
          retention-days: 90
