name: Velocity C04 pinned component source verification
on:
  push:
    branches: [feature/velocity-c04-qssd-component-20261108]
    paths: [.github/workflows/velocity-c04-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/Virtual-qSSD-
          ref: 9fe72bbf0d972d0baad9300971dfaabab5691447
          path: deps/qssd
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/GPU-VIRTUAL
          ref: 4cdd47f487cfadbca559dd8c2f5abc0448cd77a7
          path: deps/gpu-virtual
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: 1f925786522aba91f72707ad1638a8edcdd31a8f
          path: deps/mundo-x
          sparse-checkout: native/include
          persist-credentials: false
      - name: Archive exact tracked sources without Git credentials or build products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/c04-source/velocity build/c04-source/qssd build/c04-source/gpu build/c04-source/mundo-x/native
          git archive HEAD | tar -xf - -C build/c04-source/velocity
          git -C deps/qssd archive HEAD | tar -xf - -C build/c04-source/qssd
          git -C deps/gpu-virtual archive HEAD | tar -xf - -C build/c04-source/gpu
          cp -a deps/mundo-x/native/include build/c04-source/mundo-x/native/
          printf '%s\n' "velocity=$(git rev-parse HEAD)" "qssd=$(git -C deps/qssd rev-parse HEAD)" "gpu=$(git -C deps/gpu-virtual rev-parse HEAD)" "mundo-x=$(git -C deps/mundo-x rev-parse HEAD)" > build/c04-source/origins.txt
          tar -czf build/velocity-c04-pinned-sources.tar.gz -C build/c04-source .
          sha256sum build/velocity-c04-pinned-sources.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-c04-pinned-sources
          path: build/velocity-c04-pinned-sources.tar.gz
          if-no-files-found: error
