name: XI continuous quantum primitives
on:
  pull_request:
    paths:
      - 'src/integration/**'
      - 'src/xi_session.cpp'
      - 'scripts/prepare-ether-compat.py'
      - 'scripts/build-xi-session.sh'
      - 'scripts/xi_session_client.py'
      - 'tests/xi_continuous.py'
      - 'tests/mps_connected.cpp'
      - 'tests/xi_mps.py'
      - 'CMakeLists.txt'
      - '.github/workflows/xi-continuous-learning.yml'
  push:
    branches: [main]
    paths: ['src/integration/**', 'src/xi_session.cpp', 'tests/xi_continuous.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-quantum-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - name: Build same pinned XI and Ether authority
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/guadalupejuan001-code/mundo-X.git deps/mundo-x
          git -C deps/mundo-x checkout --detach e2778d962af22f6f1a0794058dd4685fc2573966
          bash scripts/build-xi-session.sh deps/mundo-x build/xi-learning
      - name: Dense oracle, all 2000 causal derivatives, checkpoint and rollback
        run: python tests/xi_continuous.py build/xi-learning/reverse_pc build/xi-learning/xi_session build/xi-validation
      - name: Connected 1000-qubit MPS, dense oracle and all 999 entangled cuts
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Isrc tests/mps_connected.cpp -o build/mps-connected
          build/mps-connected > build/xi-validation/mps-connected.json
          python tests/xi_mps.py build/xi-learning/reverse_pc build/xi-learning/xi_session build/xi-validation/mps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XI-continuous-2000-causal-qubits
          path: build/xi-validation/
          if-no-files-found: warn
          retention-days: 90
