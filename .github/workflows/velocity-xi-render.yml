name: REVERSE VELOCITY REgraphics
on:
  push:
    branches: [feature/velocity-v30-open-forest-road-20261104, feature/velocity-v31-reverse-native-live-20261105, feature/velocity-v32-wetlands-gpu-20261105, feature/velocity-v33-open-terrain-20261105, feature/velocity-v34-trails-hd-20261105, feature/velocity-gpu-virtual-20261106, feature/velocity-v36-graphics-ui-20261106, feature/velocity-v37-cpu-gpu-20261106]
  pull_request:
    branches: [feature/velocity-regraphics-20261030]
    paths: ['reverse-os-android/**', 'scripts/**', '.github/workflows/velocity-xi-render.yml']
permissions: {contents: read}
concurrency:
  group: velocity-regraphics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  open-forest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: 1f925786522aba91f72707ad1638a8edcdd31a8f
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/GPU-VIRTUAL
          ref: c69c99961ade8889253b73b0ba2c674a6918badc
          path: deps/gpu-virtual
          sparse-checkout: android-graphics/shared
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/checkout@v4
        with:
          ref: 8389252a9014bdf2e46c7230289ead7a3d672984
          path: deps/velocity-baseline
          persist-credentials: false
      - name: Verify XI ownership and reproducible finite world
        run: |
          node scripts/check-velocity-native-only.cjs
          node scripts/check-velocity-gpu-virtual.cjs deps/gpu-virtual
          node scripts/open-forest-author-contract.cjs
          node scripts/forest-trails-contract.cjs build/open-forest
          node scripts/velocity-car-contract.cjs
          node scripts/velocity-textures-contract.cjs
          node scripts/author-velocity-forest.cjs
          node scripts/author-velocity-scene.cjs
          git diff --exit-code -- reverse-os-android/app/src/main/assets/velocity
      - name: Build the pinned interpreter and open-world harness
        run: |
          mkdir -p build/velocity build/open-forest build/ether-compat
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/velocity/reverse_pc
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/open-forest-contract.cpp -o build/open-forest/gameplay-test
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/open-forest-reliability.cpp -o build/open-forest/reliability-test
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/open-forest-render-ab.cpp -o build/open-forest/render-ab
          g++ -std=c++17 -O2 -pthread tests/xi_native_tile_raster.cpp -o build/open-forest/native-tile-test
      - name: Build and test immutable GPU geometry and chase camera
        run: |
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/velocity-gpu-observation.cpp -o build/open-forest/gpu-observation
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/open-terrain-contract.cpp -o build/open-forest/open-terrain-test
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/forest-trails-drive.cpp -o build/open-forest/trails-drive
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/velocity-pipeline-profile.cpp -o build/open-forest/pipeline-profile
          build/open-forest/pipeline-profile reverse-os-android/app/src/main/assets/velocity build/open-forest
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/velocity-live-session.cpp -o build/open-forest/live-session
          build/open-forest/live-session reverse-os-android/app/src/main/assets/velocity build/open-forest
          javac -d build/open-forest/java reverse-os-android/app/src/main/java/com/reversepc/os/XiObservationPacket.java reverse-os-android/tests/XiObservationPacketTest.java
          java -cp build/open-forest/java com.reversepc.os.XiObservationPacketTest
          build/open-forest/trails-drive reverse-os-android/app/src/main/assets/velocity build/open-forest
          build/open-forest/open-terrain-test reverse-os-android/app/src/main/assets/velocity build/open-forest
          build/open-forest/gpu-observation reverse-os-android/app/src/main/assets/velocity build/open-forest
          mkdir -p build/open-forest/java
          javac -d build/open-forest/java reverse-os-android/app/src/main/java/x/gpu/virtual/CompactTriangleStream.java reverse-os-android/tests/RegraphicsCompactTest.java reverse-os-android/app/src/main/java/com/reversepc/os/VelocityOrbitMath.java reverse-os-android/app/src/main/java/com/reversepc/os/VelocityChaseCamera.java reverse-os-android/app/src/main/java/com/reversepc/os/RegraphicsGeometry.java reverse-os-android/tests/VelocityChaseCameraTest.java reverse-os-android/tests/RegraphicsGeometryTest.java
          java -cp build/open-forest/java com.reversepc.os.VelocityChaseCameraTest
          java -cp build/open-forest/java com.reversepc.os.RegraphicsGeometryTest build/open-forest/gpu-0-0.xfg4
          java -cp build/open-forest/java com.reversepc.os.RegraphicsCompactTest build/open-forest/*.xfg4
          javac -d build/open-forest/java reverse-os-android/app/src/main/java/com/reversepc/os/VelocityStateExchange.java reverse-os-android/app/src/main/java/com/reversepc/os/VelocityFrameProfiler.java reverse-os-android/tests/VelocityStateExchangeTest.java reverse-os-android/tests/VelocityFrameProfilerTest.java
          java -cp build/open-forest/java com.reversepc.os.VelocityStateExchangeTest
          java -cp build/open-forest/java com.reversepc.os.VelocityFrameProfilerTest
      - name: Compare actual legacy and compact GPU pixels
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri python3-pil python3-numpy
          python3 scripts/verify-velocity-gpu-virtual.py build/open-forest build/open-forest/compact-gpu
          python3 scripts/verify-velocity-presets.py build/open-forest build/open-forest/quality-profiles
      - name: Verify coordinated CPU and GPU against original 3.6 source
        run: |
          python3 deps/velocity-baseline/scripts/prepare-ether-compat.py deps/mundo-x build/ether-before
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DVELOCITY_REFERENCE=1 -Ibuild/ether-before -Ideps/mundo-x/native/include -Ideps/velocity-baseline/src reverse-os-android/tests/velocity-cpu-gpu-link.cpp -o build/open-forest/cpu-gpu-before
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc reverse-os-android/tests/velocity-cpu-gpu-link.cpp -o build/open-forest/cpu-gpu-after
          build/open-forest/cpu-gpu-before reverse-os-android/app/src/main/assets/velocity build/open-forest/link/before
          build/open-forest/cpu-gpu-after reverse-os-android/app/src/main/assets/velocity build/open-forest/link/after
          python3 scripts/verify-velocity-cpu-gpu.py build/open-forest/link
          javac -d build/open-forest/java reverse-os-android/app/src/main/java/com/reversepc/os/XiGeometryDeltaDecoder.java reverse-os-android/app/src/main/java/com/reversepc/os/XiObservationPacket.java reverse-os-android/app/src/main/java/com/reversepc/os/RegraphicsGeometry.java reverse-os-android/app/src/main/java/x/gpu/virtual/CompactTriangleStream.java reverse-os-android/tests/XiGeometryDeltaTest.java reverse-os-android/app/src/main/java/com/reversepc/os/VelocityFrameAhead.java reverse-os-android/tests/VelocityFrameAheadTest.java
          java -cp build/open-forest/java com.reversepc.os.XiGeometryDeltaTest build/open-forest/link/after
          java -cp build/open-forest/java com.reversepc.os.VelocityFrameAheadTest
      - name: Execute all sectors, reverse, time and real XI raster
        run: |
          build/open-forest/gameplay-test reverse-os-android/app/src/main/assets/velocity build/open-forest/gameplay
          build/open-forest/reliability-test reverse-os-android/app/src/main/assets/velocity build/open-forest
          build/open-forest/native-tile-test
          build/open-forest/render-ab reverse-os-android/app/src/main/assets/velocity build/open-forest
          node reverse-os-android/tests/open-forest-render-contract.cjs build/velocity/reverse_pc build/open-forest
          mkdir -p build/open-forest/java
          javac -d build/open-forest/java reverse-os-android/app/src/main/java/com/reversepc/os/VelocityWorldLight.java reverse-os-android/tests/VelocityWorldLightTest.java
          java -cp build/open-forest/java com.reversepc.os.VelocityWorldLightTest reverse-os-android/app/src/main/assets/velocity
          javac -d build/open-forest/java reverse-os-android/app/src/main/java/com/reversepc/os/VelocityGearbox.java reverse-os-android/app/src/main/java/com/reversepc/os/RegraphicsFrame.java reverse-os-android/tests/VelocityGearboxTest.java reverse-os-android/tests/RegraphicsLivePixelsTest.java reverse-os-android/tests/RegraphicsNative4KTest.java reverse-os-android/tests/RegraphicsFrameTest.java
          java -cp build/open-forest/java com.reversepc.os.VelocityGearboxTest
          java -cp build/open-forest/java com.reversepc.os.RegraphicsLivePixelsTest
          java -cp build/open-forest/java com.reversepc.os.RegraphicsNative4KTest
          java -cp build/open-forest/java com.reversepc.os.RegraphicsFrameTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-open-forest-evidence
          path: build/open-forest
