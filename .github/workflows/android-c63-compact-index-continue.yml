    - name: Release the previously uploaded temporary stage
      if: steps.s6.outcome == 'success'
      run: rm -rf evidence/c63-5
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s6.outcome == 'failure'
      with:
        name: reverse-c63-stage-6-diagnostics
        path: |-
          evidence/c63-6/*.json
          evidence/c63-6/*.txt
          evidence/c63-6/*.log
          evidence/c63-6/native/*.json
          evidence/c63-6/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C63 stage 7 execute and verify the authentic Android machine
      id: s7
      if: success() && steps.s6.outcome == 'success' && steps.s6.outputs.visual != 'true'
      run: |
