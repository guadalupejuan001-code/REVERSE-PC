    - name: C63 stage 6 execute and verify the authentic Android machine
      id: s6
      if: success() && steps.s5.outcome == 'success' && steps.s5.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c63-5 evidence/c63-6 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c63-5/c42-progress.json 1000000000 2147483648 > evidence/c63-source/stage-6.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s6.outcome == 'success'
      with:
        name: reverse-c63-stage-6-verified-checkpoint
        path: |-
          evidence/c63-6/
          !evidence/c63-6/native/journal/**
          !evidence/c63-6/native/current.rvg
          !evidence/c63-6/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
