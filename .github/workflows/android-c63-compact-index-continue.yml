name: Android C63 authoritative compact page lookups
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c63-compact-index-continue.yml
    - CMakeLists.txt
    - src/integration/adaptive_override_map.hpp
    - tests/compact_index_lookaside_test.cpp
    - docs/ANDROID_C63_COMPACT_INDEX.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'perf/android-c63-compact-index' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c63-native build
        git diff --exit-code 2ba3d26f62589171c0f86628553c18ccc298b70f HEAD -- src scripts patches third_party tools ':(exclude)src/integration/adaptive_override_map.hpp'
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify original authority, pointer lifetimes, negative lookups, COW, cross-thread handoff, sanitizers and original
        decoder
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -DREVERSE_PC_COMPACT_INDEX_LOOKASIDE=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        for item in compact_index_lookaside numeric_byte_store adaptive_inverse_memory; do
         g++ $FLAGS -O2 tests/${item}_test.cpp -o build/c63-$item
         build/c63-$item > evidence/c63-native/$item.json
        done
        for item in test pci fp el0_cache; do
         file="tests/minimal_guest_${item}_test.cpp"
         if [ "$item" = test ]; then file=tests/minimal_guest_test.cpp; fi
         g++ $FLAGS -O2 "$file" build/softfloat/libreverse_softfloat.a -o build/c63-$item
         build/c63-$item > evidence/c63-native/$item.json
        done
        g++ $FLAGS -O1 -fsanitize=address,undefined -fno-sanitize-recover=all tests/numeric_byte_store_test.cpp -o build/c63-store-sanitized
        ASAN_OPTIONS=detect_leaks=0 build/c63-store-sanitized > evidence/c63-native/sanitizers.json
        g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c63-view
        build/c63-view build/c63-view-data > evidence/c63-native/original-decoder.json
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c63-native/native
        evidence/c63-native/native --pins > evidence/c63-native/native-pins.json
        sha256sum evidence/c63-native/native > evidence/c63-native/binary-sha256.txt
        g++ --version > evidence/c63-native/compiler.txt
        g++ $FLAGS -O1 -fsanitize=address,undefined -fno-sanitize-recover=all tests/compact_index_lookaside_test.cpp -o build/c63-index-sanitized
        ASAN_OPTIONS=detect_leaks=0 build/c63-index-sanitized > evidence/c63-native/index-sanitizers.json
        g++ -std=c++17 -O2 -pthread -Ideps/mundo-x/native/include -Isrc tests/compact_index_lookaside_test.cpp -o build/c63-index-default
        build/c63-index-default > evidence/c63-native/default-index.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c63-tested-native
        path: evidence/c63-native
        retention-days: 90
        compression-level: 1
  arm-hardware:
    if: github.event.pull_request.head.ref == 'perf/android-c63-compact-index' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Verify unchanged compact authority and lookup invalidation on physical AArch64
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        mkdir -p evidence/c63-arm build
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        FLAGS='-std=c++17 -O2 -pthread -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -DREVERSE_PC_COMPACT_INDEX_LOOKASIDE=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc'
        for item in compact_index_lookaside numeric_byte_store adaptive_inverse_memory; do
         g++ $FLAGS tests/${item}_test.cpp -o build/c63-$item
         build/c63-$item > evidence/c63-arm/$item.json
        done
        python3 - <<'PYCODE'
        import json
        r=json.load(open('evidence/c63-arm/numeric_byte_store.json'));assert r['checks']>=1293 and r['paired_operations']==262144 and r['original_authority_bytes_equal'] and r['encoding_and_decoder_changed'] is False
        r=json.load(open('evidence/c63-arm/compact_index_lookaside.json'));assert r['checks']>=51633 and r['lookaside_bytes_are_not_serialized']
        r=json.load(open('evidence/c63-arm/adaptive_inverse_memory.json'));assert r['legacy_snapshot_identical'] and r['quantum_bindings_preserved'] and r['rollback']
        PYCODE
        uname -a > evidence/c63-arm/machine.txt
        g++ --version > evidence/c63-arm/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c63-arm-hardware
        path: evidence/c63-arm
        retention-days: 90
        compression-level: 1
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c63-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c62-tested-native
        run-id: 41969603106
        github-token: ${{ github.token }}
        path: reference-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c62-stage-4-verified-checkpoint
        run-id: 41969072780
        github-token: ${{ github.token }}
        path: source-c62
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: original-decoder
    - name: Authenticate the clean C62 source, original reference CPU and unchanged decoder
      run: |
        set -euo pipefail
        mkdir -p evidence/c63-source
        cp original-decoder/frame native-build/frame
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum native-build/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = 'e9533fa76a9c9a7f2b4f2883a1f13c19112632adde5d8a86d057afc519e68346'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c62/output-contract.json')),p=preflight(c,'source-c62',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'86d0ff450060feb3bff7b9b193d6a886f036eff0');assert.equal(c.checkpoint_sha256,'fa9c4ea28f47f3ab2475cd36f3138791da8ae9a94a921f8b5e4a999fe079f5d2');assert.equal(p.report.guest.instructions,33708013374);writeFileSync('evidence/c63-source/preflight.json',JSON.stringify(c,null,2)+'\n');
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c63-source/media.json
        cp media-input/manifest.json evidence/c63-source/media-transport.json
        rm -rf media-input
        fallocate --dig-holes new-media/android-c27.raw
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
    - name: Independently execute 100 million Android instructions with the original C62 CPU
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        const r=await run(JSON.parse(readFileSync('source-c62/output-contract.json')),'source-c62','reference-build/native','new-media/android-c27.raw','evidence/c63-reference',{wallMs:180000,instructions:100000000,cycles:1,maxTransportBytes:2147483648});assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(r.result.checkpoint_sha256,'a16098e29e09ca04b17b0897930d2c7912ada5f0840860b252c0b962750de11f');writeFileSync('evidence/c63-source/reference.json',JSON.stringify(r,null,2)+'\n');
        NODE
    - name: C63 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c62 evidence/c63-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c62/c42-progress.json 100000000 2147483648 > evidence/c63-source/stage-1.json
        cmp evidence/c63-reference/current.rvg evidence/c63-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c63-1/current.json'));assert.equal(r.guest.instructions,33808013374);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'a16098e29e09ca04b17b0897930d2c7912ada5f0840860b252c0b962750de11f');
        NODE
        rm -rf evidence/c63-reference reference-build
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c63-stage-1-verified-checkpoint
        path: |-
          evidence/c63-1/
          !evidence/c63-1/native/journal/**
          !evidence/c63-1/native/current.rvg
          !evidence/c63-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c63-stage-1-diagnostics
        path: |-
          evidence/c63-1/*.json
          evidence/c63-1/*.txt
          evidence/c63-1/*.log
          evidence/c63-1/native/*.json
          evidence/c63-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C63 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c63-1 evidence/c63-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c63-1/c42-progress.json 1000000000 2147483648 > evidence/c63-source/stage-2.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c63-stage-2-verified-checkpoint
        path: |-
          evidence/c63-2/
          !evidence/c63-2/native/journal/**
          !evidence/c63-2/native/current.rvg
          !evidence/c63-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: rm -rf evidence/c63-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c63-stage-2-diagnostics
        path: |-
          evidence/c63-2/*.json
          evidence/c63-2/*.txt
          evidence/c63-2/*.log
          evidence/c63-2/native/*.json
          evidence/c63-2/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C63 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c63-2 evidence/c63-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c63-2/c42-progress.json 1000000000 2147483648 > evidence/c63-source/stage-3.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c63-stage-3-verified-checkpoint
        path: |-
          evidence/c63-3/
          !evidence/c63-3/native/journal/**
          !evidence/c63-3/native/current.rvg
          !evidence/c63-3/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: rm -rf evidence/c63-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c63-stage-3-diagnostics
        path: |-
          evidence/c63-3/*.json
          evidence/c63-3/*.txt
          evidence/c63-3/*.log
          evidence/c63-3/native/*.json
          evidence/c63-3/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C63 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c63-3 evidence/c63-4 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c63-3/c42-progress.json 1000000000 2147483648 > evidence/c63-source/stage-4.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s4.outcome == 'success'
      with:
        name: reverse-c63-stage-4-verified-checkpoint
        path: |-
          evidence/c63-4/
          !evidence/c63-4/native/journal/**
          !evidence/c63-4/native/current.rvg
          !evidence/c63-4/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s4.outcome == 'success'
      run: rm -rf evidence/c63-3
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s4.outcome == 'failure'
      with:
        name: reverse-c63-stage-4-diagnostics
        path: |-
          evidence/c63-4/*.json
          evidence/c63-4/*.txt
          evidence/c63-4/*.log
          evidence/c63-4/native/*.json
          evidence/c63-4/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C63 stage 5 execute and verify the authentic Android machine
      id: s5
      if: success() && steps.s4.outcome == 'success' && steps.s4.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c63-4 evidence/c63-5 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c63-4/c42-progress.json 1000000000 2147483648 > evidence/c63-source/stage-5.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s5.outcome == 'success'
      with:
        name: reverse-c63-stage-5-verified-checkpoint
        path: |-
          evidence/c63-5/
          !evidence/c63-5/native/journal/**
          !evidence/c63-5/native/current.rvg
          !evidence/c63-5/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s5.outcome == 'success'
      run: rm -rf evidence/c63-4
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s5.outcome == 'failure'
      with:
        name: reverse-c63-stage-5-diagnostics
        path: |-
