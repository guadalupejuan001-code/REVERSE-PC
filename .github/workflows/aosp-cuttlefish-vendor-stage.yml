name: REVERSE original XI Ether with genuine Android Cuttlefish vendor+generic initrd
on:
  pull_request:
    paths:
      - 'tools/aosp_cuttlefish_stage.mjs'
      - 'tests/aosp_cuttlefish_stage.test.mjs'
      - '.github/workflows/aosp-cuttlefish-vendor-stage.yml'
      - 'docs/AOSP_VENDOR_INITRD_GATE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-build-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: New and historical boot preflight regression suites
        run: |
          set -euo pipefail
          mkdir -p build evidence
          node --test tests/aosp_cuttlefish_stage.test.mjs | tee evidence/staging-tests.tap
          node --test tests/aosp_boot_preflight.test.mjs | tee evidence/boot-preflight-tests.tap
          node --test tests/aosp_cuttlefish_zip_probe.test.mjs | tee evidence/zip-tests.tap
      - name: Extract only same-build official ARM64 boot partitions via bounded ZIP ranges
        run: |
          set -euo pipefail
          node tools/aosp_cuttlefish_zip_probe.mjs extract --out-dir build/original \
            > evidence/source-manifest.json
          echo 'b6f1c12a695e99c761f6a23713f4601dba06e690e77acfb5d1906b0d32f5c967  build/original/boot.img' | sha256sum -c -
          echo 'c4f820039ef9c2d1957461f33916f4d24b94d7b866e03ff91dbd7e9f72793d29  build/original/init_boot.img' | sha256sum -c -
          echo '6f88b6c7164814bef200100763f9880733fe99aed17ee8e937f46b185b24fa8c  build/original/vendor_boot.img' | sha256sum -c -
          jq -e '.status=="official_boot_partitions_verified" and .build_id=="16644040"' evidence/source-manifest.json
      - name: Stage Cuttlefish PLATFORM vendor+generic LZ4 in exact order with Linux bootconfig trailer
        run: |
          set -euo pipefail
          node tools/aosp_cuttlefish_stage.mjs \
            --boot build/original/boot.img \
            --vendor-boot build/original/vendor_boot.img \
            --init-boot build/original/init_boot.img \
            --out-dir build/staged > evidence/staged-manifest.json
          jq -e '.status=="official_vendor_generic_initrd_staged_not_booted" and
            .source_boot_sha256=="b6f1c12a695e99c761f6a23713f4601dba06e690e77acfb5d1906b0d32f5c967" and
            .source_vendor_boot_sha256=="6f88b6c7164814bef200100763f9880733fe99aed17ee8e937f46b185b24fa8c" and
            .source_init_boot_sha256=="c4f820039ef9c2d1957461f33916f4d24b94d7b866e03ff91dbd7e9f72793d29" and
            (.vendor_ramdisk.fragments|length)==1' evidence/staged-manifest.json
          jq -e '.combined_initrd.bytes<=67108864 and
            .bootconfig.raw_bytes==117 and .reverse_bootconfig_option_present==false and
            .android_init_executed==false and .adb==false' evidence/staged-manifest.json
          echo 'f722bdd809bfd3485917a564b053b8a6d4938408734091f420c3297a8e3b20c8  build/staged/kernel.bin' | sha256sum -c -
          sha256sum build/staged/combined_initrd.bin > evidence/combined-initrd.sha256
          # Independent GNU cmp validates both raw source slices without
          # trusting Node's own order manifest.
          node tools/aosp_boot_preflight.mjs \
            --boot build/original/boot.img --vendor-boot build/original/vendor_boot.img \
            --init-boot build/original/init_boot.img --extract-dir build/raw-parts \
            > evidence/original-segments.json
          vendor_bytes=$(stat -c '%s' build/raw-parts/vendor_ramdisk.bin)
          generic_bytes=$(stat -c '%s' build/raw-parts/generic_ramdisk.bin)
          cmp -n "$vendor_bytes" build/raw-parts/vendor_ramdisk.bin build/staged/combined_initrd.bin
          cmp -n "$generic_bytes" -i "0:$vendor_bytes" \
            build/raw-parts/generic_ramdisk.bin build/staged/combined_initrd.bin
          tail -c 12 build/staged/combined_initrd.bin | cmp - <(printf '#BOOTCONFIG\n')
          node --input-type=module <<'NODE' > evidence/independent-bootconfig-footer.json
          import {readFileSync} from 'node:fs';
          const src=readFileSync('build/raw-parts/bootconfig.bin');
          const b=readFileSync('build/staged/combined_initrd.bin');
          const off=b.length-20,size=b.readUInt32LE(off),sum=b.readUInt32LE(off+4);
          const config=b.subarray(off-size,off);
          const independent=Array.from(config).reduce((s,x)=>(s+x)>>>0,0);
          if(sum!==independent||!config.subarray(0,src.length).equals(src)||
            b.subarray(off+8).toString('ascii')!=='#BOOTCONFIG\n')
            throw Error('Independent Linux bootconfig footer check failed');
          console.log(JSON.stringify({checksum:sum,size,pad:size-src.length,
            exact_vendor_config:true,footer_magic:'#BOOTCONFIG\\n',
            android_boot:false},null,2));
          NODE
      - name: Read-only vendor first-stage modules/fstab inventory
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > evidence/vendor-cpio-inventory.json
          import {readFileSync} from 'node:fs';
          import {decompressLegacyLz4,parseNewcCpio} from './tools/aosp_ramdisk_preflight.mjs';
          const raw=readFileSync('build/raw-parts/vendor_ramdisk.bin');
          let r={compressed_bytes:raw.length,
            compressed_sha256:'4e1e07579aa388f7fc61137b3455a5a66e521636ec60e9622d96cff39b839000'};
          try{
            const cpio=decompressLegacyLz4(raw);
            r.decompressed_bytes=cpio.length;
            const entries=parseNewcCpio(cpio);
            r.files=entries.length;
            r.module_entries=entries.filter(e=>/\.ko$|modules\.(load|dep|alias)/.test(e.path))
              .slice(0,80).map(e=>({path:e.path,size:e.size}));
            r.fstab_entries=entries.filter(e=>/fstab/.test(e.path))
              .slice(0,20).map(e=>({path:e.path,size:e.size}));
            r.dev_entries=entries.filter(e=>/virtio|vda|vdb|vdc|dm-|binder/.test(e.path))
              .slice(0,25).map(e=>({path:e.path,size:e.size}));
          }catch(e){r.vendor_unpack_issue=String(e.message).slice(0,240);}
          r.android_init_executed=false;
          console.log(JSON.stringify(r,null,2));
          NODE
      - name: Build original XI/Ether guest, unchanged pinned Mundo-X
        run: |
          set -euo pipefail
          test "$(git -C deps/mundo-x rev-parse HEAD)" = e2778d962af22f6f1a0794058dd4685fc2573966
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 scripts/build-softfloat.py
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 \
            -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc \
            tools/guest_linux_probe.cpp build/softfloat/libreverse_softfloat.a \
            -o build/linux-probe
      - name: Load genuine vendor+generic compressed initrd in original guest and demand exact checkpoint replay
        run: |
          set -euo pipefail
          timeout 150 build/linux-probe build/staged/kernel.bin 1 evidence/first.rvg \
            build/staged/combined_initrd.bin > evidence/first.json
          timeout 150 build/linux-probe build/staged/kernel.bin 30000 evidence/direct.rvg \
            build/staged/combined_initrd.bin > evidence/direct.json
          timeout 150 build/linux-probe evidence/first.rvg 29999 evidence/sliced.rvg \
            > evidence/sliced.json
          cmp evidence/direct.rvg evidence/sliced.rvg
          jq -e '.initial_instructions==0 and .guest.instructions>=1 and
            .guest.immutable_image_bytes>63000000 and
            .adaptive_classical_storage and .guest.max_delta_overrides==0 and
            .android_boot==false and .linux_userspace_init_observed==false' evidence/direct.json
          cp evidence/direct.rvg evidence/current.rvg
          sha256sum evidence/current.rvg > evidence/current.sha256
      - name: Continue bounded official Android kernel with vendor modules staged, record first exact stop
        run: |
          set -euo pipefail
          for i in $(seq 1 4); do
            timeout 180 build/linux-probe evidence/current.rvg 50000 evidence/next.rvg \
              > "evidence/step-$i.json"
            jq -e '.guest.instructions>=.initial_instructions and
              .adaptive_classical_storage and .android_boot==false' "evidence/step-$i.json"
            reason=$(jq -r '.stop_reason' "evidence/step-$i.json")
            mv evidence/next.rvg evidence/current.rvg
            test "$reason" = instruction_budget || break
          done
          last=$(ls evidence/step-*.json|sort -V|tail -1)
          jq '{initial_instructions,guest:{pc:.guest.pc,instructions:.guest.instructions,
            exception_level:.guest.exception_level,exceptions:.guest.exceptions,
            immutable_image_bytes:.guest.immutable_image_bytes,delta_overrides:.guest.delta_overrides},
            stop_reason,next_instruction,console,android_boot,linux_userspace_init_observed}' \
            "$last" > evidence/actual-stop.json
          sha256sum evidence/current.rvg > evidence/final-checkpoint.sha256
          cat evidence/actual-stop.json
          {
            echo '## Cuttlefish original compressed vendor+generic boot payload'
            echo ''
            jq '{vendor_ramdisk,bootconfig,combined_initrd,reverse_bootconfig_option_present,pending}' \
              evidence/staged-manifest.json
            echo ''
            echo 'No Android /init, Binder, ADB or game claims without direct guest evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-verified-aosp-platform-initrd-gate
          path: evidence/
          retention-days: 7
