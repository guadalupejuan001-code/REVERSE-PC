name: Android C56 scalar/vector FABD and authentic boot continuation
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c56-fabd-continue.yml
    - src/minimal_guest_simd.inc
    - tests/minimal_guest_fabd_test.cpp
    - docs/ANDROID_C56_FABD_CONTINUATION.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c56-fabd' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c56-native build
        git diff --exit-code 13c805fce4735481cbfd95e810c6730c625f6306 HEAD -- src scripts patches third_party tools ':(exclude)src/minimal_guest_simd.inc'
        python3 - <<'PYCODE'
        import pathlib,subprocess
        p='src/minimal_guest_simd.inc';old=subprocess.check_output(['git','show','13c805fce4735481cbfd95e810c6730c625f6306:'+p]).decode();new=pathlib.Path(p).read_text();a=new.index('  const bool fabd_scalar=');b=new.index('  const auto fixed_gpr=',a);assert new[:a]+new[b:]==old
        PYCODE
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify all FABD forms, rounding/NaNs/flags, UBSan and existing arithmetic/system/codec behavior
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        for item in fabd gpr_fixed scalar_compare fpint_fixed fpint_vector intfp_vector fcvtzs_scalar fp fmla_element system; do
         g++ $FLAGS -O2 tests/minimal_guest_${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c56-$item
         build/c56-$item > evidence/c56-native/$item.json
        done
        g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/minimal_guest_fabd_test.cpp build/softfloat/libreverse_softfloat.a -o build/c56-fpint-ubsan
        build/c56-fpint-ubsan > evidence/c56-native/ubsan.json
        g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c56-view
        build/c56-view build/c56-view-data > evidence/c56-native/original-decoder.json
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c56-native/native
        evidence/c56-native/native --pins > evidence/c56-native/native-pins.json
        sha256sum evidence/c56-native/native > evidence/c56-native/binary-sha256.txt
        g++ --version > evidence/c56-native/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c56-tested-native
        path: evidence/c56-native
        retention-days: 90
  arm-hardware:
    if: github.event.pull_request.head.ref == 'fix/android-c56-fabd' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Compare actual AArch64 encodings, IEEE results and cumulative flags
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        mkdir -p evidence/c56-arm
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
        g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tests/minimal_guest_fabd_test.cpp build/softfloat/libreverse_softfloat.a -o build/c56-arm
        build/c56-arm > evidence/c56-arm/hardware.json
        python3 - <<'PY'
        import json
        r=json.load(open('evidence/c56-arm/hardware.json'))
        assert r['native_hardware_cases']>100000
        PY
        uname -a > evidence/c56-arm/machine.txt
        g++ --version > evidence/c56-arm/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c56-arm-hardware
        path: evidence/c56-arm
        retention-days: 90
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c56-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c55-tested-native
        run-id: 41946031906
        github-token: ${{ github.token }}
        path: reference-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c55-stage-3-verified-checkpoint
        run-id: 41946031906
        github-token: ${{ github.token }}
        path: source-c55
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: original-decoder
    - name: Authenticate the clean C55 source, reference CPU and original strict decoder
      run: |
        set -euo pipefail
        mkdir -p evidence/c56-source
        cp original-decoder/frame native-build/frame
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum native-build/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = '8cc3e61472b67b69e8518771fbf756def6b71f34aef85c55f6ac8e8a1628226c'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c55/output-contract.json')),p=preflight(c,'source-c55',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'13c805fce4735481cbfd95e810c6730c625f6306');assert.equal(c.checkpoint_sha256,'d0b239d74cbff5952484de8cecb7e9f4c67c302b76f232c2fe59450471d889a7');assert.equal(p.report.guest.instructions,28503274546);writeFileSync('evidence/c56-source/preflight.json',JSON.stringify(c,null,2)+'\n');
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c56-source/media.json
        cp media-input/manifest.json evidence/c56-source/media-transport.json
        rm -rf media-input
        fallocate --dig-holes new-media/android-c27.raw
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
    - name: Independently replay the original C55 CPU to the clean pre-FABD boundary
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        const r=await run(JSON.parse(readFileSync('source-c55/output-contract.json')),'source-c55','reference-build/native','new-media/android-c27.raw','evidence/c56-reference',{wallMs:180000,instructions:16953089,cycles:1,maxTransportBytes:2147483648});assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(r.result.checkpoint_sha256,'44523662be0303d569781727191e170e4f83f03d83496a6417a16c3e678ea665');writeFileSync('evidence/c56-source/reference.json',JSON.stringify(r,null,2)+'\n');
        NODE
    - name: C56 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c55 evidence/c56-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c55/c42-progress.json 16953089 2147483648 > evidence/c56-source/stage-1.json
        cmp evidence/c56-reference/current.rvg evidence/c56-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c56-1/current.json'));assert.equal(r.guest.instructions,28520227635);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'44523662be0303d569781727191e170e4f83f03d83496a6417a16c3e678ea665');
        NODE
        rm -rf evidence/c56-reference reference-build
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c56-stage-1-verified-checkpoint
        path: |-
          evidence/c56-1/
          !evidence/c56-1/native/journal/**
          !evidence/c56-1/native/current.rvg
          !evidence/c56-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c56-stage-1-diagnostics
        path: |-
          evidence/c56-1/*.json
          evidence/c56-1/*.txt
          evidence/c56-1/*.log
          evidence/c56-1/native/*.json
          evidence/c56-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C56 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c56-1 evidence/c56-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c56-1/c42-progress.json 1 2147483648 > evidence/c56-source/stage-2.json
        python3 - <<'PYCODE'
        import json,struct,mmap,pathlib
        before=pathlib.Path('evidence/c56-1/current.rvg');after=pathlib.Path('evidence/c56-2/current.rvg');r=json.load(open('evidence/c56-2/current.json'))
        assert r['guest']['instructions']==28520227636 and r['guest']['pc']=='0x5cb422aeb0' and not r['error']
        with before.open('rb') as fa,after.open('rb') as fb:
         with mmap.mmap(fa.fileno(),0,access=mmap.ACCESS_READ) as aa,mmap.mmap(fb.fileno(),0,access=mmap.ACCESS_READ) as bb:
          assert len(aa)==len(bb);u=lambda data,at:struct.unpack_from('<Q',data,at)[0]
          assert aa[:8]==bb[:8]==b'RVG3\r\n\x1a\n'
          assert u(aa,24)==0x5cb422aeac and u(bb,24)==0x5cb422aeb0
          assert u(aa,40)==28520227635 and u(bb,40)==28520227636
          sizes=[u(aa,o) for o in (320,328,336,344,352)];assert sizes==[u(bb,o) for o in (320,328,336,344,352)]
          fp_at=len(aa)-8-sizes[4];mask=struct.unpack_from('<I',aa,fp_at+16)[0];assert mask&3==3
          assert u(aa,fp_at+20)==0x41c00000 and u(bb,fp_at+20)==0x40c00000
          assert u(aa,fp_at+36)==u(bb,fp_at+36)==0x41f00000
          counter_at=fp_at-8;assert u(aa,counter_at)==54 and u(bb,counter_at)==55
          excluded=[(24,32),(40,48),(fp_at+20,fp_at+24),(counter_at,counter_at+8),(len(aa)-8,len(aa))]
          at=0
          for start,end in sorted(excluded):
           for pos in range(at,start,1048576):assert aa[pos:min(pos+1048576,start)]==bb[pos:min(pos+1048576,start)],str(pos)
           at=end
          assert at==len(aa)
        proof={'opcode':'0x7ea1d400','s0_before':24,'s1_before':30,'s0_after':6,'instructions':28520227636,'pc':'0x5cb422aeb0','counter_subtick_before':54,'counter_subtick_after':55,'all_other_bytes_unchanged_except_final_checksum':True,'checkpoint_sha256':r['checkpoint_sha256']}
        pathlib.Path('evidence/c56-source/fabd-crossing.json').write_text(json.dumps(proof,indent=2)+'\n')
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c56-stage-2-verified-checkpoint
        path: |-
          evidence/c56-2/
          !evidence/c56-2/native/journal/**
          !evidence/c56-2/native/current.rvg
          !evidence/c56-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: rm -rf evidence/c56-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c56-stage-2-diagnostics
        path: |-
          evidence/c56-2/*.json
          evidence/c56-2/*.txt
          evidence/c56-2/*.log
          evidence/c56-2/native/*.json
          evidence/c56-2/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C56 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c56-2 evidence/c56-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c56-2/c42-progress.json 1000000 2147483648 > evidence/c56-source/stage-3.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c56-stage-3-verified-checkpoint
        path: |-
          evidence/c56-3/
          !evidence/c56-3/native/journal/**
          !evidence/c56-3/native/current.rvg
          !evidence/c56-3/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: rm -rf evidence/c56-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c56-stage-3-diagnostics
        path: |-
          evidence/c56-3/*.json
          evidence/c56-3/*.txt
          evidence/c56-3/*.log
          evidence/c56-3/native/*.json
          evidence/c56-3/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C56 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c56-3 evidence/c56-4 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c56-3/c42-progress.json 1000000000 2147483648 > evidence/c56-source/stage-4.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s4.outcome == 'success'
      with:
        name: reverse-c56-stage-4-verified-checkpoint
        path: |-
          evidence/c56-4/
          !evidence/c56-4/native/journal/**
          !evidence/c56-4/native/current.rvg
          !evidence/c56-4/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s4.outcome == 'success'
      run: rm -rf evidence/c56-3
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s4.outcome == 'failure'
      with:
        name: reverse-c56-stage-4-diagnostics
        path: |-
          evidence/c56-4/*.json
          evidence/c56-4/*.txt
          evidence/c56-4/*.log
          evidence/c56-4/native/*.json
          evidence/c56-4/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C56 stage 5 execute and verify the authentic Android machine
      id: s5
      if: success() && steps.s4.outcome == 'success' && steps.s4.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c56-4 evidence/c56-5 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c56-4/c42-progress.json 1000000000 2147483648 > evidence/c56-source/stage-5.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s5.outcome == 'success'
      with:
        name: reverse-c56-stage-5-verified-checkpoint
        path: |-
          evidence/c56-5/
          !evidence/c56-5/native/journal/**
          !evidence/c56-5/native/current.rvg
          !evidence/c56-5/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s5.outcome == 'success'
      run: rm -rf evidence/c56-4
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s5.outcome == 'failure'
      with:
        name: reverse-c56-stage-5-diagnostics
        path: |-
          evidence/c56-5/*.json
          evidence/c56-5/*.txt
          evidence/c56-5/*.log
          evidence/c56-5/native/*.json
          evidence/c56-5/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C56 stage 6 execute and verify the authentic Android machine
      id: s6
      if: success() && steps.s5.outcome == 'success' && steps.s5.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c56-5 evidence/c56-6 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c56-5/c42-progress.json 1000000000 2147483648 > evidence/c56-source/stage-6.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s6.outcome == 'success'
      with:
        name: reverse-c56-stage-6-verified-checkpoint
        path: |-
          evidence/c56-6/
