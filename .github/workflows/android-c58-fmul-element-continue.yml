name: Android C58 indexed FMUL and authentic boot continuation
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c58-fmul-element-continue.yml
    - src/minimal_guest_simd.inc
    - tests/minimal_guest_fmul_element_test.cpp
    - docs/ANDROID_C58_FMUL_ELEMENT_CONTINUATION.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c58-fmul-element' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c58-native build
        git diff --exit-code db470ebe69cde9eb49e4b3fae453845594b6770c HEAD -- src scripts patches third_party tools ':(exclude)src/minimal_guest_simd.inc'
        python3 - <<'PYCODE'
        import pathlib,subprocess
        p='src/minimal_guest_simd.inc';old=subprocess.check_output(['git','show','db470ebe69cde9eb49e4b3fae453845594b6770c:'+p]).decode();new=pathlib.Path(p).read_text();a=new.index('  const bool indexed_scalar_mul=');b=new.index('  const auto fp_zero=',a);assert new[:a]+new[b:]==old
        PYCODE
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify indexed FMUL forms, every selector, aliases, existing FMA neighbors, UBSan and codec behavior
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        for item in fmul_element float_zero fabd gpr_fixed scalar_compare fpint_fixed fpint_vector intfp_vector fcvtzs_scalar fp fmla_element system; do
         g++ $FLAGS -O2 tests/minimal_guest_${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c58-$item
         build/c58-$item > evidence/c58-native/$item.json
        done
        g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/minimal_guest_fmul_element_test.cpp build/softfloat/libreverse_softfloat.a -o build/c58-fpint-ubsan
        build/c58-fpint-ubsan > evidence/c58-native/ubsan.json
        g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c58-view
        build/c58-view build/c58-view-data > evidence/c58-native/original-decoder.json
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c58-native/native
        evidence/c58-native/native --pins > evidence/c58-native/native-pins.json
        sha256sum evidence/c58-native/native > evidence/c58-native/binary-sha256.txt
        g++ --version > evidence/c58-native/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c58-tested-native
        path: evidence/c58-native
        retention-days: 90
        compression-level: 1
  arm-hardware:
    if: github.event.pull_request.head.ref == 'fix/android-c58-fmul-element' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Compare actual AArch64 encodings, IEEE results and cumulative flags
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        mkdir -p evidence/c58-arm
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
        g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tests/minimal_guest_fmul_element_test.cpp build/softfloat/libreverse_softfloat.a -o build/c58-arm
        build/c58-arm > evidence/c58-arm/hardware.json
        python3 - <<'PY'
        import json
        r=json.load(open('evidence/c58-arm/hardware.json'))
        assert r['native_hardware_cases']>100000
        PY
        uname -a > evidence/c58-arm/machine.txt
        g++ --version > evidence/c58-arm/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c58-arm-hardware
        path: evidence/c58-arm
        retention-days: 90
        compression-level: 1
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c58-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c57-tested-native
        run-id: 41951662515
        github-token: ${{ github.token }}
        path: reference-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c57-stage-2-verified-checkpoint
        run-id: 41951662515
        github-token: ${{ github.token }}
        path: source-c57
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: original-decoder
    - name: Authenticate the clean C57 source, reference CPU and original strict decoder
      run: |
        set -euo pipefail
        mkdir -p evidence/c58-source
        cp original-decoder/frame native-build/frame
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum native-build/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = 'c0bb4cc672b5548909b9f2062a272e3988b2a94d0dc83462f1a565615d462f7b'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c57/output-contract.json')),p=preflight(c,'source-c57',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'db470ebe69cde9eb49e4b3fae453845594b6770c');assert.equal(c.checkpoint_sha256,'ba19cab999228e92b12b2c180a78fe292969fe8dfaaf7f8e55c4f369e427bf57');assert.equal(p.report.guest.instructions,28563117491);writeFileSync('evidence/c58-source/preflight.json',JSON.stringify(c,null,2)+'\n');
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c58-source/media.json
        cp media-input/manifest.json evidence/c58-source/media-transport.json
        rm -rf media-input
        fallocate --dig-holes new-media/android-c27.raw
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
    - name: Independently replay the original C57 CPU to the clean pre-FMUL boundary
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        const r=await run(JSON.parse(readFileSync('source-c57/output-contract.json')),'source-c57','reference-build/native','new-media/android-c27.raw','evidence/c58-reference',{wallMs:180000,instructions:22007,cycles:1,maxTransportBytes:2147483648});assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(r.result.checkpoint_sha256,'d41fbb31f9c1fae19c75bae7a411e53c4a41ca3568d3991d1015fda4fb541bc2');writeFileSync('evidence/c58-source/reference.json',JSON.stringify(r,null,2)+'\n');
        NODE
    - name: C58 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c57 evidence/c58-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c57/c42-progress.json 22007 2147483648 > evidence/c58-source/stage-1.json
        cmp evidence/c58-reference/current.rvg evidence/c58-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c58-1/current.json'));assert.equal(r.guest.instructions,28563139498);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'d41fbb31f9c1fae19c75bae7a411e53c4a41ca3568d3991d1015fda4fb541bc2');
        NODE
        rm -rf evidence/c58-reference reference-build
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c58-stage-1-verified-checkpoint
        path: |-
          evidence/c58-1/
          !evidence/c58-1/native/journal/**
          !evidence/c58-1/native/current.rvg
          !evidence/c58-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c58-stage-1-diagnostics
        path: |-
          evidence/c58-1/*.json
          evidence/c58-1/*.txt
          evidence/c58-1/*.log
          evidence/c58-1/native/*.json
          evidence/c58-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C58 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c58-1 evidence/c58-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c58-1/c42-progress.json 1 2147483648 > evidence/c58-source/stage-2.json
        python3 - <<'PYCODE'
        import json,struct,mmap,pathlib
        before=pathlib.Path('evidence/c58-1/current.rvg');after=pathlib.Path('evidence/c58-2/current.rvg');r=json.load(open('evidence/c58-2/current.json'))
        assert r['guest']['instructions']==28563139499 and r['guest']['pc']=='0x725e86cebc' and not r['error']
        with before.open('rb') as fa,after.open('rb') as fb:
         with mmap.mmap(fa.fileno(),0,access=mmap.ACCESS_READ) as aa,mmap.mmap(fb.fileno(),0,access=mmap.ACCESS_READ) as bb:
          assert len(aa)==len(bb);u=lambda data,at:struct.unpack_from('<Q',data,at)[0]
          assert aa[:8]==bb[:8]==b'RVG3\r\n\x1a\n'
          assert u(aa,24)==0x725e86ceb8 and u(bb,24)==0x725e86cebc
          assert u(aa,40)==28563139498 and u(bb,40)==28563139499
          sizes=[u(aa,o) for o in (320,328,336,344,352)];assert sizes==[u(bb,o) for o in (320,328,336,344,352)]
          fp_at=len(aa)-8-sizes[4];mask=struct.unpack_from('<I',aa,fp_at+16)[0];assert not mask&2 and mask&32
          src=fp_at+20+(mask&31).bit_count()*16;assert u(aa,src)==0x3f800000 and u(aa,src+8)==0
          counter_at=fp_at-8;assert u(aa,counter_at)==45 and u(bb,counter_at)==46
          excluded=[(24,32),(40,48),(counter_at,counter_at+8),(len(aa)-8,len(aa))]
          at=0
          for start,end in sorted(excluded):
           for pos in range(at,start,1048576):assert aa[pos:min(pos+1048576,start)]==bb[pos:min(pos+1048576,start)],str(pos)
           at=end
          assert at==len(aa)
        proof={'opcode':'0x0f8190a1','source_v5_2s':[1,0],'selected_v1_s0':0,'destination_v1':[0,0],'instructions':28563139499,'pc':'0x725e86cebc','counter_subtick_before':45,'counter_subtick_after':46,'all_other_bytes_unchanged_except_final_checksum':True,'checkpoint_sha256':r['checkpoint_sha256']}
        pathlib.Path('evidence/c58-source/fmul-element-crossing.json').write_text(json.dumps(proof,indent=2)+'\n')
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c58-stage-2-verified-checkpoint
        path: |-
          evidence/c58-2/
          !evidence/c58-2/native/journal/**
          !evidence/c58-2/native/current.rvg
          !evidence/c58-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: rm -rf evidence/c58-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c58-stage-2-diagnostics
        path: |-
          evidence/c58-2/*.json
          evidence/c58-2/*.txt
          evidence/c58-2/*.log
          evidence/c58-2/native/*.json
          evidence/c58-2/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C58 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c58-2 evidence/c58-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c58-2/c42-progress.json 1000000 2147483648 > evidence/c58-source/stage-3.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c58-stage-3-verified-checkpoint
        path: |-
          evidence/c58-3/
          !evidence/c58-3/native/journal/**
          !evidence/c58-3/native/current.rvg
          !evidence/c58-3/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: rm -rf evidence/c58-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c58-stage-3-diagnostics
        path: |-
          evidence/c58-3/*.json
          evidence/c58-3/*.txt
          evidence/c58-3/*.log
          evidence/c58-3/native/*.json
          evidence/c58-3/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C58 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c58-3 evidence/c58-4 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c58-3/c42-progress.json 1000000000 2147483648 > evidence/c58-source/stage-4.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s4.outcome == 'success'
      with:
        name: reverse-c58-stage-4-verified-checkpoint
        path: |-
          evidence/c58-4/
          !evidence/c58-4/native/journal/**
          !evidence/c58-4/native/current.rvg
          !evidence/c58-4/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s4.outcome == 'success'
      run: rm -rf evidence/c58-3
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s4.outcome == 'failure'
      with:
        name: reverse-c58-stage-4-diagnostics
        path: |-
          evidence/c58-4/*.json
          evidence/c58-4/*.txt
          evidence/c58-4/*.log
          evidence/c58-4/native/*.json
          evidence/c58-4/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C58 stage 5 execute and verify the authentic Android machine
      id: s5
      if: success() && steps.s4.outcome == 'success' && steps.s4.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c58-4 evidence/c58-5 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c58-4/c42-progress.json 1000000000 2147483648 > evidence/c58-source/stage-5.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s5.outcome == 'success'
      with:
        name: reverse-c58-stage-5-verified-checkpoint
        path: |-
          evidence/c58-5/
          !evidence/c58-5/native/journal/**
          !evidence/c58-5/native/current.rvg
          !evidence/c58-5/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s5.outcome == 'success'
      run: rm -rf evidence/c58-4
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s5.outcome == 'failure'
      with:
        name: reverse-c58-stage-5-diagnostics
        path: |-
          evidence/c58-5/*.json
          evidence/c58-5/*.txt
          evidence/c58-5/*.log
          evidence/c58-5/native/*.json
          evidence/c58-5/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C58 stage 6 execute and verify the authentic Android machine
      id: s6
      if: success() && steps.s5.outcome == 'success' && steps.s5.outputs.visual != 'true'
      run: |
        set -euo pipefail
