name: Android C13 original AVB metadata inspection
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/android-c13-avb-inspect.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: android-c13-avb-inspect
  cancel-in-progress: false
jobs:
  inspect-original-disk:
    if: github.event.pull_request.head.ref == 'fix/android-c13-avb-handoff-20261030' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Read original GPT and AVB headers, preserve exact images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/c13-inspect
          DISK=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$DISK"
          export DISK
          node --input-type=module <<'NODE'
          import {open,writeFile,mkdir} from 'node:fs/promises';
          import {createReadStream} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {crc32} from 'node:zlib';
          const need=(v,m)=>{if(!v)throw Error(m)}, sha=b=>createHash('sha256').update(b).digest('hex');
          const file=await open(process.env.DISK,'r'), stat=await file.stat();
          need(stat.size===8738832384,'Wrong original disk extent');
          const hash=createHash('sha256');for await(const b of createReadStream(process.env.DISK))hash.update(b);
          const diskHash=hash.digest('hex');need(diskHash==='28303ac7b2832cbde4e1c56551bf81816b55bc946cc75a444f2605316ed97e1c','Wrong original disk digest');
          async function read(at,n){need(Number.isSafeInteger(at)&&Number.isSafeInteger(n)&&at>=0&&n>=0&&at+n<=stat.size,'Read out of bounds');const b=Buffer.alloc(n);need((await file.read(b,0,n,at)).bytesRead===n,'Short read');return b;}
          const h=await read(512,512);need(h.toString('ascii',0,8)==='EFI PART','Missing GPT');const hn=h.readUInt32LE(12),hc=h.readUInt32LE(16);need(hn>=92&&hn<=512,'GPT header extent');h.writeUInt32LE(0,16);need(crc32(h.subarray(0,hn))===hc,'GPT header CRC');
          const entries=Number(h.readBigUInt64LE(72))*512,count=h.readUInt32LE(80),stride=h.readUInt32LE(84);need(count<=128&&stride===128,'Unexpected GPT entries');
          const table=await read(entries,count*stride);need(crc32(table)===h.readUInt32LE(88),'GPT array CRC');
          const partitions=[],images=[];
          for(let i=0;i<count;i++){const e=table.subarray(i*stride,(i+1)*stride);if(e.subarray(0,16).every(x=>x===0))continue;const name=e.subarray(56,128).toString('utf16le').split('\0')[0],first=Number(e.readBigUInt64LE(32)),last=Number(e.readBigUInt64LE(40));need(/^[a-z][a-z0-9_]{0,35}$/.test(name)&&last>=first,'Bad partition');const p={name,first_lba:first,last_lba:last,bytes:(last-first+1)*512};partitions.push(p);
            if(!name.startsWith('vbmeta'))continue;
            need(p.bytes<=1024*1024,'Unexpected vbmeta partition extent');const b=await read(first*512,p.bytes);need(b.toString('ascii',0,4)==='AVB0','Missing AVB header');const auth=Number(b.readBigUInt64BE(12)),aux=Number(b.readBigUInt64BE(20)),size=256+auth+aux;need(size<=b.length&&size>=256,'AVB extent');const path='evidence/c13-inspect/'+name+'.img';await writeFile(path,b);images.push({name,partition_bytes:b.length,vbmeta_bytes:size,algorithm_type:b.readUInt32BE(28),flags:b.readUInt32BE(120),rollback_index:b.readBigUInt64BE(112).toString(),rollback_index_location:b.readUInt32BE(124),partition_sha256:sha(b),vbmeta_sha256:sha(b.subarray(0,size)),release_string:b.subarray(128,176).toString().split('\0')[0]});
          }
          await file.close();const result={schema:'reverse-c13-original-vbmeta-inspection-v1',disk_sha256:diskHash,disk_bytes:stat.size,partitions,images,guest_execution_performed:false,android_display_verified:false};await writeFile('evidence/c13-inspect/inspection.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2));
          NODE
          find disk-input -name '*.json' -size -2M -exec cp --backup=numbered {} evidence/c13-inspect/ \;
          git rev-parse HEAD > evidence/c13-inspect/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c13-original-avb-metadata
          path: evidence/c13-inspect/
          if-no-files-found: error
          retention-days: 14
