name: XGamingLab C06 Balanced

on:
  push:
    branches:
      - feature/xgaminglab-c06-balanced-20261111
    paths:
      - '.xgaminglab-c06/**'
      - '.github/workflows/xgaminglab-c06.yml'
  pull_request:
    paths:
      - '.xgaminglab-c06/**'
      - '.github/workflows/xgaminglab-c06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"

      - name: Reconstruct XGamingLab C05
        shell: bash
        run: |
          set -euo pipefail
          cat .xgaminglab-source/part* > "$RUNNER_TEMP/xgaminglab-3.0.0.tar.gz"
          mkdir -p "$RUNNER_TEMP/xgaminglab"
          tar -xzf "$RUNNER_TEMP/xgaminglab-3.0.0.tar.gz" -C "$RUNNER_TEMP/xgaminglab"
          cat .xgaminglab-overlay/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/31.patch"
          cat .xgaminglab-c04/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/c04.patch"
          cat .xgaminglab-c04-final/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/c04-final.patch"
          cat .xgaminglab-c05/patch.b64.part* | base64 -d | gzip -dc > "$RUNNER_TEMP/c05.patch"
          cd "$RUNNER_TEMP/xgaminglab"
          patch -p1 --forward --batch < "$RUNNER_TEMP/31.patch"
          patch -p1 --forward --batch < "$RUNNER_TEMP/c04.patch"
          patch -p1 --forward --batch < "$RUNNER_TEMP/c04-final.patch"
          patch -p1 --forward --batch < "$RUNNER_TEMP/c05.patch"
          grep -q 'regraphics_c05_effect_points' native/scene_renderer.cpp

      - name: Apply C06 balanced profile
        shell: bash
        run: |
          set -euo pipefail
          python3 .xgaminglab-c06/apply.py "$RUNNER_TEMP/xgaminglab"
          cd "$RUNNER_TEMP/xgaminglab"
          grep -q 'GPU Virtual + REgraphics C06 · Balance' src/x/lab/gaming/RunConfig.java
          grep -q 'displayPaced(selected)' src/x/lab/gaming/FrameLoop.java
          grep -q 'gpu_virtual_regraphics_balanced' native/scene_renderer.cpp
          grep -q '3.4.0-c06-balanced' AndroidManifest.xml
          grep -q 'X-Gaming-Lab-C06-Balanced.apk' scripts/build_apk.py

      - name: Host regressions and balance gate
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        run: |
          set -euo pipefail
          bash tests/run-frame-stats.sh
          bash tests/run-vsync-gate.sh
          bash tests/run-campaign-analysis.sh
          bash tests/run-gpu-virtual-graphics.sh
          bash tests/run-regraphics-c05.sh | tee evidence/regraphics-c05-host.txt
          bash tests/run-regraphics-c06.sh | tee evidence/regraphics-c06-host.txt
          grep -q '"physical":903' evidence/regraphics-c05-host.txt
          grep -q '"auto_route":5' evidence/regraphics-c06-host.txt

      - name: Build signed Android APK
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/35.0.0
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-35/android.jar
        run: |
          set -euo pipefail
          python3 scripts/build_apk.py
          test -f dist/X-Gaming-Lab-C06-Balanced.apk
          sha256sum dist/X-Gaming-Lab-C06-Balanced.apk | tee evidence/X-Gaming-Lab-C06-Balanced.sha256
          grep -q '"signatureVerified": true' evidence/apk-validation.json
          grep -q '"nativeLoadAlignment16KiB": true' evidence/apk-validation.json

      - name: Verify C06 identity
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            unzip -p dist/X-Gaming-Lab-C06-Balanced.apk "lib/$abi/libxgaminglab.so" > "$RUNNER_TEMP/$abi-libxgaminglab.so"
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'gpu_virtual_regraphics_balanced'
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'balanced_max_pending_render'
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'regraphics_c05_effect_points'
          done

      - name: Archive exact C06 source
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/xgaminglab-c06-balanced-source.tar.gz" -C "$RUNNER_TEMP/xgaminglab" --exclude='./build' --exclude='./dist' .

      - name: Upload C06
        uses: actions/upload-artifact@v4
        with:
          name: XGamingLab-C06-Balanced
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/xgaminglab/dist/X-Gaming-Lab-C06-Balanced.apk
            ${{ runner.temp }}/xgaminglab/evidence/X-Gaming-Lab-C06-Balanced.sha256
            ${{ runner.temp }}/xgaminglab/evidence/apk-validation.json
            ${{ runner.temp }}/xgaminglab/evidence/regraphics-c05-host.txt
            ${{ runner.temp }}/xgaminglab/evidence/regraphics-c06-host.txt
            ${{ runner.temp }}/xgaminglab-c06-balanced-source.tar.gz
