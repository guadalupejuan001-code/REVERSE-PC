name: Android C50 SurfaceFlinger FCVTZU and authentic boot continuation
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c50-fcvtzu-continue.yml
    - src/minimal_guest_simd.inc
    - tests/minimal_guest_fpint_vector_test.cpp
    - docs/ANDROID_C50_FCVTZU_CONTINUATION.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c50-vector-fcvtzu' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c50-native build
        git diff --exit-code 8d78521dfc4d1d48f5aff56f57d274eec30de613 HEAD -- src scripts patches third_party tools ':(exclude)src/minimal_guest_simd.inc'
        python3 - <<'PYCODE'
        import pathlib,subprocess
        p='src/minimal_guest_simd.inc';old=subprocess.check_output(['git','show','8d78521dfc4d1d48f5aff56f57d274eec30de613:'+p]).decode();new=pathlib.Path(p).read_text();a=new.index('  if((i&0x9fbffc00u)==0x0ea1b800u)');b=new.index('  if((i&0x9fbffc00u)==0x0e21d800u)',a);assert new[:a]+new[b:]==old
        PYCODE
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify FP-to-integer vectors, UBSan and existing arithmetic/system/codec behavior
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        for item in fpint_vector intfp_vector fcvtzs_scalar fp fmla_element system; do
         g++ $FLAGS -O2 tests/minimal_guest_${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c50-$item
         build/c50-$item > evidence/c50-native/$item.json
        done
        g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/minimal_guest_fpint_vector_test.cpp build/softfloat/libreverse_softfloat.a -o build/c50-fpint-ubsan
        build/c50-fpint-ubsan > evidence/c50-native/ubsan.json
        g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c50-view
        build/c50-view build/c50-view-data > evidence/c50-native/original-decoder.json
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c50-native/native
        g++ $FLAGS $HOST -O2 tools/guest_checkpoint_frame.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c50-native/frame
        evidence/c50-native/native --pins > evidence/c50-native/native-pins.json
        sha256sum evidence/c50-native/native evidence/c50-native/frame > evidence/c50-native/binary-sha256.txt
        g++ --version > evidence/c50-native/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c50-tested-native
        path: evidence/c50-native
        retention-days: 90
  arm-hardware:
    if: github.event.pull_request.head.ref == 'fix/android-c50-vector-fcvtzu' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Compare actual AArch64 encodings, IEEE results and cumulative flags
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        mkdir -p evidence/c50-arm
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
        g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tests/minimal_guest_fpint_vector_test.cpp build/softfloat/libreverse_softfloat.a -o build/c50-arm
        build/c50-arm > evidence/c50-arm/hardware.json
        python3 - <<'PY'
        import json
        r=json.load(open('evidence/c50-arm/hardware.json'))
        assert r['native_hardware_cases']>10000
        PY
        uname -a > evidence/c50-arm/machine.txt
        g++ --version > evidence/c50-arm/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c50-arm-hardware
        path: evidence/c50-arm
        retention-days: 90
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c50-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c48-tested-native
        run-id: 41925566473
        github-token: ${{ github.token }}
        path: reference-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c48-stage-2-verified-checkpoint
        run-id: 41925566473
        github-token: ${{ github.token }}
        path: source-c48
    - name: Authenticate the clean post-UCVTF source and independently pinned original CPU
      run: |
        set -euo pipefail
        mkdir -p evidence/c50-source
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = 'f200be4184e9381d46cf3791f40d0addabdf08e708686f75396e553e314024a7'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c48/output-contract.json')),p=preflight(c,'source-c48',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'38163db1d8d120595a5483835733101268a8eeff');assert.equal(c.checkpoint_sha256,'5193c20e52dd2bc6612a39e478be2aab698866f2a5a8f8a5289a14cdbd450b5a');assert.equal(p.report.guest.instructions,28109215990);writeFileSync('evidence/c50-source/preflight.json',JSON.stringify(c,null,2)+'\n');
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c50-source/media.json
        cp media-input/manifest.json evidence/c50-source/media-transport.json
        rm -rf media-input
    - name: Execute the original C48 CPU to the clean boundary before FCVTZU
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        process.env.REVERSE_PC_C39_CHUNK='200000';const r=await run(JSON.parse(readFileSync('source-c48/output-contract.json')),'source-c48','reference-build/native','new-media/android-c27.raw','evidence/c50-reference',{wallMs:180000,instructions:4628,cycles:1,maxTransportBytes:2147483648});assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(r.result.checkpoint_sha256,'ed006047d64c776b9263044a506d1fb0ffd0dcef3a33e4fa550385e45044189a');writeFileSync('evidence/c50-source/reference.json',JSON.stringify(r,null,2)+'\n');
        NODE
    - name: C50 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c48 evidence/c50-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c48/c42-progress.json 4628 2147483648 > evidence/c50-source/stage-1.json
        cmp evidence/c50-reference/current.rvg evidence/c50-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c50-1/current.json'));assert.equal(r.guest.instructions,28109220618);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'ed006047d64c776b9263044a506d1fb0ffd0dcef3a33e4fa550385e45044189a');
        NODE
        rm -rf evidence/c50-reference reference-build
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c50-stage-1-verified-checkpoint
        path: |-
          evidence/c50-1/
          !evidence/c50-1/native/journal/**
          !evidence/c50-1/native/current.rvg
          !evidence/c50-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c50-stage-1-diagnostics
        path: |-
          evidence/c50-1/*.json
          evidence/c50-1/*.txt
          evidence/c50-1/*.log
          evidence/c50-1/native/*.json
          evidence/c50-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C50 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c50-1 evidence/c50-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c50-1/c42-progress.json 1 2147483648 > evidence/c50-source/stage-2.json
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync,openSync,readSync,closeSync,fstatSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c50-2/current.json'));assert.equal(r.guest.instructions,28109220619);assert.equal(r.guest.pc,'0x6fc27b30d8');assert.equal(r.error,'');const fd=openSync('evidence/c50-2/current.rvg','r'),h=Buffer.alloc(360);readSync(fd,h,0,360,0);const n=Number(h.readBigUInt64LE(352)),fp=Buffer.alloc(n);readSync(fd,fp,0,n,fstatSync(fd).size-8-n);closeSync(fd);assert.ok(fp.readUInt32LE(16)&1);assert.equal(fp.readBigUInt64LE(20),0x0000001400000000n);assert.equal(fp.readBigUInt64LE(28),0x0000003b00000028n);writeFileSync('evidence/c50-source/fcvtzu-crossing.json',JSON.stringify({instructions:r.guest.instructions,pc:r.guest.pc,observed_fcvtzu_executed:true,unsigned_result:[0,20,40,59],checkpoint_sha256:r.checkpoint_sha256},null,2)+'\n');
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c50-stage-2-verified-checkpoint
        path: |-
          evidence/c50-2/
          !evidence/c50-2/native/journal/**
          !evidence/c50-2/native/current.rvg
          !evidence/c50-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: rm -rf evidence/c50-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c50-stage-2-diagnostics
        path: |-
          evidence/c50-2/*.json
          evidence/c50-2/*.txt
          evidence/c50-2/*.log
          evidence/c50-2/native/*.json
          evidence/c50-2/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C50 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c50-2 evidence/c50-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c50-2/c42-progress.json 1000000 2147483648 > evidence/c50-source/stage-3.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c50-stage-3-verified-checkpoint
        path: |-
          evidence/c50-3/
          !evidence/c50-3/native/journal/**
          !evidence/c50-3/native/current.rvg
          !evidence/c50-3/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: rm -rf evidence/c50-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c50-stage-3-diagnostics
        path: |-
          evidence/c50-3/*.json
          evidence/c50-3/*.txt
          evidence/c50-3/*.log
          evidence/c50-3/native/*.json
          evidence/c50-3/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C50 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c50-3 evidence/c50-4 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c50-3/c42-progress.json 1000000000 2147483648 > evidence/c50-source/stage-4.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s4.outcome == 'success'
      with:
        name: reverse-c50-stage-4-verified-checkpoint
        path: |-
          evidence/c50-4/
          !evidence/c50-4/native/journal/**
          !evidence/c50-4/native/current.rvg
          !evidence/c50-4/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s4.outcome == 'success'
      run: rm -rf evidence/c50-3
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s4.outcome == 'failure'
      with:
        name: reverse-c50-stage-4-diagnostics
        path: |-
          evidence/c50-4/*.json
          evidence/c50-4/*.txt
          evidence/c50-4/*.log
          evidence/c50-4/native/*.json
          evidence/c50-4/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C50 stage 5 execute and verify the authentic Android machine
      id: s5
      if: success() && steps.s4.outcome == 'success' && steps.s4.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c50-4 evidence/c50-5 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c50-4/c42-progress.json 1000000000 2147483648 > evidence/c50-source/stage-5.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s5.outcome == 'success'
      with:
        name: reverse-c50-stage-5-verified-checkpoint
        path: |-
          evidence/c50-5/
          !evidence/c50-5/native/journal/**
          !evidence/c50-5/native/current.rvg
          !evidence/c50-5/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s5.outcome == 'success'
      run: rm -rf evidence/c50-4
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s5.outcome == 'failure'
      with:
        name: reverse-c50-stage-5-diagnostics
        path: |-
          evidence/c50-5/*.json
          evidence/c50-5/*.txt
          evidence/c50-5/*.log
          evidence/c50-5/native/*.json
          evidence/c50-5/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C50 stage 6 execute and verify the authentic Android machine
      id: s6
      if: success() && steps.s5.outcome == 'success' && steps.s5.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c50-5 evidence/c50-6 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c50-5/c42-progress.json 1000000000 2147483648 > evidence/c50-source/stage-6.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s6.outcome == 'success'
      with:
        name: reverse-c50-stage-6-verified-checkpoint
        path: |-
          evidence/c50-6/
          !evidence/c50-6/native/journal/**
          !evidence/c50-6/native/current.rvg
          !evidence/c50-6/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s6.outcome == 'success'
      run: rm -rf evidence/c50-5
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s6.outcome == 'failure'
      with:
        name: reverse-c50-stage-6-diagnostics
        path: |-
          evidence/c50-6/*.json
          evidence/c50-6/*.txt
          evidence/c50-6/*.log
          evidence/c50-6/native/*.json
          evidence/c50-6/native/*.log
        if-no-files-found: warn
        retention-days: 90
    - name: C50 stage 7 execute and verify the authentic Android machine
      id: s7
      if: success() && steps.s6.outcome == 'success' && steps.s6.outputs.boot != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c50-6 evidence/c50-7 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c50-6/c42-progress.json 1000000000 2147483648 > evidence/c50-source/stage-7.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s7.outcome == 'success'
      with:
        name: reverse-c50-stage-7-verified-checkpoint
        path: |-
          evidence/c50-7/
          !evidence/c50-7/native/journal/**
          !evidence/c50-7/native/current.rvg
          !evidence/c50-7/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
