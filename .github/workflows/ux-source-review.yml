name: REVERSE UX source and integration checks
on:
  pull_request:
    branches: [main, integrate/reverse-all-music-qd-laplace-20261028]
    paths:
      - 'reverse-os-android/**'
      - 'apps/prisma/**'
      - '.github/workflows/ux-source-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact UX source for repeatable local review
        run: |
          set -euo pipefail
          tar -czf reverse-ux-source.tar.gz             reverse-os-android/app/src/main/assets/workbench             reverse-os-android/app/src/main/java/com/reversepc/os             reverse-os-android/app/src/main/AndroidManifest.xml                         reverse-os-android/tests             reverse-os-android/app/src/androidTest             reverse-os-android/app/build.gradle             apps/prisma/web             .github/workflows/workbench-android.yml
          sha256sum reverse-ux-source.tar.gz > reverse-ux-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-ux-source-review
          path: |
            reverse-ux-source.tar.gz
            reverse-ux-source.sha256
          retention-days: 3
