name: Android C42 Zygote to verified system_server continuation
'on':
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/android-c42-system-server.yml
      - tools/android_c42_zygote_progress.mjs
      - tests/android_c42_zygote_progress.test.mjs
      - docs/ANDROID_C42_SYSTEM_SERVER.md
permissions:
  contents: read
  actions: read
jobs:
  c42-zygote-system-server:
    if: github.event.pull_request.head.ref == 'experiment/android-c42-zygote-system-server' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prove the CPU XI Ether clock and guest security are unchanged
        run: |
          set -euo pipefail
          mkdir -p build evidence/c42-source
          git diff --exit-code 0b1d2aec6613975fdca2ab88461b73df4b940be2 HEAD -- src third_party patches scripts tools ':(exclude)tools/android_c42_zygote_progress.mjs'
          node --check tools/android_c42_zygote_progress.mjs
          node --test tests/android_c42_zygote_progress.test.mjs tests/android_c40_recovery_evidence.test.mjs tests/android_c40_zygote_stage.test.mjs tests/android_framework_evidence.test.mjs tests/android_odsign_property_probe.test.mjs tests/android_c27_profile_resume.test.mjs tests/android_supervised_cycle.test.mjs > evidence/c42-source/host-tests.tap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c29-tested-build
          run-id: 41151900393
          github-token: ${{ github.token }}
          path: pinned-build
      - name: Compile unchanged C41 CPU source with O2 and O3 and test scalar SIMD
        run: |
          set -euo pipefail
          tar --no-same-owner -xzf pinned-build/tested-source.tar.gz build/ether-compat build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
          FLAGS="-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools"
          g++ $FLAGS -O2 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -o build/c42-native-reference
          g++ $FLAGS -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -o build/c42-native
          g++ $FLAGS -O2 tools/guest_checkpoint_frame.cpp build/softfloat/libreverse_softfloat.a -o build/c42-frame
          g++ $FLAGS -O3 tests/minimal_guest_fcvtzs_scalar_test.cpp build/softfloat/libreverse_softfloat.a -o build/c42-conversion-test
          g++ $FLAGS -O3 tests/minimal_guest_fp_test.cpp build/softfloat/libreverse_softfloat.a -o build/c42-fp-test
          build/c42-conversion-test > evidence/c42-source/o3-conversion-tests.json
          build/c42-fp-test > evidence/c42-source/o3-fp-tests.json
          g++ --version > evidence/c42-source/compiler.txt
          build/c42-native-reference --pins > evidence/c42-source/reference-pins.json
          build/c42-native --pins > evidence/c42-source/native-pins.json
          cmp evidence/c42-source/reference-pins.json evidence/c42-source/native-pins.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {verifyNativePins} from './tools/android_c27_profile_resume.mjs';
          verifyNativePins(JSON.parse(readFileSync('evidence/c42-source/native-pins.json','utf8')));
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c42-stage-8-verified-checkpoint
          run-id: 41385085636
          github-token: ${{ github.token }}
          path: source-c42
      - name: Authenticate the exact C42 stage 8 and inspect live Zygote
        id: source
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs preflight source-c42/output-contract.json source-c42 > evidence/c42-source/preflight.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8')),c=read('source-c42/output-contract.json'),r=read('source-c42/current.json');
          assert.equal(c.source_commit,'bac435fb89b1c689843bcc400c129942637a42b1');
          assert.equal(c.checkpoint_sha256,'b45add2d6796841bad15602a11184375148aa759efaf8faa5cc034c11d11dd2f');
          assert.equal(r.guest.instructions,23317342731);
          NODE
          test -f source-c42/c42-kernel.json
          test -f source-c42/c42-progress.json
          for C42_OBSERVATION in c42-kernel.json c42-kernel.json.log c42-progress.json; do
            if [ -f "source-c42/$C42_OBSERVATION" ]; then mv "source-c42/$C42_OBSERVATION" "source-c42/previous-$C42_OBSERVATION"; fi
          done
          node tools/android_c42_zygote_progress.mjs inspect source-c42 > evidence/c42-source/zygote.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.source.outputs.server != 'true'
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Restore the unchanged Android disk
        if: steps.source.outputs.server != 'true'
        run: |
          set -euo pipefail
          ORIGINAL=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$ORIGINAL"
          node tools/android_c27_media.mjs "$ORIGINAL" new-media > evidence/c42-source/media.json
          rm -rf disk-input
      - name: Prove O2 50k and O3 200k give byte-identical real Android state
        id: batch
        if: steps.source.outputs.server != 'true'
        run: |
          set -euo pipefail
          REVERSE_PC_C39_CHUNK=50000 REVERSE_PC_C39_CHECKPOINT_MS=60000 REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS=100000000 node tools/android_c27_profile_resume.mjs run source-c42/output-contract.json source-c42 build/c42-native-reference new-media/android-c27.raw evidence/c42-reference 180000 1000000 1 > evidence/c42-source/reference.json
          REVERSE_PC_C39_CHUNK=200000 REVERSE_PC_C39_CHECKPOINT_MS=120000 REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS=200000000 node tools/android_c27_profile_resume.mjs run source-c42/output-contract.json source-c42 build/c42-native new-media/android-c27.raw evidence/c42-batched 180000 1000000 1 > evidence/c42-source/batched.json
          cmp evidence/c42-reference/current.rvg evidence/c42-batched/current.rvg
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {execFileSync} from 'node:child_process';
          import {contractForCompletedSource,preflight} from './tools/android_c27_profile_resume.mjs';
          const read=p=>JSON.parse(readFileSync(p,'utf8')),commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const contract=contractForCompletedSource('evidence/c42-batched',commit);
          writeFileSync('evidence/c42-batched/output-contract.json',JSON.stringify(contract,null,2)+'\n');
          const p=preflight(contract,'evidence/c42-batched');assert.equal(p.report.guest.instructions,23318342731);
          const ref=read('evidence/c42-reference/current.json');assert.equal(ref.checkpoint_sha256,contract.checkpoint_sha256);
          writeFileSync('evidence/c42-source/differential.json',JSON.stringify({source_instructions:23317342731,instructions:p.report.guest.instructions,checkpoint_sha256:contract.checkpoint_sha256,byte_identical:true,guest_clock_identical:true,host_transactions:[50000,200000],host_compiler_policies:['O2','O3'],fast_math_enabled:false},null,2)+'\n');
          NODE
          node tools/android_c42_zygote_progress.mjs inspect evidence/c42-batched source-c42/c42-progress.json > evidence/c42-source/batched-progress.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.batch.outcome == 'success'
        with:
          name: reverse-c42-continuation-batched-verified-checkpoint
          path: |-
            evidence/c42-batched/
            !evidence/c42-batched/journal/**
          if-no-files-found: error
          retention-days: 90
      - name: Release only temporary differential journals after checkpoint upload
        if: steps.batch.outcome == 'success'
        run: |
          rm -rf evidence/c42-reference evidence/c42-batched/journal
      - name: C42 stage 9 continue real Android and inspect Zygote
        id: s1
        if: steps.batch.outcome == 'success' && steps.batch.outputs.server != 'true'
        env:
          REVERSE_PC_C39_CHUNK: '200000'
          REVERSE_PC_C39_CHECKPOINT_MS: '120000'
          REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          node tools/android_c42_zygote_progress.mjs run evidence/c42-batched evidence/c42-1 build/c42-native new-media/android-c27.raw build/c42-frame "$SHA" evidence/c42-batched/c42-progress.json 1000000000 > evidence/c42-source/stage-1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.s1.outcome == 'success'
        with:
          name: reverse-c42-stage-9-verified-checkpoint
          path: |-
            evidence/c42-1/
            !evidence/c42-1/native/journal/**
            !evidence/c42-1/native/current.rvg
            !evidence/c42-1/native/frame.ppm
            !evidence/c42-1/native/frame.pending.ppm
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.s1.outcome != 'skipped' && steps.s1.outcome != ''
        with:
          name: reverse-c42-stage-9-progress
          path: |-
            evidence/c42-1/*.json
            evidence/c42-1/*.txt
            evidence/c42-1/native/*.json
            evidence/c42-1/native/*.log
