name: Android PCI checkpoint continuation cycle
on:
  pull_request:
    paths: ['src/guest_boot_cycle.hpp', 'tools/guest_pci_cycle.cpp', 'tests/guest_boot_cycle_test.cpp', '.github/workflows/android-pci-cycle.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cycle-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: guadalupejuan001-code/mundo-X, ref: e2778d962af22f6f1a0794058dd4685fc2573966, path: deps/mundo-x, persist-credentials: false}
      - name: Verify exact CPU continuation, pixels, rejected transitions and journal recovery
        run: |
          mkdir -p build evidence/c04
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 scripts/build-softfloat.py
          g++ -std=c++17 -O1 -pthread -fsanitize=undefined -fno-sanitize-recover=all -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tests/guest_boot_cycle_test.cpp build/softfloat/libreverse_softfloat.a -o build/boot-cycle-test
          build/boot-cycle-test > evidence/c04/cycle-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: reverse-c04-cycle-checks, path: 'evidence/c04/', retention-days: 14}
  continue-genuine-android:
    needs: cycle-checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: guadalupejuan001-code/mundo-X, ref: e2778d962af22f6f1a0794058dd4685fc2573966, path: deps/mundo-x, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {name: reverse-android-c03-genuine-partition-disk, run-id: 40910284394, github-token: '${{ github.token }}', path: disk-input}
      - uses: actions/download-artifact@v4
        with: {name: reverse-c03-own-pci-kernel-evidence, run-id: 40915461561, github-token: '${{ github.token }}', path: boot-input}
      - name: Build the continuation tool and independently audit the exact source
        run: |
          mkdir -p build evidence/c04
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 scripts/build-softfloat.py
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tools/guest_pci_cycle.cpp build/softfloat/libreverse_softfloat.a -o build/guest-pci-cycle
          node tools/audit_gki_rvg.mjs boot-input/current.rvg f722bdd809bfd3485917a564b053b8a6d4938408734091f420c3297a8e3b20c8 798e68ea6c98a81e4607272cd2f83eefff2a08cb118ccdb1d605c98c8a6c718d > evidence/c04/input-audit.json
          cp boot-input/acquisition.json boot-input/partitions.json boot-input/ramdisk-provenance.json evidence/c04/
      - name: Resume the original PCI state for up to twenty minutes with periodic checkpoints
        run: |
          DISK=$(find disk-input -name android-slot-a.raw -print -quit)
          timeout --signal=TERM --kill-after=30s 1450s build/guest-pci-cycle boot-input/current.rvg "$DISK" evidence/c04/journal 1200000 798e68ea6c98a81e4607272cd2f83eefff2a08cb118ccdb1d605c98c8a6c718d > evidence/c04/result.json
      - name: Recover and validate the newest complete generation, including after a rejected transition
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync,copyFileSync,existsSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='evidence/c04',journal=root+'/journal';
          if(!existsSync(journal+'/latest.json'))process.exit(0);
          const pointer=JSON.parse(readFileSync(journal+'/latest.json'));
          if(!/^generation-[1-9][0-9]*$/.test(pointer.generation))throw Error('Invalid generation');
          const dir=journal+'/'+pointer.generation,b=readFileSync(dir+'/checkpoint.rvg'),proof=JSON.parse(readFileSync(dir+'/report.json'));
          const sha=createHash('sha256').update(b).digest('hex');
          if(sha!==pointer.checkpoint_sha256||sha!==proof.checkpoint_sha256)throw Error('Checkpoint/proof mismatch');
          if(proof.initial_instructions!==1817250000||proof.guest.instructions<proof.initial_instructions||proof.advanced_instructions!==proof.guest.instructions-proof.initial_instructions)throw Error('Cycle restarted or miscounted');
          if(proof.provenance.input_checkpoint_sha256!=='798e68ea6c98a81e4607272cd2f83eefff2a08cb118ccdb1d605c98c8a6c718d')throw Error('Different source');
          copyFileSync(dir+'/checkpoint.rvg',root+'/current.rvg');copyFileSync(dir+'/report.json',root+'/current.json');
          writeFileSync(root+'/console.txt',proof.console);
          console.log(JSON.stringify({instructions:proof.guest.instructions,advanced:proof.advanced_instructions,reason:proof.stop_reason,verified_init:proof.first_user_instruction_verified,sha256:sha}));
          JS
          if test -s evidence/c04/current.rvg; then
            SHA=$(sha256sum evidence/c04/current.rvg | cut -d ' ' -f 1)
            if ! node tools/android_kernel_observer.mjs evidence/c04/current.rvg "$SHA" > evidence/c04/kernel-observer.json 2> evidence/c04/observer-error.txt; then
              printf '%s\n' '{"status":"observation_unavailable","android_boot_inferred":false}' > evidence/c04/kernel-observer.json
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-c04-android-pci-continuation
          path: |
            evidence/c04/
            !evidence/c04/journal/**
          retention-days: 14
