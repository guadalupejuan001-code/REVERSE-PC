name: Export pinned Android disk in bounded parts
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/android-original-disk-parts.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: android-original-disk-export-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  export-original:
    if: github.event.pull_request.head.ref == 'fix/android-c15-multiply-long-20261030' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: original
      - name: Verify complete disk and compress unchanged bytes
        run: |
          set -euo pipefail
          DISK=$(find original -name android-slot-a.raw -print -quit)
          test -n "$DISK"
          test "$(stat -c %s "$DISK")" = 8738832384
          echo "28303ac7b2832cbde4e1c56551bf81816b55bc946cc75a444f2605316ed97e1c  $DISK" | sha256sum --check
          mkdir -p export
          gzip -n -6 -c "$DISK" | split -b 400M -d - export/android-slot-a.raw.gz.part-
          sha256sum export/android-slot-a.raw.gz.part-* > export/parts.sha256
          test "$(find export -name '*.part-*' | wc -l)" -le 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-original-disk-part-00
          path: export/android-slot-a.raw.gz.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-original-disk-part-01
          path: export/android-slot-a.raw.gz.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-original-disk-part-02
          path: export/android-slot-a.raw.gz.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-original-disk-part-03
          path: export/android-slot-a.raw.gz.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverse-original-disk-parts-manifest
          path: export/parts.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
