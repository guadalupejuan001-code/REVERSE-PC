name: REgraphics C03 APK gate (disabled until C03)

# Deliberately disabled at C02: source-only tests are defined in xgaminglab-regraphics-c01.yml.
# A signed APK must NOT be built or uploaded before C03 is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-apk-before-c03:
    runs-on: ubuntu-latest
    steps:
      - name: Assert APK phase is reserved for C03
        run: |
          echo "C02: source and host gates only; no Android SDK, NDK, signing, or APK artifacts."
