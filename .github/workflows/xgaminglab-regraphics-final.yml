name: XGamingLab REgraphics Final

on:
  push:
    branches:
      - feature/xgaminglab-regraphics-final-20261111
    paths:
      - '.xgaminglab-final/**'
      - '.github/workflows/xgaminglab-regraphics-final.yml'
  pull_request:
    paths:
      - '.xgaminglab-final/**'
      - '.github/workflows/xgaminglab-regraphics-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"

      - name: Download exact C07 source artifact
        uses: actions/download-artifact@v4
        with:
          name: XGamingLab-C07-369B
          path: ${{ runner.temp }}/c07-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43115914988

      - name: Create canonical REgraphics Final source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_TAR="$(find "$RUNNER_TEMP/c07-artifact" -name 'xgaminglab-c07-369b-source.tar.gz' -print -quit)"
          test -n "$SOURCE_TAR"
          mkdir -p "$RUNNER_TEMP/xgaminglab"
          tar -xzf "$SOURCE_TAR" -C "$RUNNER_TEMP/xgaminglab"
          base64 -d .xgaminglab-final/consolidate.py.gz.b64 | gzip -dc > "$RUNNER_TEMP/consolidate.py"
          python3 "$RUNNER_TEMP/consolidate.py" "$RUNNER_TEMP/xgaminglab"
          grep -q 'GPU Virtual + REgraphics · Final' "$RUNNER_TEMP/xgaminglab/src/x/lab/gaming/RunConfig.java"
          grep -q 'gpu_virtual_regraphics_final' "$RUNNER_TEMP/xgaminglab/native/scene_renderer.cpp"
          grep -q 'COMPACT_EFFECTS_FIELD)?2:1' "$RUNNER_TEMP/xgaminglab/native/scene_renderer.cpp"
          grep -q '3.6.0-regraphics-final' "$RUNNER_TEMP/xgaminglab/AndroidManifest.xml"

      - name: Host regressions and color gate
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        run: |
          set -euo pipefail
          bash tests/run-frame-stats.sh
          bash tests/run-vsync-gate.sh
          bash tests/run-campaign-analysis.sh
          bash tests/run-gpu-virtual-graphics.sh
          bash tests/run-regraphics-c05.sh | tee evidence/regraphics-fast-path.txt
          bash tests/run-regraphics-final.sh | tee evidence/regraphics-final.txt
          grep -q '"physical":903' evidence/regraphics-fast-path.txt
          grep -q '"unique_rgb":154' evidence/regraphics-final.txt
          grep -q '"nonzero_alpha":1024' evidence/regraphics-final.txt
          grep -q '"logical_extreme":369000000000' evidence/regraphics-final.txt

      - name: Build signed Android APK
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/35.0.0
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-35/android.jar
        run: |
          set -euo pipefail
          python3 scripts/build_apk.py
          test -f dist/X-Gaming-Lab-REgraphics-Final.apk
          sha256sum dist/X-Gaming-Lab-REgraphics-Final.apk | tee evidence/X-Gaming-Lab-REgraphics-Final.sha256
          grep -q '"signatureVerified": true' evidence/apk-validation.json
          grep -q '"nativeLoadAlignment16KiB": true' evidence/apk-validation.json

      - name: Verify final native identity in both ABIs
        shell: bash
        working-directory: ${{ runner.temp }}/xgaminglab
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            unzip -p dist/X-Gaming-Lab-REgraphics-Final.apk "lib/$abi/libxgaminglab.so" > "$RUNNER_TEMP/$abi-libxgaminglab.so"
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'gpu_virtual_regraphics_final'
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q 'resolved-rgba8-premultiplied'
            strings "$RUNNER_TEMP/$abi-libxgaminglab.so" | grep -q '369000000000'
          done

      - name: Archive canonical final source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/xgaminglab-regraphics-final-source.tar.gz" -C "$RUNNER_TEMP/xgaminglab" --exclude='./build' --exclude='./dist' .
          sha256sum "$RUNNER_TEMP/xgaminglab-regraphics-final-source.tar.gz" > "$RUNNER_TEMP/xgaminglab-regraphics-final-source.sha256"

      - name: Upload final APK and canonical source
        uses: actions/upload-artifact@v4
        with:
          name: XGamingLab-REgraphics-Final
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/xgaminglab/dist/X-Gaming-Lab-REgraphics-Final.apk
            ${{ runner.temp }}/xgaminglab/evidence/X-Gaming-Lab-REgraphics-Final.sha256
            ${{ runner.temp }}/xgaminglab/evidence/apk-validation.json
            ${{ runner.temp }}/xgaminglab/evidence/regraphics-fast-path.txt
            ${{ runner.temp }}/xgaminglab/evidence/regraphics-final.txt
            ${{ runner.temp }}/xgaminglab-regraphics-final-source.tar.gz
            ${{ runner.temp }}/xgaminglab-regraphics-final-source.sha256
