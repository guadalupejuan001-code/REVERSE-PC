name: Velocity C04 pinned source fixture
on:
  push:
    branches: [feature/velocity-c04-original-qssd-20261108]
    paths: ['.github/workflows/velocity-c04-source-fixture.yml']
permissions: {contents: read}
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/Virtual-qSSD-
          ref: 9fe72bbf0d972d0baad9300971dfaabab5691447
          path: component-sources/qssd
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/GPU-VIRTUAL
          ref: 4cdd47f487cfadbca559dd8c2f5abc0448cd77a7
          path: component-sources/gpu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: 1f925786522aba91f72707ad1638a8edcdd31a8f
          path: component-sources/mundo
          persist-credentials: false
      - name: Archive only tracked source, without repository credentials or git configuration
        run: |
          set -euo pipefail
          mkdir -p source-fixture/reverse source-fixture/qssd source-fixture/gpu source-fixture/mundo
          git archive HEAD | tar -x -C source-fixture/reverse
          for component in qssd gpu mundo; do
            git -C component-sources/$component archive HEAD | tar -x -C source-fixture/$component
            git -C component-sources/$component rev-parse HEAD > source-fixture/$component.revision
          done
          git rev-parse HEAD > source-fixture/reverse.revision
          tar -czf velocity-c04-pinned-sources.tar.gz -C source-fixture .
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-c04-pinned-sources
          path: velocity-c04-pinned-sources.tar.gz
          retention-days: 7
          if-no-files-found: error
