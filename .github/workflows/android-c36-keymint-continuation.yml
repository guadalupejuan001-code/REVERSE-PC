name: Android C36 KeyMint crypto to odsign / Zygote actual continuation
'on':
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/android-c36-keymint-continuation.yml
      - docs/ANDROID_C36_KEYMINT_CONTINUATION.md
permissions:
  contents: read
  actions: read
jobs:
  native-keymint-continuation:
    if: github.event.pull_request.head.ref == 'experiment/android-c36-keymint-real-continuation-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prove no virtual CPU, kernel, disk, timer or XI/Ether modification
        run: |
          set -euo pipefail
          mkdir -p evidence/c36-diagnostics build
          changes=$(git diff --name-only ad64c237bb1efb4bb7520182507f2ffc4c39b2c5 HEAD -- src third_party scripts patches tools/guest_c27_profile_resume.cpp tools/guest_budget_cycles.hpp tools/guest_checkpoint_frame.cpp)
          test -z "$changes"
          node --test tests/android_c35_source_gate.test.mjs tests/android_c35_stage.test.mjs tests/android_c34_stage.test.mjs tests/android_c33_stage.test.mjs tests/android_framework_evidence.test.mjs tests/android_guest_outcome.test.mjs > evidence/c36-diagnostics/host-tests.tap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c35-authenticated-continuation
          run-id: 41347214737
          github-token: ${{ github.token }}
          path: source-c35
      - name: Authenticate original clean C35 four-file checkpoint
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs preflight source-c35/output-contract.json source-c35 > evidence/c36-diagnostics/source-preflight.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const c=read('source-c35/output-contract.json'),r=read('source-c35/current.json'),b=read('source-c35/boundary-summary.json');
          assert.equal(c.source_commit,'a2e1b145ff573ffd69ffc6a32c646de69cbe1e18');
          assert.equal(c.checkpoint_sha256,'c4bd2ff6b33a3ec79ff7ced57e6e248c848e4b31374cc4a04dc46de8f36b6c8e');
          assert.equal(r.guest.instructions,15317348839);
          assert.equal(b.clean_completed,true);assert.equal(b.checkpoint_sha256,c.checkpoint_sha256);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c29-tested-build
          run-id: 41151900393
          github-token: ${{ github.token }}
          path: pinned-build
      - name: Build identical native XI Ether ARM64 interpreter and framebuffer verifier
        run: |
          set -euo pipefail
          tar -xzf pinned-build/tested-source.tar.gz build/ether-compat build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -o build/c36-native
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools tools/guest_checkpoint_frame.cpp build/softfloat/libreverse_softfloat.a -o build/c36-frame
          build/c36-native --pins > evidence/c36-diagnostics/native-pins.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {verifyNativePins} from './tools/android_c27_profile_resume.mjs';
          verifyNativePins(JSON.parse(readFileSync('evidence/c36-diagnostics/native-pins.json','utf8')));
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Restore original disk and unmodified Android guest runtime
        run: |
          set -euo pipefail
          ORIGINAL=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$ORIGINAL"
          node tools/android_c27_media.mjs "$ORIGINAL" new-media > evidence/c36-diagnostics/media.json
          rm -rf disk-input
      - name: Continue KeyMint crypto on actual guest CPU from C35
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          node tools/android_c27_sequence.mjs source-c35/output-contract.json source-c35 build/c36-native new-media/android-c27.raw build/c36-frame evidence/c36 "$SOURCE_COMMIT" 540000 600000000 3 > evidence/c36-diagnostics/native-sequence.json
      - name: Authenticate exact C36 output and Zygote proof from live kernel
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {preflight} from './tools/android_c27_profile_resume.mjs';
          import {isLiveUserspaceTask} from './tools/android_framework_evidence.mjs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const source=read('source-c35/output-contract.json'),dest=read('evidence/c36/output-contract.json');
          preflight(source,'source-c35');
          preflight(dest,'evidence/c36');
          const r=read('evidence/c36/current.json'),b=read('evidence/c36/boundary-summary.json');
          const host=read('evidence/c36/process-outcome.json'),result=read('evidence/c36/result.json');
          const kernel=read('evidence/c36/kernel-observation.json'),framework=read('evidence/c36/runtime-evidence.json');
          assert.equal(r.initial_instructions,15317348839);
          assert.ok(r.guest.instructions>15317348839);
          assert.equal(r.provenance.input_checkpoint_sha256,source.checkpoint_sha256);
          assert.equal(b.clean_completed,true);
          assert.equal(r.error,'');
          assert.equal(host.status,'process_completed');
          assert.equal(host.exit_code,0);
          for(const k of ['guest_kernel_panic','guest_boot_failure','guest_reboot_requested','guest_terminal_failure'])assert.equal(result[k],false);
          assert.equal(kernel.checkpoint_sha256,dest.checkpoint_sha256);
          assert.equal(kernel.input_unchanged,true);
          assert.equal(framework.checkpoint_sha256,dest.checkpoint_sha256);
          assert.equal(framework.android_display_content_verified,false);
          const tasks=kernel.tasks??[],alive=n=>tasks.some(t=>t.name===n&&isLiveUserspaceTask(t));
          const property=kernel.live_boot_property;
          const names=['odsign','keystore2','zygote64','system_server','surfaceflinger','servicemanager'];
          const live=Object.fromEntries(names.map(n=>[n,alive(n)]));
          const lines=r.console.split(/\r?\n/).filter(Boolean);
          const exit=lines.some(line=>/init: Service 'odsign' \(pid \d+\) exited with status 0\b/.test(line));
          const stage=framework.framework_runtime_verified?'framework_verified':
            live.zygote64?'zygote64_running':
            lines.some(line=>line.includes("init: starting service 'zygote"))?'zygote_start_requested':
            exit?'odsign_exited_clean':live.odsign?'odsign_running':'odsign_state_unresolved';
          const proof={schema:'reverse-android-c36-keymint-genuine-v1',status:'clean_checkpoint',
            source_sha256:source.checkpoint_sha256,checkpoint_sha256:dest.checkpoint_sha256,
            source_instructions:15317348839,instructions:r.guest.instructions,
            added_instructions:r.advanced_instructions,stage,live_processes:live,
            odsign_exit_zero_observed:exit,selinux_enforcing_live:framework.selinux_enforcing_live,
            sys_boot_completed_live:framework.sys_boot_completed_live,
            scanout_exported:framework.scanout_exported,
            android_display_content_verified:false,
            android_boot_claimed:false,
            reasons:framework.reasons,
            current_task:kernel.current_task_details,
            last_uart_lines:lines.slice(-30),read_only_observations:true};
          writeFileSync('evidence/c36-diagnostics/actual-stage.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c36-keymint-diagnostics
          path: |-
            evidence/c36-diagnostics/
            evidence/c36/continuation-error.txt
            evidence/c36/boundary-summary.json
            evidence/c36/recovery-prefix.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reverse-c36-keymint-continuation
          path: |-
            evidence/c36/
            !evidence/c36/native/journal/**
            !evidence/c36/native/current.rvg
            !evidence/c36/native/frame.ppm
            !evidence/c36/native/frame.pending.ppm
          if-no-files-found: error
          retention-days: 90
