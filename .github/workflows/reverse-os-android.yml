name: REVERSE OS v0.5 — native BBY Q XI desktop
on:
  pull_request:
    branches: [main, feature/reverse-os-landscape-ether-motion-20261026]
    paths:
      - 'reverse-os-android/**'
      - 'tests/reverse_os_transport.cpp'
      - 'src/**'
      - 'scripts/prepare-ether-compat.py'
      - 'scripts/ether_integration.py'
      - '.github/workflows/reverse-os-android.yml'
  push:
    branches: [main, feature/reverse-os-bbyq-native-integration-20261026]
    paths:
      - 'reverse-os-android/**'
      - 'tests/reverse_os_transport.cpp'
      - '.github/workflows/reverse-os-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-os:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout REVERSE-PC, including XI extensions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Mundo X compute kernel
        uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - name: Checkout pinned BBY Q original XI learner
        uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/BBY-Q
          ref: 7dfa6c31247cf609128db78908313a6ce41c0b80
          path: deps/bbyq
          persist-credentials: false
      - name: Bundle the real BBY Q XI programs and observational curriculum
        shell: bash
        run: |
          set -euo pipefail
          bash reverse-os-android/scripts/prepare-bbyq.sh deps/bbyq
          test "$(find reverse-os-android/app/src/main/assets/bbyq -name '*.xi' | wc -l)" -eq 24
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android NDK and emulator tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" \
            platform-tools emulator "system-images;android-35;default;x86_64"
      - name: Generate verified local Ether extension
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C deps/mundo-x rev-parse HEAD)" = e2778d962af22f6f1a0794058dd4685fc2573966
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          test -s build/ether-compat/changes.diff
      - name: Verify RVPC2 transport and real XI execution on Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reverse-os-evidence reverse-os-dist
          g++ -std=c++17 -O1 -Wall -Wextra -Wpedantic \
            -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc \
            tests/reverse_os_transport.cpp -o build/reverse_os_transport
          ./build/reverse_os_transport | tee reverse-os-evidence/host-native-test.txt
      - name: Build REVERSE OS native APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p reverse-os-android --no-daemon --stacktrace :app:assembleDebug \
            > reverse-os-evidence/gradle.log 2>&1 || {
              tail -160 reverse-os-evidence/gradle.log
              exit 1
            }
          tail -35 reverse-os-evidence/gradle.log
          cp reverse-os-android/app/build/outputs/apk/debug/app-debug.apk \
            reverse-os-dist/REVERSE-OS-v0.5-BBYQ.apk
      - name: Verify signed package and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK=reverse-os-dist/REVERSE-OS-v0.5-BBYQ.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" \
            > reverse-os-evidence/signature.txt
          python3 - <<'PY'
          import zipfile,hashlib,json,os,subprocess,re
          apk="reverse-os-dist/REVERSE-OS-v0.5-BBYQ.apk"
          cmd=os.environ["ANDROID_HOME"]+"/build-tools/35.0.0/aapt"
          badging=subprocess.check_output([cmd,"dump","badging",apk],text=True)
          perms=subprocess.check_output([cmd,"dump","permissions",apk],text=True)
          assert "package: name='com.reversepc.os'" in badging,badging[:1000]
          assert "versionCode='5'" in badging,badging[:1000]
          assert "android.permission.INTERNET" in perms,perms
          assert "android.permission.READ_EXTERNAL_STORAGE" not in perms,perms
          assert "android.permission.WRITE_EXTERNAL_STORAGE" not in perms,perms
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for required in ("classes.dex","lib/arm64-v8a/libreverse_os.so",
                               "lib/x86_64/libreverse_os.so",
                               "assets/space.vert","assets/space.frag","assets/blit.frag",
                               "assets/bbyq/e006/learn.xi",
                               "assets/bbyq/e008/bank-store.xi",
                               "assets/bbyq/language/readline.xi",
                               "assets/bbyq/language/speak.xi",
                               "assets/bbyq/curriculum-v1.txt"):
                  assert required in names,required
          b=open(apk,"rb").read()
          obj={"package":"com.reversepc.os","bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),
               "offline_xi":True,"browser_host":"Android WebView","native_xi":True,"abis":["arm64-v8a","x86_64"]}
          open("reverse-os-evidence/apk.json","w").write(json.dumps(obj,indent=2)+"\n")
          print(json.dumps(obj))
          PY
      - name: Android 15 boots Welcome Mr Reverse, opens desktop, runs XI
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sudo chmod a+rw /dev/kvm
          export ANDROID_AVD_HOME="$(mktemp -d /tmp/reverse-os-avd.XXXXXX)"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force -n reverse-os-test -p "$ANDROID_AVD_HOME/reverse-os-test.avd" \
            -k 'system-images;android-35;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd reverse-os-test -no-window \
            -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -memory 2048 > reverse-os-evidence/emulator.log 2>&1 &
          EMU_PID=$!
          trap 'kill "$EMU_PID" 2>/dev/null || true' EXIT
          adb start-server
          ready=false
          for i in $(seq 1 115); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              ready=true;break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -100 reverse-os-evidence/emulator.log;exit 1
          fi
          adb shell input keyevent 82
          adb install -r reverse-os-dist/REVERSE-OS-v0.5-BBYQ.apk
          adb logcat -c
          adb shell am start -W -n com.reversepc.os/.BootActivity \
            | tee reverse-os-evidence/launch.txt
          # Capture the actual black screen (not a fabricated mock image).
          boot_seen=false
          for i in $(seq 1 25); do
            if adb logcat -d -s ReverseBoot:I '*:S' | grep -q 'WELCOME_SCREEN_SHOWN welcome.... REVERSE.'; then
              boot_seen=true;break
            fi
            sleep 0.12
          done
          test "$boot_seen" = true
          adb logcat -d -s ReverseBoot:I '*:S' > reverse-os-evidence/boot-log.txt
          sleep 1.10
          adb shell screencap -p /sdcard/reverse-os-boot.png
          adb exec-out cat /sdcard/reverse-os-boot.png > reverse-os-evidence/boot.png
          sleep 4
          adb shell uiautomator dump /sdcard/reverse-os-desktop.xml >/dev/null
          adb exec-out cat /sdcard/reverse-os-desktop.xml > reverse-os-evidence/desktop-ui.xml
          adb shell screencap -p /sdcard/reverse-os-desktop.png
          adb exec-out cat /sdcard/reverse-os-desktop.png > reverse-os-evidence/desktop.png
          # Check that the actual GLES3 shader changes pixels between frames.
          sleep 1.4
          adb shell screencap -p /sdcard/reverse-os-motion.png
          adb exec-out cat /sdcard/reverse-os-motion.png > reverse-os-evidence/motion.png
          adb logcat -d -s ReverseGPU:I '*:S' > reverse-os-evidence/gpu-fps.txt
          grep -q 'REVERSE_GPU_FPS fps=' reverse-os-evidence/gpu-fps.txt
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          a=Image.open("reverse-os-evidence/desktop.png").convert("RGB")
          b=Image.open("reverse-os-evidence/motion.png").convert("RGB")
          assert a.size==b.size,a.size
          assert a.width>a.height,("not landscape",a.size)
          # The center excludes the clock and most launchers: difference must
          # come from the GPU world, not from time labels or window updates.
          bounds=(int(a.width*.43),int(a.height*.15),
                  int(a.width*.76),int(a.height*.78))
          diff=ImageChops.difference(a.crop(bounds),b.crop(bounds))
          bbox=diff.getbbox()
          assert bbox is not None,"orbital wallpaper did not visibly animate"
          print("REVERSE_GPU_MOTION_PASS minimal_flat=true landscape="+str(a.size)+" center_changed=true")
          PY
          python3 - <<'PY'
          import re,subprocess,xml.etree.ElementTree as ET
          nodes=list(ET.parse("reverse-os-evidence/desktop-ui.xml").getroot().iter("node"))
          text=" ".join(n.attrib.get("text","") for n in nodes)
          required=("REVERSE","XI Studio","Terminal","Archivos","Ether Core","Navegador","Ajustes","BBY Q","INICIO")
          assert "REVERSE" in text and "INICIO" in text,text[:1800]
          if any(label not in text for label in required):
              subprocess.run(["adb","shell","input","swipe","160","465","160","208","400"],check=True)
              subprocess.run(["adb","shell","uiautomator","dump","/sdcard/reverse-os-scroll.xml"],
                             check=True,stdout=subprocess.DEVNULL)
              data=subprocess.check_output(["adb","exec-out","cat","/sdcard/reverse-os-scroll.xml"])
              text+=" "+" ".join(n.attrib.get("text","") for n in ET.fromstring(data).iter("node"))
              subprocess.run(["adb","shell","input","swipe","160","235","160","510","350"],check=True)
              subprocess.run(["adb","shell","uiautomator","dump","/sdcard/reverse-os-top.xml"],
                             check=True,stdout=subprocess.DEVNULL)
              fresh=subprocess.check_output(["adb","exec-out","cat","/sdcard/reverse-os-top.xml"])
              nodes=list(ET.fromstring(fresh).iter("node"))
          for label in required:
              assert label in text,(label,text[:1800])
          match=next(n for n in nodes if n.attrib.get("text")=="XI Studio")
          nums=[int(v) for v in re.findall(r"\d+",match.attrib["bounds"])]
          assert len(nums)==4
          subprocess.run(["adb","shell","input","tap",str((nums[0]+nums[2])//2),
                         str((nums[1]+nums[3])//2)],check=True)
          print("REVERSE_OS_DESKTOP_PASS landscape=true flat_ui=true launchers=7 start=true")
          PY
          sleep 3
          adb shell uiautomator dump /sdcard/reverse-os-studio.xml >/dev/null
          adb exec-out cat /sdcard/reverse-os-studio.xml > reverse-os-evidence/studio-ui.xml
          python3 - <<'PY'
          import re,subprocess,xml.etree.ElementTree as ET
          nodes=list(ET.parse("reverse-os-evidence/studio-ui.xml").getroot().iter("node"))
          text=" ".join(n.attrib.get("text","") for n in nodes)
          assert "XI Studio" in text,text[:2200]
          assert "01_euclides.xi" in text,text[:2200]
          match=next((n for n in nodes if "EJECUTAR" in n.attrib.get("text","")),None)
          assert match is not None,text[:2200]
          nums=[int(x) for x in re.findall(r"\d+",match.attrib["bounds"])]
          assert len(nums)==4
          subprocess.run(["adb","shell","input","tap",str((nums[0]+nums[2])//2),
                         str((nums[1]+nums[3])//2)],check=True)
          PY
          success=false
          for i in $(seq 1 35); do
            if adb logcat -d -s ReverseOS:I '*:S' | grep -q 'RUN_OK 01_euclides.xi'; then
              success=true;break
            fi
            sleep 2
          done
          if [[ "$success" != true ]]; then
            adb logcat -d > reverse-os-evidence/logcat.txt
            tail -100 reverse-os-evidence/logcat.txt
            echo 'Native XI program did not finish'
            exit 1
          fi
          adb shell uiautomator dump /sdcard/reverse-os-result.xml >/dev/null
          adb exec-out cat /sdcard/reverse-os-result.xml > reverse-os-evidence/result-ui.xml
          adb shell screencap -p /sdcard/reverse-os-result.png
          adb exec-out cat /sdcard/reverse-os-result.png > reverse-os-evidence/result.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          text=" ".join(n.attrib.get("text","") for n in ET.parse(
              "reverse-os-evidence/result-ui.xml").getroot().iter("node"))
          assert "r0 = 21" in text,text[:2200]
          assert "RVPC2 guardado" in text,text[:2200]
          print("REVERSE_OS_ANDROID_XI_PASS desktop_to_ether=true gcd=21 state=RVPC2")
          PY
          adb shell run-as com.reversepc.os ls -l files/session.rvp | tee reverse-os-evidence/state-file.txt
          # Real app has returned a correct result; verify the desktop survives
          # a back navigation and does not depend on JNI for first rendering.
          adb shell input keyevent 4
          sleep 2
          adb shell uiautomator dump /sdcard/reverse-os-return.xml >/dev/null
          adb exec-out cat /sdcard/reverse-os-return.xml > reverse-os-evidence/return-ui.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          content=" ".join(n.attrib.get("text","") for n in ET.parse(
              "reverse-os-evidence/return-ui.xml").getroot().iter("node"))
          assert "REVERSE" in content and "INICIO" in content,content[:1500]
          print("REVERSE_OS_HOME_RETURN_PASS window_close=true")
          PY
          adb logcat -d > reverse-os-evidence/logcat.txt
          if grep -E 'FATAL EXCEPTION' reverse-os-evidence/logcat.txt | grep -q 'com.reversepc.os'; then
            echo 'Application fatal error';exit 1
          fi
      - name: Publish APK, execution logs and screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REVERSE-OS-ANDROID-APK
          path: |
            reverse-os-dist/**
            reverse-os-evidence/**
          if-no-files-found: warn
          retention-days: 30
