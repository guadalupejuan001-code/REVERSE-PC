      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.s8.outcome == 'failure'
        with:
          name: reverse-c47-stage-8-diagnostics
          path: |-
            evidence/c47-8/*.json
            evidence/c47-8/*.txt
            evidence/c47-8/*.log
            evidence/c47-8/native/*.json
            evidence/c47-8/native/*.log
          if-no-files-found: warn
