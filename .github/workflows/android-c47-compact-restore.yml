name: Android C47 compact restore and authentic boot continuation
'on':
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/android-c47-compact-restore.yml
      - src/integration/snapshot_view_stream.hpp
      - tests/guest_checkpoint_view_test.cpp
      - docs/ANDROID_C47_COMPACT_RESTORE.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'perf/android-c47-compact-restore-view' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c29-tested-build
          run-id: 41151900393
          github-token: ${{ github.token }}
          path: pinned-build
      - name: Verify original model and unchanged CPU and decoder
        run: |
          set -euo pipefail
          mkdir -p evidence/c47-native build
          git diff --exit-code c4ac252cfce0ffbdca4c940d26ee2d0e401ff96c HEAD -- src/minimal_guest_simd.inc src/minimal_guest_system.inc src/arm_float.hpp src/integration/adaptive_override_map.hpp
          python3 - <<'PYCODE'
          import pathlib,subprocess
          def old(p):return subprocess.check_output(['git','show','c4ac252cfce0ffbdca4c940d26ee2d0e401ff96c:'+p]).decode()
          p='src/integration/inverse_memory_adaptive.inc'
          assert pathlib.Path(p).read_text().startswith(old(p))
          p='src/minimal_guest.hpp';a=old(p);b=pathlib.Path(p).read_text()
          start='  static MinimalGuest from_snapshot(';end='candidate.adaptive_snapshot_capacity_=adaptive_capacity; return candidate;\n  }'
          def decoder(t):i=t.index(start);return t[i:t.index(end,i)+len(end)]
          assert decoder(a)==decoder(b)
          PYCODE
          node --test tests/android_c46_continue.test.mjs tests/android_c42_zygote_progress.test.mjs tests/android_c40_recovery_evidence.test.mjs tests/android_c40_zygote_stage.test.mjs tests/android_framework_evidence.test.mjs tests/android_odsign_property_probe.test.mjs tests/android_c27_profile_resume.test.mjs tests/android_supervised_cycle.test.mjs tests/audit_gki_rvg.test.mjs > evidence/c47-native/host-tests.tap
          test "$(sha256sum pinned-build/tested-source.tar.gz | cut -d ' ' -f 1)" = 'c872d1d778d6931dbac5c81fbbb630fd2552ca9ff45577b148fc29e1bd84f201'
          tar --no-same-owner -xzf pinned-build/tested-source.tar.gz build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          rm -rf pinned-build
      - name: Verify legacy byte equality, transactional restore and UBSan
        run: |
          set -euo pipefail
          FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
          g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c47-test
          g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c47-ubsan
          build/c47-test build/c47-test-data > evidence/c47-native/round-trip.json
          build/c47-ubsan build/c47-ubsan-data > evidence/c47-native/ubsan.json
          g++ $FLAGS -O3 -DREVERSE_PC_COMPACT_RESTORE_VIEW=1 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -o evidence/c47-native/native
          g++ $FLAGS -O2 -DREVERSE_PC_COMPACT_RESTORE_VIEW=1 tools/guest_checkpoint_frame.cpp build/softfloat/libreverse_softfloat.a -o evidence/c47-native/frame
          g++ $FLAGS -O3 tools/guest_checkpoint_view_benchmark.cpp build/softfloat/libreverse_softfloat.a -o evidence/c47-native/restore-benchmark
          g++ $FLAGS -O2 tests/checkpoint_frame_fixture.cpp build/softfloat/libreverse_softfloat.a -o build/c47-frame-fixture
          REVERSE_CHECKPOINT_FRAME="$PWD/evidence/c47-native/frame" REVERSE_FRAME_FIXTURE="$PWD/build/c47-frame-fixture" node --test tests/checkpoint_frame_cli.mjs > evidence/c47-native/frame-protocol.tap
          evidence/c47-native/native --pins > evidence/c47-native/native-pins.json
          sha256sum evidence/c47-native/native evidence/c47-native/frame evidence/c47-native/restore-benchmark > evidence/c47-native/binary-sha256.txt
          g++ --version > evidence/c47-native/compiler.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c47-tested-native
          path: evidence/c47-native
          retention-days: 90
  android-continuation:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_C39_CHUNK: '200000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c47-tested-native
          path: native-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c46-tested-native
          run-id: 41909016074
          github-token: ${{ github.token }}
          path: reference-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c46-stage-4-verified-checkpoint
          run-id: 41909016074
          github-token: ${{ github.token }}
          path: source-c46
      - name: Authenticate the last clean C46 boundary and independent reference CPU
        run: |
          set -euo pipefail
          mkdir -p evidence/c47-source
          chmod +x native-build/native native-build/frame native-build/restore-benchmark reference-build/native
          test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = 'da728af1adfb5548db2ab9120ec37b72e2b74bf2b676b9e78bfeafbe70b0587a'
          node tools/android_c27_profile_resume.mjs preflight source-c46/output-contract.json source-c46 > evidence/c47-source/preflight.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('source-c46/output-contract.json')),r=JSON.parse(readFileSync('source-c46/current.json'));
          assert.equal(c.source_commit,'c4ac252cfce0ffbdca4c940d26ee2d0e401ff96c');
          assert.equal(c.checkpoint_sha256,'064ba023cffbb1bf7889e053ecea97435a9975d1781bd4c74bb0524b179f59c8');
          assert.equal(r.guest.instructions,27247785172);
          NODE
      - name: Measure real original runtime restoration with identical compact state
        run: |
          set -euo pipefail
          native-build/restore-benchmark legacy source-c46/current.rvg > evidence/c47-source/restore-legacy.json
          native-build/restore-benchmark view source-c46/current.rvg > evidence/c47-source/restore-view.json
          python3 - <<'PYCODE'
          import json
          a=json.load(open('evidence/c47-source/restore-legacy.json'));b=json.load(open('evidence/c47-source/restore-view.json'))
          assert a['round_trip_exact'] and b['round_trip_exact']
          assert a['memory_sha256']==b['memory_sha256'] and a['memory_overrides']==b['memory_overrides']
          assert b['peak_rss_kib']<a['peak_rss_kib']*0.75
          assert a['guest_instructions_executed']==b['guest_instructions_executed']==0
          PYCODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Restore the unchanged original Android disk
        run: |
          set -euo pipefail
          ORIGINAL=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$ORIGINAL"
          node tools/android_c27_media.mjs "$ORIGINAL" new-media > evidence/c47-source/media.json
          rm -rf disk-input
      - name: Compare one million real Android instructions against the original C46 decoder
        run: |
          set -euo pipefail
          node tools/android_c27_profile_resume.mjs run source-c46/output-contract.json source-c46 reference-build/native new-media/android-c27.raw evidence/c47-reference 180000 1000000 1 > evidence/c47-source/reference.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
          const r=await run(JSON.parse(readFileSync('source-c46/output-contract.json')),'source-c46','native-build/native','new-media/android-c27.raw','evidence/c47-differential',{wallMs:180000,instructions:1000000,cycles:1,maxTransportBytes:2147483648});
          console.log(JSON.stringify(r,null,2));if(r.process.status!=='process_completed'||!r.result?.execution_progress_accepted)process.exitCode=2;
          NODE
          cmp evidence/c47-reference/current.rvg evidence/c47-differential/current.rvg
          sha256sum evidence/c47-reference/current.rvg evidence/c47-differential/current.rvg > evidence/c47-source/differential-sha256.txt
          rm -rf evidence/c47-reference evidence/c47-differential reference-build
      - name: C47 stage 1 execute and verify the authentic Android machine
        id: s1
        if: success()
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          node tools/android_c46_continue.mjs source-c46 evidence/c47-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c46/c42-progress.json 250000000 2147483648 > evidence/c47-source/stage-1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.s1.outcome == 'success'
        with:
          name: reverse-c47-stage-1-verified-checkpoint
          path: |-
            evidence/c47-1/
            !evidence/c47-1/native/journal/**
            !evidence/c47-1/native/current.rvg
            !evidence/c47-1/native/frame.ppm
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.s1.outcome == 'failure'
        with:
          name: reverse-c47-stage-1-diagnostics
          path: |-
            evidence/c47-1/*.json
            evidence/c47-1/*.txt
            evidence/c47-1/*.log
            evidence/c47-1/native/*.json
            evidence/c47-1/native/*.log
          if-no-files-found: warn
          retention-days: 90
      - name: C47 stage 2 execute and verify the authentic Android machine
        id: s2
        if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.boot != 'true'
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          node tools/android_c46_continue.mjs evidence/c47-1 evidence/c47-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c47-1/c42-progress.json 1000000000 2147483648 > evidence/c47-source/stage-2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.s2.outcome == 'success'
        with:
          name: reverse-c47-stage-2-verified-checkpoint
          path: |-
            evidence/c47-2/
            !evidence/c47-2/native/journal/**
            !evidence/c47-2/native/current.rvg
            !evidence/c47-2/native/frame.ppm
          if-no-files-found: error
          retention-days: 90
      - name: Release the previously uploaded temporary stage
        if: steps.s2.outcome == 'success'
        run: rm -rf evidence/c47-1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.s2.outcome == 'failure'
        with:
          name: reverse-c47-stage-2-diagnostics
          path: |-
            evidence/c47-2/*.json
            evidence/c47-2/*.txt
            evidence/c47-2/*.log
            evidence/c47-2/native/*.json
            evidence/c47-2/native/*.log
          if-no-files-found: warn
          retention-days: 90
      - name: C47 stage 3 execute and verify the authentic Android machine
        id: s3
        if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.boot != 'true'
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          node tools/android_c46_continue.mjs evidence/c47-2 evidence/c47-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c47-2/c42-progress.json 1000000000 2147483648 > evidence/c47-source/stage-3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.s3.outcome == 'success'
        with:
          name: reverse-c47-stage-3-verified-checkpoint
          path: |-
            evidence/c47-3/
            !evidence/c47-3/native/journal/**
            !evidence/c47-3/native/current.rvg
            !evidence/c47-3/native/frame.ppm
