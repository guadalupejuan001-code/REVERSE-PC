          node tools/android_c46_continue.mjs evidence/c47-4 evidence/c47-5 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c47-4/c42-progress.json 1000000000 2147483648 > evidence/c47-source/stage-5.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.s5.outcome == 'success'
        with:
          name: reverse-c47-stage-5-verified-checkpoint
