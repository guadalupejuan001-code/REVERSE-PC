            !evidence/c47-4/native/current.rvg
            !evidence/c47-4/native/frame.ppm
          if-no-files-found: error
          retention-days: 90
      - name: Release the previously uploaded temporary stage
        if: steps.s4.outcome == 'success'
        run: rm -rf evidence/c47-3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.s4.outcome == 'failure'
        with:
