name: Laplace - preparar ajustes finales Android
on:
  push:
    branches: [integrate/laplace-m001-next-apk-20261030]
    paths: [.github/workflows/laplace-finalize-once.yml]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar parche, procedencia y paridad
        run: |
          set -euo pipefail
          echo '267dd90f557067fe7b5f1c2dbf58ff08d9a625a4d213cfbb48774807dae72a7f  .github/laplace-final.patch' | sha256sum -c -
          git apply --check .github/laplace-final.patch
          git apply --index .github/laplace-final.patch
          node laplace-android/prepare.mjs --check
          node laplace-android/verify.mjs
          node --test laplace-android/tests/modelo.test.mjs
          git rm .github/laplace-final.patch .github/workflows/laplace-finalize-once.yml
      - name: Preparar únicamente blobs comprobados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY,parent=process.env.GITHUB_SHA;
          if(repo!=='guadalupejuan001-code/REVERSE-PC'||process.env.GITHUB_REF!=='refs/heads/integrate/laplace-m001-next-apk-20261030')throw Error('Rama incorrecta');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',stdio:['pipe','pipe','pipe']});
          const names=git('diff','--cached','--name-only','-z').split('\0').filter(Boolean);
          const allowed=new Set(['.github/laplace-final.patch','.github/workflows/laplace-finalize-once.yml','.github/workflows/workbench-android.yml','laplace-android/integration-lock.json','reverse-os-android/app/src/main/java/com/reversepc/os/LaplaceActivity.java','reverse-os-android/app/src/androidTest/java/com/reversepc/os/WorkbenchTestRunner.java']);
          if(names.length!==6||names.some(p=>!allowed.has(p)))throw Error('Rutas inesperadas');
          const tree=[];
          for(const path of names){
            let content;try{content=git('show',':'+path)}catch{tree.push({path,mode:'100644',type:'blob',sha:null});continue}
            const r=await fetch('https://api.github.com/repos/'+repo+'/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content,encoding:'utf-8'})});
            const b=await r.json();if(!r.ok)throw Error(r.status+' '+JSON.stringify(b));
            if(b.sha!==git('rev-parse',':'+path).trim())throw Error('Blob diferente al verificado');
            tree.push({path,mode:'100644',type:'blob',sha:b.sha});
          }
          const report={parent,base_tree:git('rev-parse','HEAD^{tree}').trim(),tree,branch_moved:false};
          writeFileSync('laplace-final-blobs.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laplace-final-blobs
          path: laplace-final-blobs.json
          retention-days: 7
          if-no-files-found: warn
