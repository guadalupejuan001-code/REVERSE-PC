name: Reverse PC two-program contract
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent programs and transactional state
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible example
        run: |
          python -m src.reverse_pc > /tmp/reverse-pc-result.json
          diff -u examples/two_programs_result.json /tmp/reverse-pc-result.json
