name: Android C59 vector integral rounding and authentic boot continuation
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c59-frint-continue.yml
    - src/minimal_guest_simd.inc
    - tests/minimal_guest_frint_vector_test.cpp
    - docs/ANDROID_C59_VECTOR_FRINT_CONTINUATION.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c59-vector-frint' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Verify exact CPU scope and build the pinned original model
      run: 'set -euo pipefail

        mkdir -p evidence/c59-native build

        git diff --exit-code 31a6d9ab0755dca4989ad7efd79bb2f6a3468ef2 HEAD -- src scripts patches third_party tools
        '':(exclude)src/minimal_guest_simd.inc''

        python3 - <<''PYCODE''

        import pathlib,subprocess

        p=''src/minimal_guest_simd.inc'';old=subprocess.check_output([''git'',''show'',''31a6d9ab0755dca4989ad7efd79bb2f6a3468ef2:''+p]).decode();new=pathlib.Path(p).read_text();a=new.index(''  const
        auto vector_round='');b=new.index(''  const bool fp_zero_scalar='',a);assert new[:a]+new[b:]==old

        PYCODE

        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat

        python3 scripts/build-softfloat.py

        '
    - name: Verify all vector FRINT modes, exact flags, UBSan and existing arithmetic/system/codec behavior
      run: "set -euo pipefail\nFLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat\
        \ -Ideps/mundo-x/native/include -Isrc -Itools'\nfor item in frint_vector fmul_element fp_zero fabd gpr_fixed\
        \ scalar_compare fpint_fixed fpint_vector intfp_vector fcvtzs_scalar fp fmla_element system; do\n g++ $FLAGS\
        \ -O2 tests/minimal_guest_${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c59-$item\n build/c59-$item\
        \ > evidence/c59-native/$item.json\ndone\ng++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all\
        \ tests/minimal_guest_frint_vector_test.cpp build/softfloat/libreverse_softfloat.a -o build/c59-fpint-ubsan\n\
        build/c59-fpint-ubsan > evidence/c59-native/ubsan.json\ng++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp\
        \ build/softfloat/libreverse_softfloat.a -o build/c59-view\nbuild/c59-view build/c59-view-data > evidence/c59-native/original-decoder.json\n\
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'\ng++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp\
        \ build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c59-native/native\nevidence/c59-native/native\
        \ --pins > evidence/c59-native/native-pins.json\nsha256sum evidence/c59-native/native > evidence/c59-native/binary-sha256.txt\n\
        g++ --version > evidence/c59-native/compiler.txt\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c59-tested-native
        path: evidence/c59-native
        retention-days: 90
  arm-hardware:
    if: github.event.pull_request.head.ref == 'fix/android-c59-vector-frint' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Compare actual AArch64 encodings, IEEE results and cumulative flags
      run: 'set -euo pipefail

        test "$(uname -m)" = aarch64

        mkdir -p evidence/c59-arm

        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat

        python3 scripts/build-softfloat.py

        g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include
        -Isrc tests/minimal_guest_frint_vector_test.cpp build/softfloat/libreverse_softfloat.a -o build/c59-arm

        build/c59-arm > evidence/c59-arm/hardware.json

        python3 - <<''PY''

        import json

        r=json.load(open(''evidence/c59-arm/hardware.json''))

        assert r[''native_hardware_cases'']>100000

        PY

        uname -a > evidence/c59-arm/machine.txt

        g++ --version > evidence/c59-arm/compiler.txt

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c59-arm-hardware
        path: evidence/c59-arm
        retention-days: 90
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c59-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c58-tested-native
        run-id: 41953104096
        github-token: ${{ github.token }}
        path: reference-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c58-stage-1-verified-checkpoint
        run-id: 41953104096
        github-token: ${{ github.token }}
        path: source-c58
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: original-decoder
    - name: Authenticate the clean C58 source, reference CPU and original strict decoder
      run: 'set -euo pipefail

        mkdir -p evidence/c59-source

        cp original-decoder/frame native-build/frame

        chmod +x native-build/native native-build/frame reference-build/native

        test "$(sha256sum native-build/frame | cut -d '' '' -f 1)" = ''4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19''

        test "$(sha256sum reference-build/native | cut -d '' '' -f 1)" = ''d3888254534ddd598f89e52c7a99fcf55dcbd0831e034291e011de197e0f587b''

        node --input-type=module <<''NODE''

        import assert from ''node:assert/strict'';import {readFileSync,writeFileSync} from ''node:fs'';import {preflight}
        from ''./tools/android_c27_profile_resume.mjs'';

        const c=JSON.parse(readFileSync(''source-c58/output-contract.json'')),p=preflight(c,''source-c58'',{maxTransportBytes:2147483648});assert.equal(c.source_commit,''31a6d9ab0755dca4989ad7efd79bb2f6a3468ef2'');assert.equal(c.checkpoint_sha256,''d41fbb31f9c1fae19c75bae7a411e53c4a41ca3568d3991d1015fda4fb541bc2'');assert.equal(p.report.guest.instructions,28563139498);writeFileSync(''evidence/c59-source/preflight.json'',JSON.stringify(c,null,2)+''\n'');

        NODE

        '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: "set -euo pipefail\npython3 - <<'PYCODE'\nimport pathlib,json,hashlib\nroot=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert\
        \ m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert\
        \ [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']\nfor r in m['parts']:\n\
        \ p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()\n with p.open('rb') as f:\n  for\
        \ b in iter(lambda:f.read(1024*1024),b''):h.update(b)\n assert h.hexdigest()==r['sha256']\nPYCODE\nmkdir\
        \ new-media\ncat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc >\
        \ new-media/android-c27.raw\ntest \"$(stat -c %s new-media/android-c27.raw)\" = 10888413184\ntest \"$(sha256sum\
        \ new-media/android-c27.raw | cut -d ' ' -f 1)\" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'\n\
        cp media-input/media.json evidence/c59-source/media.json\ncp media-input/manifest.json evidence/c59-source/media-transport.json\n\
        rm -rf media-input\nfallocate --dig-holes new-media/android-c27.raw\ntest \"$(sha256sum new-media/android-c27.raw\
        \ | cut -d ' ' -f 1)\" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'\n"
    - name: Independently replay the original C58 CPU to the clean pre-FRINT boundary
      run: 'set -euo pipefail

        node --input-type=module <<''NODE''

        import assert from ''node:assert/strict'';import {readFileSync,writeFileSync} from ''node:fs'';import {run}
        from ''./tools/android_c27_profile_resume.mjs'';

        const r=await run(JSON.parse(readFileSync(''source-c58/output-contract.json'')),''source-c58'',''reference-build/native'',''new-media/android-c27.raw'',''evidence/c59-reference'',{wallMs:180000,instructions:37,cycles:1,maxTransportBytes:2147483648});assert.equal(r.process.status,''process_completed'');assert.equal(r.result.execution_progress_accepted,true);assert.equal(r.result.checkpoint_sha256,''5c7edc0bb20c15148b128b364e5203785fc91dc5396981f66ab88f7cbab853d9'');writeFileSync(''evidence/c59-source/reference.json'',JSON.stringify(r,null,2)+''\n'');

        NODE

        '
    - name: C59 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: 'set -euo pipefail

        COMMIT=$(git rev-parse HEAD)

        node tools/android_c46_continue.mjs source-c58 evidence/c59-1 native-build/native new-media/android-c27.raw
        native-build/frame "$COMMIT" source-c58/c42-progress.json 37 2147483648 > evidence/c59-source/stage-1.json

        cmp evidence/c59-reference/current.rvg evidence/c59-1/current.rvg

        node --input-type=module <<''NODE''

        import assert from ''node:assert/strict'';import {readFileSync} from ''node:fs'';const r=JSON.parse(readFileSync(''evidence/c59-1/current.json''));assert.equal(r.guest.instructions,28563139535);assert.equal(r.error,'''');assert.equal(r.checkpoint_sha256,''5c7edc0bb20c15148b128b364e5203785fc91dc5396981f66ab88f7cbab853d9'');

        NODE

        rm -rf evidence/c59-reference reference-build

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c59-stage-1-verified-checkpoint
        path: 'evidence/c59-1/

          !evidence/c59-1/native/journal/**

          !evidence/c59-1/native/current.rvg

          !evidence/c59-1/native/frame.ppm'
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c59-stage-1-diagnostics
        path: 'evidence/c59-1/*.json

          evidence/c59-1/*.txt

          evidence/c59-1/*.log

          evidence/c59-1/native/*.json

          evidence/c59-1/native/*.log'
        if-no-files-found: warn
        retention-days: 90
    - name: C59 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.visual != 'true'
      run: "set -euo pipefail\nCOMMIT=$(git rev-parse HEAD)\nnode tools/android_c46_continue.mjs evidence/c59-1\
        \ evidence/c59-2 native-build/native new-media/android-c27.raw native-build/frame \"$COMMIT\" evidence/c59-1/c42-progress.json\
        \ 1 2147483648 > evidence/c59-source/stage-2.json\npython3 - <<'PYCODE'\nimport json,struct,mmap,pathlib\n\
        before=pathlib.Path('evidence/c59-1/current.rvg');after=pathlib.Path('evidence/c59-2/current.rvg');r=json.load(open('evidence/c59-2/current.json'))\n\
        assert r['guest']['instructions']==28563139536 and r['guest']['pc']=='0x725e86cf50' and not r['error']\n\
        with before.open('rb') as fa,after.open('rb') as fb:\n with mmap.mmap(fa.fileno(),0,access=mmap.ACCESS_READ)\
        \ as aa,mmap.mmap(fb.fileno(),0,access=mmap.ACCESS_READ) as bb:\n  u=lambda data,at:struct.unpack_from('<Q',data,at)[0]\n\
        \  assert len(aa)==len(bb) and aa[:8]==bb[:8]==b'RVG3\\r\\n\\x1a\\n'\n  assert u(aa,24)==0x725e86cf4c and\
        \ u(bb,24)==0x725e86cf50\n  assert u(aa,40)==28563139535 and u(bb,40)==28563139536\n  sizes=[u(aa,o) for\
        \ o in (320,328,336,344,352)];assert sizes==[u(bb,o) for o in (320,328,336,344,352)]\n  fp_at=len(aa)-8-sizes[4];mask=struct.unpack_from('<I',aa,fp_at+16)[0]\n\
        \  def lane(data,reg):\n   if not mask&(1<<reg):return (0,0)\n   off=fp_at+20+(mask&((1<<reg)-1)).bit_count()*16\n\
        \   return (u(data,off),u(data,off+8))\n  assert lane(aa,1)==lane(bb,1)==(0,0)\n  assert struct.unpack_from('<II',aa,fp_at+8)==struct.unpack_from('<II',bb,fp_at+8)==(0,16)\n\
        \  counter_at=fp_at-8;assert u(aa,counter_at)==18 and u(bb,counter_at)==19\n  excluded=[(24,32),(40,48),(counter_at,counter_at+8),(len(aa)-8,len(aa))];at=0\n\
        \  for start,end in sorted(excluded):\n   for pos in range(at,start,1048576):assert aa[pos:min(pos+1048576,start)]==bb[pos:min(pos+1048576,start)],str(pos)\n\
        \   at=end\n  assert at==len(aa)\nproof={'opcode':'0x0e219821','source_and_result_v1':['0x0','0x0'],'instructions':28563139536,'pc':'0x725e86cf50','counter_subtick_before':18,'counter_subtick_after':19,'all_other_bytes_unchanged_except_final_checksum':True,'checkpoint_sha256':r['checkpoint_sha256']}\n\
        pathlib.Path('evidence/c59-source/vector-frint-crossing.json').write_text(json.dumps(proof,indent=2)+'\\\
        n')\nPYCODE\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c59-stage-2-verified-checkpoint
        path: 'evidence/c59-2/

          !evidence/c59-2/native/journal/**

          !evidence/c59-2/native/current.rvg

          !evidence/c59-2/native/frame.ppm'
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: rm -rf evidence/c59-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c59-stage-2-diagnostics
        path: 'evidence/c59-2/*.json

          evidence/c59-2/*.txt

          evidence/c59-2/*.log

          evidence/c59-2/native/*.json

          evidence/c59-2/native/*.log'
        if-no-files-found: warn
        retention-days: 90
    - name: C59 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.visual != 'true'
      run: 'set -euo pipefail

        COMMIT=$(git rev-parse HEAD)

        node tools/android_c46_continue.mjs evidence/c59-2 evidence/c59-3 native-build/native new-media/android-c27.raw
        native-build/frame "$COMMIT" evidence/c59-2/c42-progress.json 1000000 2147483648 > evidence/c59-source/stage-3.json

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c59-stage-3-verified-checkpoint
        path: 'evidence/c59-3/

          !evidence/c59-3/native/journal/**

          !evidence/c59-3/native/current.rvg

          !evidence/c59-3/native/frame.ppm'
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: rm -rf evidence/c59-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c59-stage-3-diagnostics
        path: 'evidence/c59-3/*.json

          evidence/c59-3/*.txt

          evidence/c59-3/*.log

          evidence/c59-3/native/*.json

          evidence/c59-3/native/*.log'
        if-no-files-found: warn
        retention-days: 90
    - name: C59 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.visual != 'true'
      run: 'set -euo pipefail

        COMMIT=$(git rev-parse HEAD)

        node tools/android_c46_continue.mjs evidence/c59-3 evidence/c59-4 native-build/native new-media/android-c27.raw
        native-build/frame "$COMMIT" evidence/c59-3/c42-progress.json 1000000000 2147483648 > evidence/c59-source/stage-4.json

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s4.outcome == 'success'
      with:
        name: reverse-c59-stage-4-verified-checkpoint
        path: 'evidence/c59-4/

          !evidence/c59-4/native/journal/**

          !evidence/c59-4/native/current.rvg

          !evidence/c59-4/native/frame.ppm'
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s4.outcome == 'success'
      run: rm -rf evidence/c59-3
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s4.outcome == 'failure'
      with:
        name: reverse-c59-stage-4-diagnostics
        path: 'evidence/c59-4/*.json

          evidence/c59-4/*.txt

          evidence/c59-4/*.log

          evidence/c59-4/native/*.json

          evidence/c59-4/native/*.log'
        if-no-files-found: warn
        retention-days: 90
    - name: C59 stage 5 execute and verify the authentic Android machine
      id: s5
      if: success() && steps.s4.outcome == 'success' && steps.s4.outputs.visual != 'true'
      run: 'set -euo pipefail

        COMMIT=$(git rev-parse HEAD)

        node tools/android_c46_continue.mjs evidence/c59-4 evidence/c59-5 native-build/native new-media/android-c27.raw
        native-build/frame "$COMMIT" evidence/c59-4/c42-progress.json 1000000000 2147483648 > evidence/c59-source/stage-5.json

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s5.outcome == 'success'
      with:
        name: reverse-c59-stage-5-verified-checkpoint
        path: 'evidence/c59-5/

          !evidence/c59-5/native/journal/**

          !evidence/c59-5/native/current.rvg

          !evidence/c59-5/native/frame.ppm'
        if-no-files-found: error
        retention-days: 90
    - name: Release the previously uploaded temporary stage
      if: steps.s5.outcome == 'success'
      run: rm -rf evidence/c59-4
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s5.outcome == 'failure'
      with:
        name: reverse-c59-stage-5-diagnostics
        path: 'evidence/c59-5/*.json

          evidence/c59-5/*.txt

          evidence/c59-5/*.log

          evidence/c59-5/native/*.json

          evidence/c59-5/native/*.log'
        if-no-files-found: warn
        retention-days: 90
