name: REVERSE authentic same-build AOSP ARM64 boot partition extraction
on:
  pull_request:
    paths:
      - '.github/workflows/aosp-cuttlefish-selective.yml'
      - 'tools/aosp_cuttlefish_zip_probe.mjs'
      - 'tests/aosp_cuttlefish_zip_probe.test.mjs'
      - 'tools/aosp_boot_preflight.mjs'
      - 'tools/aosp_ramdisk_preflight.mjs'
      - 'tests/aosp_ramdisk_preflight.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Host-side ZIP bounds, malicious-input and CRC32 regression
        run: |
          set -euo pipefail
          mkdir -p evidence input
          node --test tests/aosp_cuttlefish_zip_probe.test.mjs | tee evidence/zip-regression.tap
          node --test tests/aosp_boot_preflight.test.mjs | tee evidence/aosp-boot-regression.tap
          node --test tests/aosp_ramdisk_preflight.test.mjs | tee evidence/ramdisk-regression.tap
      - name: Read official exact-build ZIP central directory without full download
        run: |
          set -euo pipefail
          node tools/aosp_cuttlefish_zip_probe.mjs list > evidence/zip-index.json
          jq -e '.status=="official_archive_index_verified" and
            .build_id=="16644040" and .archive_size==1101174958 and
            (.selected_boot_members|sort)==(["boot.img","init_boot.img","vendor_boot.img"]|sort) and
            .android_guest_boot==false' evidence/zip-index.json
          jq '{archive_size,central_directory_bytes,selected_boot_members,
            archive_members:[.archive_members[]|{name,compressed,uncompressed,method}]}' \
            evidence/zip-index.json
      - name: Download and verify only selected official Cuttlefish boot partitions
        run: |
          set -euo pipefail
          node tools/aosp_cuttlefish_zip_probe.mjs extract --out-dir input/cf-boot \
            > evidence/extraction-report.json
          jq -e '.status=="official_boot_partitions_verified" and
            .build_id=="16644040" and
            .extracted["boot.img"].size>1024 and
            .extracted["init_boot.img"].size>1024 and
            .extracted["vendor_boot.img"].size>1024 and
            .android_init_observed==false' evidence/extraction-report.json
          sha256sum input/cf-boot/boot.img input/cf-boot/init_boot.img \
            input/cf-boot/vendor_boot.img > evidence/extracted-boot-shas.txt
      - name: Inspect same-build Android GKI and generic/vendor ramdisks without executing
        run: |
          set -euo pipefail
          node tools/aosp_boot_preflight.mjs \
            --boot input/cf-boot/boot.img \
            --init-boot input/cf-boot/init_boot.img \
            --vendor-boot input/cf-boot/vendor_boot.img \
            --extract-dir input/cf-parts \
            > evidence/android-boot-manifest.json
          jq -e '.status=="layout_only" and
            .boot.arm64_image_magic==true and
            .generic_ramdisk_from=="init_boot" and
            .android_boot==false and .adb==false and .wild_rift==false' \
            evidence/android-boot-manifest.json
          sha256sum input/cf-parts/*bin > evidence/partition-segment-shas.txt
          node --input-type=module <<'NODE' > evidence/ramdisk-format.json
          import {readFileSync,statSync} from 'node:fs';
          const rd=readFileSync('input/cf-parts/generic_ramdisk.bin');
          const magic=rd.subarray(0,16).toString('hex');
          const compression=rd.subarray(0,4).equals(Buffer.from('04224d18','hex'))?'lz4-frame':
            rd.subarray(0,4).equals(Buffer.from('02214c18','hex'))?'lz4-legacy':
            rd.subarray(0,2).equals(Buffer.from('1f8b','hex'))?'gzip':
            rd.subarray(0,6).toString()==='070701'?'newc-cpio':'unknown';
          console.log(JSON.stringify({
            source:'verified same-build generic init_boot ramdisk',
            compressed_bytes:rd.length,magic,compression,
            android_init_found:false,
            note:'Compression recognition alone cannot demonstrate /init or Android execution'
          },null,2));
          NODE
          {
            echo '## Same-build official Cuttlefish ARM64 artifact preflight'
            echo ''
            echo 'Build 16644040; selected ZIP entries only; every ZIP member CRC32 checked.'
            echo 'No system/vendor super.img mounted or included; no Android boot/ADB.'
            echo ''
            jq '{boot,init_boot,vendor_boot,generic_ramdisk_from,pending}' \
              evidence/android-boot-manifest.json
            cat evidence/ramdisk-format.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify real LZ4 legacy newc and original AOSP init ELF with independent cpio/readelf oracles
        run: |
          set -euo pipefail
          node tools/aosp_ramdisk_preflight.mjs input/cf-parts/generic_ramdisk.bin \
            --out-cpio input/generic.cpio > evidence/first-stage-init.json
          jq -e '.status=="genuine_arm64_android_init_found_not_executed" and
            .init_size>64 and .file_count>0 and .init_elf_machine==183 and
            .android_init_executed==false and .adb==false' evidence/first-stage-init.json
          cpio --quiet -it < input/generic.cpio > evidence/independent-cpio-list.txt
          grep -Eq '^\./?init$|^init        with:
          name: aosp-cuttlefish-arm64-boot-manifest-evidence
          path: |
            evidence/zip-index.json
            evidence/extraction-report.json
            evidence/android-boot-manifest.json
            evidence/ramdisk-format.json
            evidence/first-stage-init.json
            evidence/independent-init-readelf.txt
            evidence/*.txt
            evidence/*.tap
          retention-days: 14
 evidence/independent-cpio-list.txt
          cpio --quiet --to-stdout -i init < input/generic.cpio > input/init-oracle.elf
          if test ! -s input/init-oracle.elf; then
            cpio --quiet --to-stdout -i ./init < input/generic.cpio > input/init-oracle.elf
          fi
          test -s input/init-oracle.elf
          readelf -h input/init-oracle.elf > evidence/independent-init-readelf.txt
          grep -q 'AArch64' evidence/independent-init-readelf.txt
          checksum=$(sha256sum input/init-oracle.elf | cut -d' ' -f1)
          jq --arg sha "$checksum" -e '.init_sha256==$sha' evidence/first-stage-init.json
          {
            echo ''
            echo '## Authentic AOSP first-stage /init (read-only file verification)'
            echo ''
            jq '{status,init_path,init_size,init_sha256,init_elf_type,
              decompressed_newc_bytes,file_count,android_init_executed,adb}' \
              evidence/first-stage-init.json
            echo 'Independent cpio extraction/readelf agrees with the newc/LZ4 host inspector.'
            echo 'No /init guest execution or ADB validation is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-cuttlefish-arm64-boot-manifest-evidence
          path: |
            evidence/zip-index.json
            evidence/extraction-report.json
            evidence/android-boot-manifest.json
            evidence/ramdisk-format.json
            evidence/*.txt
            evidence/*.tap
          retention-days: 14
