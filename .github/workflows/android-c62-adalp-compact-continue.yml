name: Android C62 pairwise long accumulation and live Zygote identity
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c62-adalp-compact-continue.yml
    - CMakeLists.txt
    - src/minimal_guest_simd.inc
    - tests/minimal_guest_adalp_test.cpp
    - tests/android_c62_zygote_main_identity.test.mjs
    - tests/fixtures/c62-zygote-main-observation.json
    - docs/ANDROID_C62_ADALP_COMPACT.md
    - tools/android_framework_evidence.mjs
    - tools/android_kernel_observer.mjs
    - tools/android_live_property.mjs
    - tools/android_c40_zygote_stage.mjs
    - tools/android_c42_zygote_progress.mjs
    - tools/android_c27_sequence.mjs
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c62-adalp-compact' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c62-native build
        git diff --exit-code b152a8017ae9995fe89ef7c4c6063400876cbd7e HEAD -- src scripts patches third_party tools ':(exclude)src/minimal_guest_simd.inc' ':(exclude)tools/android_framework_evidence.mjs' ':(exclude)tools/android_kernel_observer.mjs' ':(exclude)tools/android_live_property.mjs' ':(exclude)tools/android_c40_zygote_stage.mjs' ':(exclude)tools/android_c42_zygote_progress.mjs' ':(exclude)tools/android_c27_sequence.mjs'
        python3 - <<'PYCODE'
        import pathlib,subprocess
        p='src/minimal_guest_simd.inc';old=subprocess.check_output(['git','show','b152a8017ae9995fe89ef7c4c6063400876cbd7e:'+p]).decode();new=pathlib.Path(p).read_text()
        a=new.index('  const auto pairwise_long=');b=new.index('  if(shift_immediate&&',a);oa=old.index('  if((i&0x9f3ffc00u)==0x0e202800u)');ob=old.index('  if(shift_immediate&&',oa);assert new[:a]==old[:oa] and new[b:]==old[ob:]
        PYCODE
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify ADALP, original pairwise neighbors, UBSan, strong live process identity and unchanged boot gates
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        for item in adalp shll fp; do
         g++ $FLAGS -O2 tests/minimal_guest_${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c62-$item
         build/c62-$item > evidence/c62-native/$item.json
        done
        g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/minimal_guest_adalp_test.cpp build/softfloat/libreverse_softfloat.a -o build/c62-fpint-ubsan
        build/c62-fpint-ubsan > evidence/c62-native/ubsan.json
        g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c62-view
        build/c62-view build/c62-view-data > evidence/c62-native/original-decoder.json
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c62-native/native
        evidence/c62-native/native --pins > evidence/c62-native/native-pins.json
        sha256sum evidence/c62-native/native > evidence/c62-native/binary-sha256.txt
        g++ --version > evidence/c62-native/compiler.txt
        node --test tests/android_c62_zygote_main_identity.test.mjs tests/android_framework_evidence.test.mjs tests/android_c40_zygote_stage.test.mjs tests/android_c42_zygote_progress.test.mjs tests/android_live_property.test.mjs tests/android_c46_continue.test.mjs > evidence/c62-native/observer-tests.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c62-tested-native
        path: evidence/c62-native
        retention-days: 90
        compression-level: 1
  arm-hardware:
    if: github.event.pull_request.head.ref == 'fix/android-c62-adalp-compact' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Compare actual SADALP and UADALP encodings, all registers and modular results on physical ARM
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        mkdir -p evidence/c62-arm
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
        g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tests/minimal_guest_adalp_test.cpp build/softfloat/libreverse_softfloat.a -o build/c62-arm
        build/c62-arm > evidence/c62-arm/hardware.json
        python3 - <<'PY'
        import json
        r=json.load(open('evidence/c62-arm/hardware.json'))
        assert r['native_hardware_cases']>=36864
        PY
        uname -a > evidence/c62-arm/machine.txt
        g++ --version > evidence/c62-arm/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c62-arm-hardware
        path: evidence/c62-arm
        retention-days: 90
        compression-level: 1
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c62-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c61-tested-native
        run-id: 41964365931
        github-token: ${{ github.token }}
        path: reference-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c61-stage-3-verified-checkpoint
        run-id: 41964365931
        github-token: ${{ github.token }}
        path: source-c61
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: original-decoder
    - name: Authenticate the clean C61 source, original reference CPU and unchanged decoder
      run: |
        set -euo pipefail
        mkdir -p evidence/c62-source
        cp original-decoder/frame native-build/frame
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum native-build/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = '61fd4545c7767b58faf7f4a92e96b82b87168c0daae3ca7e5726874ac17ea0e4'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c61/output-contract.json')),p=preflight(c,'source-c61',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'b152a8017ae9995fe89ef7c4c6063400876cbd7e');assert.equal(c.checkpoint_sha256,'e7e1ea8c81e944f2bedea3b25122c0403550053c9b277c1dd519b5ac53f79702');assert.equal(p.report.guest.instructions,32664139584);writeFileSync('evidence/c62-source/preflight.json',JSON.stringify(c,null,2)+'\n');
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c62-source/media.json
        cp media-input/manifest.json evidence/c62-source/media-transport.json
        rm -rf media-input
        fallocate --dig-holes new-media/android-c27.raw
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
    - name: Independently replay the original C61 CPU to the clean pre-UADALP boundary
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        const r=await run(JSON.parse(readFileSync('source-c61/output-contract.json')),'source-c61','reference-build/native','new-media/android-c27.raw','evidence/c62-reference',{wallMs:180000,instructions:42873789,cycles:1,maxTransportBytes:2147483648});assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(r.result.checkpoint_sha256,'83cb4c781ef5ce738bfb603ae92cc259913f413f0ede8df76679beeda462fa22');writeFileSync('evidence/c62-source/reference.json',JSON.stringify(r,null,2)+'\n');
        NODE
    - name: C62 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c61 evidence/c62-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c61/c42-progress.json 42873789 2147483648 > evidence/c62-source/stage-1.json
        cmp evidence/c62-reference/current.rvg evidence/c62-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c62-1/current.json'));assert.equal(r.guest.instructions,32707013373);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'83cb4c781ef5ce738bfb603ae92cc259913f413f0ede8df76679beeda462fa22');
        NODE
        rm -rf evidence/c62-reference reference-build
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const p=JSON.parse(readFileSync('evidence/c62-1/c42-progress.json'));assert.equal(p.zygote_pid,567);assert.equal(p.zygote_comm,'main');assert.equal(p.android_boot_completed_verified,false);
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c62-stage-1-verified-checkpoint
        path: |-
          evidence/c62-1/
          !evidence/c62-1/native/journal/**
          !evidence/c62-1/native/current.rvg
          !evidence/c62-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c62-stage-1-diagnostics
        path: |-
          evidence/c62-1/*.json
          evidence/c62-1/*.txt
          evidence/c62-1/*.log
          evidence/c62-1/native/*.json
          evidence/c62-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C62 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c62-1 evidence/c62-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c62-1/c42-progress.json 1 2147483648 > evidence/c62-source/stage-2.json
        python3 - <<'PYCODE'
        import json,struct,mmap,pathlib
        before=pathlib.Path('evidence/c62-1/current.rvg');after=pathlib.Path('evidence/c62-2/current.rvg');r=json.load(open('evidence/c62-2/current.json'))
        assert r['guest']['instructions']==32707013374 and r['guest']['pc']=='0x70f4851188' and not r['error']
        with before.open('rb') as fa,after.open('rb') as fb:
         with mmap.mmap(fa.fileno(),0,access=mmap.ACCESS_READ) as aa,mmap.mmap(fb.fileno(),0,access=mmap.ACCESS_READ) as bb:
          assert len(aa)==len(bb);u=lambda data,at:struct.unpack_from('<Q',data,at)[0]
          assert aa[:8]==bb[:8]==b'RVG3\r\n\x1a\n'
          assert u(aa,24)==0x70f4851184 and u(bb,24)==0x70f4851188
          assert u(aa,40)==32707013373 and u(bb,40)==32707013374
          sizes=[u(aa,o) for o in (320,328,336,344,352)];assert sizes==[u(bb,o) for o in (320,328,336,344,352)]
          fp_at=len(aa)-8-sizes[4];mask=struct.unpack_from('<I',aa,fp_at+16)[0];assert mask&2
          v1=fp_at+20+16*((mask&1).bit_count());assert u(aa,v1)==0x800000008 and u(bb,v1)==0x100000001a
          counter_at=fp_at-8;assert u(aa,counter_at)==0 and u(bb,counter_at)==1
          excluded=[(24,32),(40,48),(counter_at,counter_at+8),(v1,v1+8),(len(aa)-8,len(aa))]
          at=0
          for start,end in sorted(excluded):
           for pos in range(at,start,1048576):assert aa[pos:min(pos+1048576,start)]==bb[pos:min(pos+1048576,start)],str(pos)
           at=end
          assert at==len(aa)
        proof={'opcode':'0x2e606801','source_v0_4h':[7,11,8,0],'old_v1_2s':[8,8],'destination_v1_2s':[26,16],'instructions':32707013374,'pc':'0x70f4851188','counter_subtick_before':0,'counter_subtick_after':1,'all_other_bytes_unchanged_except_final_checksum':True,'checkpoint_sha256':r['checkpoint_sha256']}
        pathlib.Path('evidence/c62-source/adalp-crossing.json').write_text(json.dumps(proof,indent=2)+'\n')
        PYCODE
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c62-2/runtime-evidence.json'));const z=r.processes.find(p=>p.name==='zygote64');assert.equal(z.verified,true);assert.equal(z.observed_comm,'main');assert.equal(r.reasons.includes('live_process_missing:zygote64'),false);assert.equal(r.framework_runtime_verified,false);
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c62-stage-2-verified-checkpoint
        path: |-
          evidence/c62-2/
          !evidence/c62-2/native/journal/**
          !evidence/c62-2/native/current.rvg
          !evidence/c62-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: rm -rf evidence/c62-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c62-stage-2-diagnostics
        path: |-
          evidence/c62-2/*.json
          evidence/c62-2/*.txt
          evidence/c62-2/*.log
          evidence/c62-2/native/*.json
          evidence/c62-2/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C62 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c62-2 evidence/c62-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c62-2/c42-progress.json 1000000 2147483648 > evidence/c62-source/stage-3.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c62-stage-3-verified-checkpoint
        path: |-
          evidence/c62-3/
          !evidence/c62-3/native/journal/**
          !evidence/c62-3/native/current.rvg
          !evidence/c62-3/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: rm -rf evidence/c62-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c62-stage-3-diagnostics
        path: |-
          evidence/c62-3/*.json
          evidence/c62-3/*.txt
          evidence/c62-3/*.log
          evidence/c62-3/native/*.json
          evidence/c62-3/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C62 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c62-3 evidence/c62-4 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c62-3/c42-progress.json 1000000000 2147483648 > evidence/c62-source/stage-4.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s4.outcome == 'success'
      with:
        name: reverse-c62-stage-4-verified-checkpoint
        path: |-
          evidence/c62-4/
          !evidence/c62-4/native/journal/**
          !evidence/c62-4/native/current.rvg
          !evidence/c62-4/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s4.outcome == 'success'
      run: rm -rf evidence/c62-3
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s4.outcome == 'failure'
      with:
        name: reverse-c62-stage-4-diagnostics
        path: |-
          evidence/c62-4/*.json
          evidence/c62-4/*.txt
          evidence/c62-4/*.log
          evidence/c62-4/native/*.json
