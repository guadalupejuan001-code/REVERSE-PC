name: Android C65 non-saturating indexed integer multiplication and compact continuation
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    paths:
    - .github/workflows/android-c65-indexed-integer-compact-continue.yml
    - CMakeLists.txt
    - src/minimal_guest_simd.inc
    - tests/minimal_guest_indexed_integer_test.cpp
    - docs/ANDROID_C65_INDEXED_INTEGER_COMPACT.md
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'fix/android-c65-indexed-integer-compact' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Verify exact CPU scope and build the pinned original model
      run: |
        set -euo pipefail
        mkdir -p evidence/c65-native build
        git diff --exit-code e10be8882581644c4f8dab590e60c9707fcdd1c1 HEAD -- src scripts patches third_party tools ':(exclude)src/minimal_guest_simd.inc'
        python3 - <<'PYCODE'
        import pathlib,subprocess
        p='src/minimal_guest_simd.inc';old=subprocess.check_output(['git','show','e10be8882581644c4f8dab590e60c9707fcdd1c1:'+p]).decode();new=pathlib.Path(p).read_text();a=new.index('  const auto indexed_integer=');b=new.index('  ArmFloat fp(floating_);',a);assert new[:a]+new[b:]==old
        PYCODE
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
    - name: Verify 36 indexed integer forms, original neighbors, UBSan and original compact decoding
      run: |
        set -euo pipefail
        FLAGS='-std=c++17 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -DREVERSE_PC_COMPACT_INDEX_LOOKASIDE=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools'
        for item in indexed_integer fmul_element fp_pairwise_scalar; do
         g++ $FLAGS -O2 tests/minimal_guest_${item}_test.cpp build/softfloat/libreverse_softfloat.a -o build/c65-$item
         build/c65-$item > evidence/c65-native/$item.json
        done
        g++ $FLAGS -O1 -fsanitize=undefined -fno-sanitize-recover=all tests/minimal_guest_indexed_integer_test.cpp build/softfloat/libreverse_softfloat.a -o build/c65-indexed-ubsan
        build/c65-indexed-ubsan > evidence/c65-native/ubsan.json
        g++ $FLAGS -O2 tests/guest_checkpoint_view_test.cpp build/softfloat/libreverse_softfloat.a -o build/c65-view
        build/c65-view build/c65-view-data > evidence/c65-native/original-decoder.json
        HOST='-DREVERSE_PC_COMPACT_RESTORE_VIEW=1 -DREVERSE_PC_OPENSSL_DISK_SHA=1'
        g++ $FLAGS $HOST -O3 tools/guest_c27_profile_resume.cpp build/softfloat/libreverse_softfloat.a -lcrypto -o evidence/c65-native/native
        evidence/c65-native/native --pins > evidence/c65-native/native-pins.json
        sha256sum evidence/c65-native/native > evidence/c65-native/binary-sha256.txt
        g++ --version > evidence/c65-native/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c65-tested-native
        path: evidence/c65-native
        retention-days: 90
        compression-level: 1
  arm-hardware:
    if: github.event.pull_request.head.ref == 'fix/android-c65-indexed-integer-compact' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - name: Compare every allocated non-saturating indexed multiplication family on physical ARM
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        mkdir -p evidence/c65-arm
        python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
        python3 scripts/build-softfloat.py
        g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -DREVERSE_PC_NUMERIC_BYTE_STORES=1 -DREVERSE_PC_COMPACT_INDEX_LOOKASIDE=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tests/minimal_guest_indexed_integer_test.cpp build/softfloat/libreverse_softfloat.a -o build/c65-arm
        build/c65-arm > evidence/c65-arm/hardware.json
        python3 - <<'PY'
        import json
        r=json.load(open('evidence/c65-arm/hardware.json'))
        assert r['native_hardware_cases']>=184321
        PY
        uname -a > evidence/c65-arm/machine.txt
        g++ --version > evidence/c65-arm/compiler.txt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverse-c65-arm-hardware
        path: evidence/c65-arm
        retention-days: 90
        compression-level: 1
  android-continuation:
    needs:
    - native
    - arm-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c65-tested-native
        path: native-build
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c64-tested-native
        run-id: 41977720897
        github-token: ${{ github.token }}
        path: reference-build
    - name: Wait for independently produced clean C64 stage 12
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p evidence/c65-source
        for c65_artifact_attempt in $(seq 1 240); do
          gh api repos/guadalupejuan001-code/REVERSE-PC/actions/runs/41981576403/artifacts > evidence/c65-source/c64-artifacts.json
          if node --input-type=module <<'NODE'
        import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c65-source/c64-artifacts.json'));process.exit(r.artifacts.some(a=>a.name==='reverse-c64-stage-12-verified-checkpoint'&&!a.expired)?0:1);
        NODE
          then exit 0; fi
          sleep 30
        done
        echo 'Original clean C64 stage 12 was not published within the bounded wait' >&2
        exit 1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c64-stage-12-verified-checkpoint
        run-id: 41981576403
        github-token: ${{ github.token }}
        path: source-c64-stage12
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c53-tested-native
        run-id: 41937211283
        github-token: ${{ github.token }}
        path: original-decoder
    - name: Authenticate independently pinned clean C64 stage 12, tested C64 reference CPU and original decoder
      run: |
        set -euo pipefail
        mkdir -p evidence/c65-source
        cp original-decoder/frame native-build/frame
        chmod +x native-build/native native-build/frame reference-build/native
        test "$(sha256sum native-build/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
        test "$(sha256sum reference-build/native | cut -d ' ' -f 1)" = 'fe906218dcb3bb5db3236d67e0dbfef6b49162b2a62f4ec88f8a570eabe39b80'
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {preflight} from './tools/android_c27_profile_resume.mjs';
        const c=JSON.parse(readFileSync('source-c64-stage12/output-contract.json')),p=preflight(c,'source-c64-stage12',{maxTransportBytes:2147483648});assert.equal(c.source_commit,'e10be8882581644c4f8dab590e60c9707fcdd1c1');assert.equal(c.checkpoint_sha256,'4dda154c7b16e6b1da0c022b5cb3c5437541c47f6f3d7af5b1d9236e62d2c018');assert.equal(p.report.guest.instructions,47610133924);writeFileSync('evidence/c65-source/preflight.json',JSON.stringify(c,null,2)+String.fromCharCode(10));
        NODE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-manifest
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-aa
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ab
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: reverse-c47-original-media-ac
        run-id: 41919163772
        github-token: ${{ github.token }}
        path: media-input
    - name: Restore and authenticate the unchanged original Android disk
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,hashlib
        root=pathlib.Path('media-input');m=json.loads((root/'manifest.json').read_text());assert m['disk_bytes']==10888413184 and m['disk_sha256']=='4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e';assert [r['file'] for r in m['parts']]==['disk.part-aa','disk.part-ab','disk.part-ac']
        for r in m['parts']:
         p=root/r['file'];assert p.stat().st_size==r['bytes'];h=hashlib.sha256()
         with p.open('rb') as f:
          for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
         assert h.hexdigest()==r['sha256']
        PYCODE
        mkdir new-media
        cat media-input/disk.part-aa media-input/disk.part-ab media-input/disk.part-ac | gzip -dc > new-media/android-c27.raw
        test "$(stat -c %s new-media/android-c27.raw)" = 10888413184
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
        cp media-input/media.json evidence/c65-source/media.json
        cp media-input/manifest.json evidence/c65-source/media-transport.json
        rm -rf media-input
        fallocate --dig-holes new-media/android-c27.raw
        test "$(sha256sum new-media/android-c27.raw | cut -d ' ' -f 1)" = '4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e'
    - name: Independently replay the original C64 CPU to the clean pre-MUL boundary
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';import {run} from './tools/android_c27_profile_resume.mjs';
        const r=await run(JSON.parse(readFileSync('source-c64-stage12/output-contract.json')),'source-c64-stage12','reference-build/native','new-media/android-c27.raw','evidence/c65-reference',{wallMs:900000,instructions:1572646108,cycles:1,maxTransportBytes:2147483648});writeFileSync('evidence/c65-source/reference.json',JSON.stringify(r,null,2)+String.fromCharCode(10));assert.equal(r.process.status,'process_completed');assert.equal(r.result.execution_progress_accepted,true);assert.equal(JSON.parse(readFileSync('evidence/c65-reference/current.json')).guest.instructions,49182780032);assert.equal(r.result.checkpoint_sha256,'b7db828deb43d0edfa0e071d1b43a0ce793cb0491396d088de62447b29e756c0');
        NODE
    - name: C65 stage 1 execute and verify the authentic Android machine
      id: s1
      if: success()
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs source-c64-stage12 evidence/c65-1 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" source-c64-stage12/c42-progress.json 1572646108 2147483648 > evidence/c65-source/stage-1.json
        cmp evidence/c65-reference/current.rvg evidence/c65-1/current.rvg
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('evidence/c65-1/current.json'));assert.equal(r.guest.instructions,49182780032);assert.equal(r.error,'');assert.equal(r.checkpoint_sha256,'b7db828deb43d0edfa0e071d1b43a0ce793cb0491396d088de62447b29e756c0');
        NODE
        rm -rf evidence/c65-reference reference-build
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const p=JSON.parse(readFileSync('evidence/c65-1/c42-progress.json'));assert.equal(p.zygote_pid,567);assert.equal(p.zygote_comm,'main');assert.equal(p.android_boot_completed_verified,false);
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s1.outcome == 'success'
      with:
        name: reverse-c65-stage-1-verified-checkpoint
        path: |-
          evidence/c65-1/
          !evidence/c65-1/native/journal/**
          !evidence/c65-1/native/current.rvg
          !evidence/c65-1/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s1.outcome == 'failure'
      with:
        name: reverse-c65-stage-1-diagnostics
        path: |-
          evidence/c65-1/*.json
          evidence/c65-1/*.txt
          evidence/c65-1/*.log
          evidence/c65-1/native/*.json
          evidence/c65-1/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C65 stage 2 execute and verify the authentic Android machine
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c65-1 evidence/c65-2 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c65-1/c42-progress.json 1 2147483648 > evidence/c65-source/stage-2.json
        python3 - <<'PYCODE'
        import json,struct,mmap,pathlib
        before=pathlib.Path('evidence/c65-1/current.rvg');after=pathlib.Path('evidence/c65-2/current.rvg');r=json.load(open('evidence/c65-2/current.json'))
        assert r['guest']['instructions']==49182780033 and r['guest']['pc']=='0x70abf9815c' and not r['error']
        with before.open('rb') as fa,after.open('rb') as fb:
         with mmap.mmap(fa.fileno(),0,access=mmap.ACCESS_READ) as aa,mmap.mmap(fb.fileno(),0,access=mmap.ACCESS_READ) as bb:
          assert len(aa)==len(bb);u=lambda data,at:struct.unpack_from('<Q',data,at)[0]
          assert aa[:8]==bb[:8]==b'RVG3\r\n\x1a\n'
          assert u(aa,24)==0x70abf98158 and u(bb,24)==0x70abf9815c
          assert u(aa,40)==49182780032 and u(bb,40)==49182780033
          sizes=[u(aa,o) for o in (320,328,336,344,352)];assert sizes==[u(bb,o) for o in (320,328,336,344,352)]
          fp_at=len(aa)-8-sizes[4];mask=struct.unpack_from('<I',aa,fp_at+16)[0];assert mask==struct.unpack_from('<I',bb,fp_at+16)[0] and mask&(1<<16)
          v5=fp_at+20+16*((mask&31).bit_count());v16=fp_at+20+16*((mask&65535).bit_count())
          assert aa[v5:v5+16]==bb[v5:v5+16]==bytes.fromhex('cc090000000000000000000000000000')
          assert aa[v16:v16+16]==bytes.fromhex('73130000be0b00008019000098150000')
          assert bb[v16:v16+16]==bytes.fromhex('a48abe006809730000d2f900208dd300')
          assert struct.unpack_from('<II',aa,fp_at+8)==struct.unpack_from('<II',bb,fp_at+8)==(0,17)
          counter_at=fp_at-8;assert u(aa,counter_at)==3 and u(bb,counter_at)==4
          excluded=[(24,32),(40,48),(counter_at,counter_at+8),(v16,v16+16),(len(aa)-8,len(aa))]
          at=0
          for start,end in sorted(excluded):
           for pos in range(at,start,1048576):assert aa[pos:min(pos+1048576,start)]==bb[pos:min(pos+1048576,start)],str(pos)
           at=end
          assert at==len(aa)
        proof={'opcode':'0x4f858210','instruction':'MUL V16.4S,V16.4S,V5.S[0]','source_v16':'73130000be0b00008019000098150000','factor':2508,'destination_v16':'a48abe006809730000d2f900208dd300','instructions':49182780033,'pc':'0x70abf9815c','counter_subtick_before':3,'counter_subtick_after':4,'all_original_bytes_unchanged_except_exact_v16_pc_count_phase_and_checksum':True,'other_31_vectors_and_fpcr_fpsr_unchanged':True,'checkpoint_sha256':r['checkpoint_sha256']}
        pathlib.Path('evidence/c65-source/indexed-integer-crossing.json').write_text(json.dumps(proof,indent=2)+chr(10))
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s2.outcome == 'success'
      with:
        name: reverse-c65-stage-2-verified-checkpoint
        path: |-
          evidence/c65-2/
          !evidence/c65-2/native/journal/**
          !evidence/c65-2/native/current.rvg
          !evidence/c65-2/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s2.outcome == 'success'
      run: |
        rm -rf evidence/c65-1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s2.outcome == 'failure'
      with:
        name: reverse-c65-stage-2-diagnostics
        path: |-
          evidence/c65-2/*.json
          evidence/c65-2/*.txt
          evidence/c65-2/*.log
          evidence/c65-2/native/*.json
          evidence/c65-2/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C65 stage 3 execute and verify the authentic Android machine
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c65-2 evidence/c65-3 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c65-2/c42-progress.json 1000000 2147483648 > evidence/c65-source/stage-3.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s3.outcome == 'success'
      with:
        name: reverse-c65-stage-3-verified-checkpoint
        path: |-
          evidence/c65-3/
          !evidence/c65-3/native/journal/**
          !evidence/c65-3/native/current.rvg
          !evidence/c65-3/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s3.outcome == 'success'
      run: |
        rm -rf evidence/c65-2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.s3.outcome == 'failure'
      with:
        name: reverse-c65-stage-3-diagnostics
        path: |-
          evidence/c65-3/*.json
          evidence/c65-3/*.txt
          evidence/c65-3/*.log
          evidence/c65-3/native/*.json
          evidence/c65-3/native/*.log
        if-no-files-found: warn
        retention-days: 90
        compression-level: 1
    - name: C65 stage 4 execute and verify the authentic Android machine
      id: s4
      if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.visual != 'true'
      run: |
        set -euo pipefail
        COMMIT=$(git rev-parse HEAD)
        node tools/android_c46_continue.mjs evidence/c65-3 evidence/c65-4 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c65-3/c42-progress.json 1000000000 2147483648 > evidence/c65-source/stage-4.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.s4.outcome == 'success'
      with:
        name: reverse-c65-stage-4-verified-checkpoint
        path: |-
          evidence/c65-4/
          !evidence/c65-4/native/journal/**
          !evidence/c65-4/native/current.rvg
          !evidence/c65-4/native/frame.ppm
        if-no-files-found: error
        retention-days: 90
        compression-level: 1
    - name: Release the previously uploaded temporary stage
      if: steps.s4.outcome == 'success'
      run: |
        rm -rf evidence/c65-3
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
