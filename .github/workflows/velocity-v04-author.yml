name: Reverse Velocity — regenerate authored XI scenes
on:
  push:
    branches: [feature/velocity-v04-nitro-airjump-20261101, feature/velocity-v18-garage-photo-hud-20261101, feature/velocity-v19-orbit-textures-20261101, feature/velocity-v20-effects-drift-20261101]
    paths:
      - 'scripts/author-velocity-scene.cjs'
      - 'scripts/emit-velocity-car-scene.cjs'
      - 'scripts/velocity-materials.cjs'
      - 'scripts/velocity-textures.cjs'
      - 'scripts/velocity-textures-contract.cjs'
      - 'scripts/velocity-landscape-post.cjs'
      - 'scripts/check-velocity-native-only.cjs'
      - '.github/workflows/velocity-v04-author.yml'
permissions:
  contents: write
concurrency:
  group: velocity-authored-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authored-xi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate 3D car and XI texture authoring
        run: |
          node scripts/velocity-car-contract.cjs
          node scripts/velocity-textures-contract.cjs
          node scripts/check-velocity-native-only.cjs
      - name: Generate real XI graphics source from canonical JavaScript authoring
        run: |
          node scripts/author-velocity-scene.cjs
          git diff --check
      - name: Commit reproducible XI scene and 256-entry material palette
        run: |
          git add reverse-os-android/app/src/main/assets/velocity/render.xi
          git add reverse-os-android/app/src/main/assets/velocity/render4k.xi
          git add reverse-os-android/app/src/main/assets/velocity/render-native4k.xi
          git add reverse-os-android/app/src/main/assets/velocity/palette.txt
          if git diff --cached --quiet; then
            echo 'Generated XI assets already match the source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(velocity): regenerate XI 1.7 pneumatic/photometric scene assets'
          git push origin "HEAD:${GITHUB_REF_NAME}"
