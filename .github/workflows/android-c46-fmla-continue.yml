          node tools/android_c46_continue.mjs evidence/c46-3 evidence/c46-4 native-build/native new-media/android-c27.raw native-build/frame "$COMMIT" evidence/c46-3/c42-progress.json 1000000000 > evidence/c46-source/stage-4.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.s4.outcome == 'success'
