            evidence/c46-3/*.txt
            evidence/c46-3/*.log
            evidence/c46-3/native/*.json
            evidence/c46-3/native/*.log
          if-no-files-found: warn
          retention-days: 90
      - name: C46 stage 4 execute and verify the authentic Android machine
        id: s4
        if: success() && steps.s3.outcome == 'success' && steps.s3.outputs.boot != 'true'
        run: |
          set -euo pipefail
