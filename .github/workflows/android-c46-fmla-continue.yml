            evidence/c46-8/*.json
            evidence/c46-8/*.txt
            evidence/c46-8/*.log
            evidence/c46-8/native/*.json
            evidence/c46-8/native/*.log
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c46-source-and-progress-evidence
          path: evidence/c46-source
          retention-days: 90
      - name: Report verified completion or the exact next pending boundary
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {existsSync,readFileSync} from 'node:fs';
          const reports=Array.from({length:8},(_,i)=>'evidence/c46-source/stage-'+(i+1)+'.json').filter(existsSync).map(p=>JSON.parse(readFileSync(p)));
          const last=reports.at(-1);assert.ok(last,'No authenticated continuation completed');
          console.log(JSON.stringify(last,null,2));assert.equal(last.android_boot_completed_verified,true,'Stages ended at a verified boundary; completed Android boot is still pending');
          NODE

