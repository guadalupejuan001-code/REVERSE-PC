name: Android C27 fresh blank data and verified original partitions
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/android-c27-fresh-data.yml'
      - 'tools/guest_c27_fresh.cpp'
      - 'tools/android_c27_*.mjs'
      - 'tools/android_guest_outcome.mjs'
      - 'tests/android_c27_result.test.mjs'
permissions:
  contents: read
  actions: read
jobs:
  fresh-verified-blank-data:
    if: github.event.pull_request.head.ref == 'fix/android-c27-blank-data-20261030' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify unchanged runtime and real failure classification
        run: |
          set -euo pipefail
          mkdir -p evidence/c27-media evidence/c27-boot build
          git diff --exit-code 08d7ef241f61c5e4cb5bfc0e5b3258826adee8bd HEAD -- src third_party scripts patches
          node --test tests/android_guest_outcome.test.mjs tests/android_userdata_disk.test.mjs tests/android_c27_result.test.mjs tests/android_supervised_cycle.test.mjs > evidence/c27-media/host-tests.tap
          git rev-parse HEAD > evidence/c27-media/source-commit.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-android-c03-genuine-partition-disk
          run-id: 40910284394
          github-token: ${{ github.token }}
          path: disk-input
      - name: Prepare new zero data media and preserve every original partition payload
        run: |
          set -euo pipefail
          export ORIGINAL=$(find disk-input -name android-slot-a.raw -print -quit)
          test -n "$ORIGINAL"
          node tools/android_c27_media.mjs "$ORIGINAL" new-media > evidence/c27-media/media-stdout.json
          cp new-media/media.json evidence/c27-media/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c27-continuation-media
          path: evidence/c27-media/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reverse-c21-fresh-apex-android
          run-id: 41102829244
          github-token: ${{ github.token }}
          path: input-profile
      - name: Compile a fresh CPU with unchanged kernel ramdisk and signed system
        run: |
          set -euo pipefail
          echo '8c26488967ee3a9b2a55313810e92bce5ee2a182dbe81e8374bd2f6d3007ea05  input-profile/current.rvg' | sha256sum --check
          tar -xzf input-profile/tested-source.tar.gz build/ether-compat build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc -Itools tools/guest_c27_fresh.cpp build/softfloat/libreverse_softfloat.a -o build/c27-native
          tar -czf evidence/c27-media/tested-source.tar.gz src tools tests scripts third_party patches build/ether-compat build/softfloat/libreverse_softfloat.a deps/mundo-x/native/include
          sha256sum build/c27-native evidence/c27-media/tested-source.tar.gz > evidence/c27-media/build-sha256.txt
          cp evidence/c27-media/source-commit.txt evidence/c27-media/tested-source.tar.gz evidence/c27-media/build-sha256.txt evidence/c27-media/media.json evidence/c27-boot/
          build/c27-native --pins > evidence/c27-boot/compiled-native-pins.json
          node tools/android_c27_result.mjs pins evidence/c27-boot/compiled-native-pins.json > evidence/c27-boot/compiled-pins-verification.json
      - name: Start the native continuation under its bounded supervisor
        run: |
          set -euo pipefail
          date +%s > build/c27-started.txt
          nohup bash -c 'set +e; node tools/android_c27_run.mjs input-profile/current.rvg build/c27-native new-media/android-c27.raw evidence/c27-boot/native 900000 > evidence/c27-boot/supervised-stdout.json 2> evidence/c27-boot/supervisor.log; cycle_exit=$?; printf "%s\n" "$cycle_exit" > evidence/c27-boot/runner-exit.pending; mv evidence/c27-boot/runner-exit.pending evidence/c27-boot/runner-exit.txt' </dev/null >/dev/null 2>&1 &
          echo "$!" > build/c27-runner.pid
          cat > build/c27-wait-prefix.mjs <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync as read,writeFileSync as write,existsSync,linkSync,statSync} from 'node:fs';import {join} from 'node:path';import {setTimeout as delay} from 'node:timers/promises';import {pinC27} from '../tools/android_c27_result.mjs';
          const [output,elapsed]=process.argv.slice(2),minimumElapsedMs=Number(elapsed),root='evidence/c27-boot',journal=root+'/native/journal';
          const sourceCommit=read('evidence/c27-media/source-commit.txt','utf8').trim(),deadline=Date.now()+16*60*1000;
          for(;;){
            if(minimumElapsedMs>60000&&existsSync(root+'/runner-exit.txt')){console.log('Native finished; preserve final canonical evidence');break;}
            try{
              if(existsSync(journal+'/latest.json')){
                const pointer=JSON.parse(read(journal+'/latest.json'));assert.match(pointer.generation,/^generation-[1-9][0-9]*$/);const report=JSON.parse(read(join(journal,pointer.generation,'report.json')));
                if(report.error||report.host_elapsed_ms>=minimumElapsedMs||existsSync(root+'/runner-exit.txt')){
                  const result=pinC27(journal,output,sourceCommit);
                  if(result.status==='pinned'){
                    const frame=root+'/native/frame.ppm';
                    if(existsSync(frame)&&statSync(frame).size<=64*1024*1024){linkSync(frame,output+'/captured-frame.ppm');write(output+'/frame-observation.json',JSON.stringify({captured_by_same_native_continuation:true,not_bound_to_exact_checkpoint_boundary:true,android_display_content_requires_visual_review:true})+'\n');}
                    console.log(JSON.stringify(result));break;
                  }
                }
              }
            }catch(e){if(e.code!=='ENOENT')throw e;}
            assert.ok(!existsSync(root+'/runner-exit.txt'),'Native process ended without a valid observed generation');assert.ok(Date.now()<deadline,'Timed out waiting for a published native generation');await delay(2000);
          }
          NODE
      - name: Verify and freeze the first minute of actual progress
        continue-on-error: true
        run: node build/c27-wait-prefix.mjs evidence/c27-observed-early 60000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c27-observed-early
          path: evidence/c27-observed-early/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
      - name: Verify and freeze the first fifteen minutes of actual progress
        continue-on-error: true
        run: node build/c27-wait-prefix.mjs evidence/c27-observed-15m 900000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c27-observed-15m
          path: evidence/c27-observed-15m/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
      - name: Wait for the same native CPU to finish its bounded continuation
        if: always()
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync,existsSync} from 'node:fs';import {setTimeout as delay} from 'node:timers/promises';
          const deadline=Number(readFileSync('build/c27-started.txt','utf8').trim())*1000+70*60*1000,file='evidence/c27-boot/runner-exit.txt';
          while(!existsSync(file)){assert.ok(Date.now()<deadline,'Native supervisor completion deadline');await delay(5000);}
          const code=readFileSync(file,'utf8').trim();assert.equal(code,'0','Native continuation failed; inspect preserved result and checkpoint');
          NODE
      - name: Publish canonical final evidence without duplicating journal generations
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,os,json,re
          root=Path('evidence/c27-boot');native=root/'native'
          if (native/'current.rvg').exists():
              os.link(native/'current.rvg',root/'current.rvg')
              for name in ['current.json','result.json','process-outcome.json','native-pins.json','native-pins-verification.json','console-new.txt']:
                  if (native/name).exists():shutil.copyfile(native/name,root/name)
          elif (native/'journal/latest.json').exists():
              p=json.loads((native/'journal/latest.json').read_text());assert re.fullmatch('generation-[1-9][0-9]*',p['generation'])
              generation=native/'journal'/p['generation'];os.link(generation/'checkpoint.rvg',root/'recovery-prefix.rvg');shutil.copyfile(generation/'report.json',root/'recovery-prefix.json')
          if (native/'frame.ppm').exists():os.link(native/'frame.ppm',root/'frame.ppm')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverse-c27-fresh-blank-data
          path: |
            evidence/c27-boot/
            !evidence/c27-boot/native/journal/**
            !evidence/c27-boot/native/current.rvg
            !evidence/c27-boot/native/frame.ppm
            !evidence/c27-boot/native/frame.pending.ppm
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Require genuine progress and preserve distinct framework/display evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync('evidence/c27-boot/'+p));
          assert.equal(read('native/process-outcome.json').status,'process_completed');const r=read('native/result.json');assert.equal(r.execution_progress_accepted,true);assert.ok(r.advanced_instructions>0);assert.equal(r.old_cpu_or_init_proof_reused,false);assert.equal(r.fresh_machine,true);assert.equal(r.first_user_instruction_verified,true);assert.equal(r.source_initrd_unchanged,true);
          console.log('Genuine fresh blank-data boot preserved. Full Android framework/display success requires actual runtime evidence.');
          NODE
