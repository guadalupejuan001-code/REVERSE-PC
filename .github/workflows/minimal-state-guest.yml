name: Minimal-state ARM64 guest
on:
  pull_request:
    paths: ['src/minimal_guest*.hpp', 'src/reverse_guest.cpp', 'tests/minimal_guest*', 'examples/guest-aarch64.S', 'reverse-os-android/**', 'CMakeLists.txt', '.github/workflows/minimal-state-guest.yml']
  push:
    branches: [main]
    paths: ['src/minimal_guest*.hpp', 'src/reverse_guest.cpp', 'tests/minimal_guest*', 'examples/guest-aarch64.S', 'reverse-os-android/**', '.github/workflows/minimal-state-guest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: guadalupejuan001-code/mundo-X, ref: e2778d962af22f6f1a0794058dd4685fc2573966, path: deps/mundo-x, persist-credentials: false}
      - name: Install independent assembler and execution oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld qemu-user
      - name: Build the own guest CPU and run correctness checks
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O1 -DREVERSE_PC_BUILD_PREVIOUS_MAIN_REFERENCE=OFF
          cmake --build build --target reverse_guest reverse_pc_minimal_guest --parallel 2
          mkdir -p guest-evidence
          build/reverse_pc_minimal_guest > guest-evidence/native-tests.json
          build/reverse_guest demo guest-evidence/demo.rvg > guest-evidence/demo.json
          python3 tests/minimal_guest_cli.py build/reverse_guest > guest-evidence/checkpoints.json
      - name: Compare an independently assembled ARM64 ELF against QEMU
        run: |
          clang --target=aarch64-linux-gnu -fuse-ld=lld -nostdlib -static -Wl,--build-id=none -o guest-evidence/clang-guest.elf examples/guest-aarch64.S
          python3 tests/minimal_guest_cli.py build/reverse_guest guest-evidence/clang-guest.elf > guest-evidence/independent-oracle.json
          clang --version > guest-evidence/clang-version.txt
          qemu-aarch64 --version > guest-evidence/oracle-version.txt
      - name: Check undefined behavior and failed transactions
        run: |
          g++ -std=c++17 -O1 -fsanitize=undefined -fno-sanitize-recover=all -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc tests/minimal_guest_test.cpp -o build/guest-ubsan
          build/guest-ubsan > guest-evidence/ubsan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: minimal-state-guest-native, path: guest-evidence/, retention-days: 14}
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVERSE_SIGNING_KEYSTORE: ${{ github.workspace }}/build-signing/guest-preview.jks
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: guadalupejuan001-code/mundo-X, ref: e2778d962af22f6f1a0794058dd4685fc2573966, path: deps/mundo-x, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Reuse the owner's verified released application assets
        run: |
          mkdir -p guest-evidence guest-dist build-signing
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/reverse-base.apk" https://github.com/guadalupejuan001-code/REVERSE-PC/releases/download/v2.5.1/REVERSE-v2.5.1.apk
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'reverse-base.apk'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='62c35d9020b2ad497983544775546c399bdcff46affe89a1c615e62add692aa2'
          with zipfile.ZipFile(source) as archive:
              for name in archive.namelist():
                  if name.startswith(('assets/native-apps/','assets/bbyq/','assets/bbyq-interface/')) and not name.endswith('/'):
                      target=Path('reverse-os-android/app/src/main')/name
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(archive.read(name))
          Path('reverse-os-android/app/src/main/assets/workbench/build-info.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'bbyq_version':'E025-Chain-1','w4u_version':'0.1','guest_version':'0.1','mundo_x_commit':'e2778d962af22f6f1a0794058dd4685fc2573966'})+'\n')
          PY
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          keytool -genkeypair -keystore "$REVERSE_SIGNING_KEYSTORE" -storetype JKS -storepass android -keypass android -alias reverse-desktop -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=REVERSE Guest Preview Development'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' platform-tools 'system-images;android-35;default;x86_64' > guest-evidence/sdk.log
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -version > guest-evidence/emulator-version.txt
      - name: Build ARM64/x86_64 preview and instrumentation
        run: |
          gradle -p reverse-os-android --no-daemon :app:assembleGuestDebug :app:assembleGuestDebugAndroidTest > guest-evidence/gradle.log 2>&1 || { tail -160 guest-evidence/gradle.log; exit 1; }
          cp reverse-os-android/app/build/outputs/apk/guest/debug/app-guest-debug.apk guest-dist/REVERSE-Guest-v0.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs guest-dist/REVERSE-Guest-v0.1.apk > guest-evidence/signature.txt
          sudo chmod a+rw /dev/kvm
      - name: Exercise guest CPU, XI delta and persistence on Android 15
        timeout-minutes: 10
        shell: bash
        run: |
            set -euo pipefail
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            export ANDROID_AVD_HOME="$RUNNER_TEMP/reverse-guest-avd"
            mkdir -p "$ANDROID_AVD_HOME"
            printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n guest -p "$ANDROID_AVD_HOME/guest.avd" -k 'system-images;android-35;default;x86_64'
            "$ANDROID_HOME/emulator/emulator" -avd guest -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > guest-evidence/emulator.log 2>&1 &
            GUEST_EMULATOR_PID=$!
            trap 'adb logcat -d > guest-evidence/logcat.txt 2>/dev/null || true; kill "$GUEST_EMULATOR_PID" 2>/dev/null || true' EXIT
            ready=false
            for i in $(seq 1 115); do
              if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; then ready=true;break;fi
              sleep 2
            done
            test "$ready" = true
            adb shell input keyevent 82
            adb shell wm size 720x1600
            adb shell wm density 280
            adb install -r guest-dist/REVERSE-Guest-v0.1.apk
            adb install -r reverse-os-android/app/build/outputs/apk/androidTest/guest/debug/app-guest-debug-androidTest.apk
            adb shell am instrument -w -e mode guest com.reversepc.guest.workbench.test/com.reversepc.os.WorkbenchTestRunner | tee guest-evidence/android-guest.txt
            grep 'WORKBENCH_TESTS_OK mode=guest ' guest-evidence/android-guest.txt
            adb shell am force-stop com.reversepc.guest.workbench
            adb shell am instrument -w -e mode guestRestore com.reversepc.guest.workbench.test/com.reversepc.os.WorkbenchTestRunner | tee guest-evidence/android-restore.txt
            grep 'WORKBENCH_TESTS_OK mode=guestRestore ' guest-evidence/android-restore.txt
            adb exec-out screencap -p > guest-evidence/android-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REVERSE-Guest-v0.1-preview
          path: |
            guest-dist/
            guest-evidence/
          retention-days: 14
